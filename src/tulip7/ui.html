<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffaf0; --cream:#f6ecd6; --ink:#2a2018; --muted:#75604a; --line:rgba(90,58,34,.2);
  --delft:#1f4e9c; --delft2:#e2eaf8; --delft3:#163a76; --tulip:#d7261e; --leaf:#3f8a4a; --gold:#e0a82e; --gold2:#a87618; --goldl:#c9a24a;
  --good:#2f8a4a; --bad:#c0392b; --oak:#4a2c18; --oak2:#2e1a0e;
  --cw:112px; --mw:50px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
.wrap>*,.main>*,.rivals>*,.center>*{min-width:0}
body{min-height:100vh;color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;background:#2a1a0f}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg) center/cover no-repeat;filter:blur(3px) brightness(.8);transform:scale(1.03)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 30%,rgba(40,20,8,0),rgba(30,14,4,.55))}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:10px 16px 26px;display:grid;gap:10px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff6e2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.top .hl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;color:#fff6e2;text-decoration:none;display:block}
.top h1{font-size:38px;line-height:1}
.top h1 span{color:#ffd45c}
.top .logo{height:46px;display:block}
.top .where{font-style:italic;font-family:"EB Garamond",serif;font-size:18px}
.top .sp{flex:1}
.tbtn{background:rgba(255,250,240,.92);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;text-shadow:none}
.tbtn:hover{background:#fff}
.tbtn.on{background:var(--delft);color:#fff;border-color:var(--delft)}
.panel{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(30,15,5,.3)}

/* index board + news */
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px}
.board[hidden],.strip[hidden]{display:none}
.cell{border-radius:9px;padding:4px 4px 5px;text-align:center;background:var(--cream);border:1px solid var(--line);font-size:12px;line-height:1.2}
.cell b{display:block;font-family:"EB Garamond",serif;font-size:15px}
.cell .ix{font-weight:700;font-size:15px;color:var(--delft)}
.cell .rk{color:var(--muted)}
.cell.now{background:var(--delft);color:#fff;border-color:var(--delft3);box-shadow:0 0 0 2px #ffd45c}
.cell.now .ix,.cell.now .rk{color:#fff}
.cell.past{opacity:.55}
.cell.dead{opacity:.35;text-decoration:line-through}
.cell.crash{background:#fbe1dc;border-color:#e59a8f}
.cell.crash.hit{background:var(--bad);color:#fff}
.cell.alk{background:#fff2c9;border-color:#e9c96a}
.cell.alk.now{background:var(--gold2);color:#fff}
.cell .rk.hot{color:var(--bad);font-weight:700}
.strip{padding:7px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-family:"EB Garamond",serif;font-size:17px;line-height:1.3}
.strip b{font:700 12.5px "Source Sans 3",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--delft);white-space:nowrap}

/* main: the table + the side panel */
.main{display:grid;grid-template-columns:1fr 318px;gap:14px;align-items:start}
.table{position:relative;margin:12px;border-radius:34px;padding:16px 18px 18px;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(25,8,2,.6) 100%),var(--carpet) center/cover,#7a1f16;
  box-shadow:0 0 0 13px var(--oak),0 0 0 15px var(--oak2),0 0 0 16px rgba(255,220,150,.15),0 22px 50px rgba(0,0,0,.6),inset 0 0 50px rgba(0,0,0,.55)}
.table .glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,190,90,.16),transparent 55%)}
.rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.seat{position:relative;border-radius:18px;padding:8px 10px 10px;background:rgba(20,8,2,.32);transition:box-shadow .2s}
.seat.turn{box-shadow:0 0 0 3px #ffd45c,0 0 24px rgba(255,212,92,.45)}
.seat.pick{cursor:pointer;animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 3px var(--gold)}to{box-shadow:0 0 0 7px rgba(224,168,46,.55)}}
.plate{position:relative;display:flex;align-items:center;gap:8px;background:rgba(255,250,240,.95);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:0 2px 6px rgba(0,0,0,.35);min-height:52px}
.me .plate{padding-left:14px}
.plate img.pt{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:var(--cream);border:2px solid #fff;box-shadow:0 0 0 1px var(--goldl);flex:none}
.plate .who{flex:1;min-width:0;line-height:1.15}
.plate .nm{font-family:"EB Garamond",serif;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .sn{display:none}
.plate .mn{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.plate .mn b{color:var(--ink);font-variant-numeric:tabular-nums}
.plate .chip{position:absolute;top:-11px;right:12px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--cream);color:var(--muted);white-space:nowrap}
.chip.stayed{background:#e2f2e6;color:var(--good)}
.chip.bust{background:#fbe1dc;color:var(--bad)}
.chip.book{background:#efe2fb;color:#6a2ca0}
.chip.turn{background:var(--delft);color:#fff}
.hand{display:flex;flex-wrap:wrap;gap:5px;min-height:calc(var(--mw)*1.4 + 6px);margin-top:8px;position:relative;perspective:800px}
.below{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:20px;flex-wrap:wrap}
.tag{background:rgba(255,250,240,.9);border-radius:999px;padding:1px 9px;font-size:12.5px;color:var(--muted)}
.tag b{color:var(--ink)}
.book{display:flex;gap:3px;align-items:center;background:rgba(255,250,240,.88);border-radius:8px;padding:3px 5px}
.book span{width:22px;height:22px;border-radius:5px;border:1.5px dashed #cdb894;font:700 12px/19px "EB Garamond",serif;text-align:center}
.book span.f{border:1.5px solid #fff;background:var(--c);color:var(--ci);box-shadow:0 0 0 1px var(--line)}
.book small{margin:0 3px 0 5px;color:var(--muted);font-size:12px;white-space:nowrap}
.book.sm{gap:2px;padding:3px 4px}.book.sm span{width:11px;height:11px;border-radius:3px;border-width:1px}
.bubble{position:absolute;top:-22px;left:54px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 11px;font:600 16px "EB Garamond",serif;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:6;animation:pop .18s ease-out;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:16px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:scale(.5);opacity:0}}

.center{display:grid;grid-template-columns:auto auto 1fr;gap:18px;align-items:center;margin:18px 6px}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.pile .stack{position:relative;width:78px;aspect-ratio:5/7}
.pile .stack .card{position:absolute;inset:0;--w:78px;width:78px}
.pile .stack .card:nth-child(1){transform:translate(4px,4px)}
.pile .stack .card:nth-child(2){transform:translate(2px,2px)}
.pile .floor{width:78px;aspect-ratio:5/7;border-radius:9px;border:2px dashed rgba(255,230,180,.45);display:grid;place-items:center;color:rgba(255,240,210,.8);font-size:12px;text-align:center}
.host{display:flex;gap:12px;align-items:center;background:rgba(255,250,240,.94);border-radius:16px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.host img{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid #fff;box-shadow:0 0 0 1px var(--goldl);flex:none}
.host p{margin:0;font-family:"EB Garamond",serif;font-size:19px;line-height:1.3}
.host small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.you{border-radius:18px;padding:8px 10px 12px;background:rgba(20,8,2,.32);position:relative}
.you .plate{max-width:540px}
.you .hand{min-height:calc(var(--cw)*1.4 + 8px);gap:10px}
.tip{background:#fff4cf;border:1px solid #e9c96a;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tip button{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:700}

/* side panel */
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:10px}
.ctrl{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.log{padding:8px 12px;font-size:13px;overflow:auto;max-height:180px}
.log p{margin:0 0 3px}
.odds{font-size:14px;color:var(--muted)}
.odds b{color:var(--ink)} .odds b.hot,.hot{color:var(--bad)}
.meter{height:8px;border-radius:999px;background:#ead9b8;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--gold),var(--bad));background-size:300px 100%;width:0;transition:width .3s}
.stake{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:14px}
.stake b{font:700 32px/1 "EB Garamond",serif;color:var(--ink)}
.danger{display:flex;flex-wrap:wrap;gap:4px}
.dchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px 1px 2px;font-size:12.5px;background:#fbe4df;color:var(--bad);font-weight:700}
.dchip i{width:21px;height:21px;border-radius:50%;background:var(--c);color:var(--ci);font:700 13px/21px "EB Garamond",serif;text-align:center;font-style:normal}
.dchip.safe{background:#e6f2e8;color:var(--good)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px}
.btn img{width:30px;height:30px}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.hit{background:var(--delft);border-color:var(--delft3);color:#fff;justify-content:center;font-size:18px;flex-direction:column;gap:0;text-align:center}
.btn.hit small{color:#dfe8fb}
.btn.purse{background:#fff7e3}.btn.paper{background:#eef3fc}.btn.alk{background:#fff1c4}
.picker{display:flex;flex-direction:column;gap:6px}
.picker .t,.cash .t{font:600 20px "EB Garamond",serif}
.cash{display:flex;flex-direction:column;gap:8px}
.wait{color:var(--muted);font-style:italic;text-align:center;margin:auto}

/* ---------- the card ---------- */
.card{--w:var(--cw);position:relative;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.085);background:var(--c,#c9a24a);padding:calc(var(--w)*.045);box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.35);flex:none;color:var(--ink)}
.card .fr{position:relative;height:100%;border-radius:calc(var(--w)*.055);background:var(--frame,linear-gradient(#fffaf0,#f1e2c2));box-shadow:inset 0 0 0 1.5px var(--goldl),inset 0 0 0 3.5px #fffaf0,inset 0 0 0 4.5px var(--goldl);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.card .win{width:66%;margin-top:9%;aspect-ratio:1/1.08;border-radius:50% 50% 12% 12% / 40% 40% 8% 8%;background:radial-gradient(circle at 50% 42%,#fff 0,color-mix(in srgb,var(--c) 22%,#fffaf0) 72%);box-shadow:inset 0 0 0 1px rgba(150,110,40,.45);display:grid;place-items:center;overflow:hidden}
.card .win img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.card .pip{position:absolute;z-index:2;width:calc(var(--w)*.27);height:calc(var(--w)*.27);border-radius:50%;background:var(--c);color:var(--ci,#fff);font:700 calc(var(--w)*.16)/1 "EB Garamond",Georgia,serif;display:grid;place-items:center;box-shadow:0 0 0 calc(var(--w)*.018) #fffaf0,0 0 0 calc(var(--w)*.03) var(--goldl),0 2px 3px rgba(0,0,0,.3);letter-spacing:-.02em}
.card .pip.tl{top:4%;left:5%}
.card .pip.br{bottom:4%;right:5%}
.card .rb{width:88%;margin-top:5%;text-align:center;font:600 calc(var(--w)*.105)/1.02 "EB Garamond",serif;color:var(--ink);min-height:2.04em;display:flex;align-items:center;justify-content:center}
.card .rb.long{font-size:calc(var(--w)*.088)}
.card .cp{position:absolute;left:8%;bottom:6%;font:700 calc(var(--w)*.07)/1.1 "Source Sans 3",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);max-width:58%}
.card.act .cp{max-width:84%}
.card.act,.card.mod,.card.x2{--ci:#fff}
.card.act{--c:var(--delft)}
.card.mod,.card.x2{--c:var(--gold2)}
.card.held{--c:var(--leaf)}
.card.dupe{box-shadow:0 0 0 3px var(--bad),0 0 16px rgba(220,60,30,.8)}
.card.facedown{background:var(--cardback,repeating-linear-gradient(45deg,var(--delft) 0 6px,#2d61b8 6px 12px));box-shadow:0 0 0 2px #fff inset,0 3px 8px rgba(0,0,0,.45);display:grid;place-items:center}
.card.facedown .mark{width:44%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 0 0 2px var(--goldl)}
.card.facedown .mark svg{width:72%}
.card.facedown.img .mark{display:none}
.card.facedown.shake{animation:shake .22s infinite}
@keyframes shake{25%{transform:rotate(-3deg) translateX(-2px)}75%{transform:rotate(3deg) translateX(2px)}}
.mini .card{--w:var(--mw)}
.mini .card .rb,.mini .card .cp,.mini .card .pip.br{display:none}
.mini .card .pip.tl{width:calc(var(--w)*.46);height:calc(var(--w)*.46);font-size:calc(var(--w)*.3);top:3%;left:4%}
.mini .card .win{width:84%;margin-top:30%}
/* burning */
.burn .card{animation:burn 1.5s ease-in forwards;animation-delay:calc(var(--k)*70ms)}
.burn .card::after{content:"";position:absolute;inset:-18% -8% -2%;border-radius:40% 40% 10% 10%;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 100%;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,240,150,.98),rgba(255,150,30,.9) 30%,rgba(220,60,0,.55) 55%,transparent 72%);
  animation:flame 1.5s ease-in forwards,flick .13s steps(2) infinite;animation-delay:calc(var(--k)*70ms)}
@keyframes burn{0%{filter:none}30%{filter:brightness(1.3) saturate(1.5) sepia(.3)}62%{filter:grayscale(1) brightness(.3) contrast(1.3);transform:none}100%{filter:grayscale(1) brightness(.18);transform:translateY(16px) scale(.78) rotate(var(--rot));opacity:0}}
@keyframes flame{0%{transform:scaleY(0);opacity:0}15%{opacity:1}55%{transform:scaleY(1.35);opacity:1}100%{transform:scaleY(.5);opacity:0}}
@keyframes flick{50%{filter:hue-rotate(-14deg) brightness(1.2)}}
.spark{position:fixed;pointer-events:none;z-index:40;border-radius:50%;animation:spark var(--t) ease-out forwards}
.spark.ember{width:5px;height:5px;background:#ffc04a;box-shadow:0 0 7px 3px rgba(255,130,20,.85)}
.spark.ash{width:6px;height:4px;border-radius:2px;background:#6b6560;animation-timing-function:ease-in}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.float{position:fixed;z-index:44;font:700 28px "EB Garamond",serif;color:#ffe9a8;text-shadow:0 2px 8px rgba(0,0,0,.8);animation:rise 1.3s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes rise{to{transform:translateY(-56px);opacity:0}}

/* special-paper announcement */
.ann{position:fixed;inset:0;z-index:46;display:grid;place-items:center;background:rgba(20,10,4,.45);padding:16px;cursor:pointer;animation:fade .2s}
.ann[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.abox{display:flex;gap:20px;align-items:center;background:var(--paper);border-radius:18px;padding:18px 22px;max-width:620px;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid var(--line);animation:pop .25s ease-out}
.abox .card{--w:150px;flex:none}
.abox .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.abox h2{font-size:32px;line-height:1.05}
.abox .eff{font-size:17px;margin:8px 0}
.abox .hist{font-family:"EB Garamond",serif;font-style:italic;color:var(--muted);font-size:16px;margin:0}
.abox .who{font-size:13px;color:var(--delft);font-weight:700;margin-top:8px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,16,6,.6);display:grid;place-items:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:16px;max-width:640px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.45);border:1px solid var(--line)}
.mbox.wide{max-width:900px}
.mbox h2{font-size:30px;line-height:1.1}
.mbox .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mbox p{margin:10px 0}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mbox .btn{flex:1;min-width:160px}
.mbox .btn.primary{background:var(--delft);color:#fff;border-color:var(--delft3);justify-content:center}
.mbox .btn.primary small{color:#dfe8fb}
.mbox table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.mbox td,.mbox th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.mbox td.n,.mbox th.n{text-align:right;font-variant-numeric:tabular-nums}
.mbox .facts{background:var(--cream);border-radius:10px;padding:10px 14px;font-size:15px}
.mbox .facts li{margin:4px 0}
.mbox .src{font-size:12.5px;color:var(--muted)}
.news{font-family:"EB Garamond",serif;font-size:20px;line-height:1.35;border-left:4px solid var(--gold);padding-left:12px}
.cover{max-width:780px;padding:0;overflow:hidden}
.cover .art{height:230px;background:var(--cover) center 40%/cover;position:relative}
.cover .art h1{position:absolute;left:24px;bottom:16px;font-size:64px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);line-height:.9}
.cover .art h1 small{display:block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-family:"Source Sans 3",sans-serif;font-weight:700;margin-bottom:6px}
.cover .art img.logo{position:absolute;left:18px;bottom:10px;height:120px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.cover .in{padding:16px 24px 22px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.mode.sel{border-color:var(--delft);background:var(--delft2)}
.mode b{font-family:"EB Garamond",serif;font-size:20px}
.mode small{display:block;color:var(--muted);font-size:13.5px}
.traders{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;align-items:flex-start}
.trader{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:90px;font-size:12.5px;color:var(--muted);line-height:1.15;text-align:center}
.trader img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line);transition:.15s}
.trader:hover img,.trader.sel img{box-shadow:0 0 0 3px var(--delft)}
.trader b{color:var(--ink);font-size:13px}
.tinfo{background:var(--cream);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:10px}
.tinfo h3{font-size:20px}
.tinfo p{margin:6px 0}
.tinfo .src{font-size:12px;color:var(--muted)}
.rules h3{margin-top:14px;font-size:20px}
.rules ul{padding-left:20px;margin:6px 0}
.rules li{margin:3px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.legend .card{--w:70px}
.legend .card .cp{display:none}
/* achievements */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ach{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.seal{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--sealimg,radial-gradient(circle at 40% 35%,#d0453a,#8e1a14 70%));box-shadow:0 0 0 3px #b8322a inset,0 3px 6px rgba(0,0,0,.3);flex:none}
.seal img{width:64%;height:64%;object-fit:contain;border-radius:50%;background:rgba(255,245,230,.92);padding:4px}
.tileach{width:88px;height:88px;flex:none}.tileach img{width:100%;height:100%;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3);display:block}.tileach img.gray{filter:grayscale(1);opacity:.45}
.achtoast .tileach{width:52px;height:52px}
.ach.locked .seal{filter:grayscale(1) brightness(1.15);opacity:.5}
.ach b{font-family:"EB Garamond",serif;font-size:17px;line-height:1.1}
.ach small{color:var(--muted);font-size:12.5px;line-height:1.3}
.ach .h{font-family:"EB Garamond",serif;font-style:italic;font-size:14px;line-height:1.3}
.ach .d{font-size:11px;color:var(--good);font-weight:700}
.achtoast{position:fixed;left:16px;bottom:16px;z-index:48;display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:2px solid var(--gold);transform:translateY(160%);transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:360px}
.achtoast.on{transform:none}
.achtoast .seal{width:46px;height:46px}
.achtoast small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.achtoast b{font-family:"EB Garamond",serif;font-size:18px}
.toast{position:fixed;left:50%;top:16%;transform:translate(-50%,0) scale(.9);z-index:45;background:var(--paper);border-radius:14px;padding:12px 20px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:"EB Garamond",serif;font-size:26px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.foot{color:#fff6e2;font-size:12.5px;text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:center}

@media (max-width:1050px){ .main{grid-template-columns:1fr} .side{position:static} .log{max-height:110px} }
@media (max-width:900px){ .board{grid-template-columns:repeat(5,1fr)} .modes{grid-template-columns:1fr} }
@media (max-width:700px){
  :root{--cw:78px;--mw:30px}
  .wrap{padding:8px 8px 20px;gap:8px}
  .top h1{font-size:30px}.top .where{font-size:15px;flex-basis:100%;order:3}
  .tbtn{padding:3px 9px;font-size:12.5px}
  .board{padding:4px;gap:3px}.cell{font-size:10.5px;padding:3px 2px}.cell b,.cell .ix{font-size:13px}
  .strip{font-size:15px;padding:6px 10px}
  .table{margin:8px;padding:10px 7px 12px;border-radius:24px}
  .rivals{gap:5px}
  .seat{padding:5px 5px 7px}
  .plate{flex-wrap:wrap;border-radius:12px;padding:3px 5px;gap:3px 5px;min-height:0}
  .rivals .plate img.pt{width:30px;height:30px}
  .rivals .plate .nm{font-size:13.5px}.rivals .plate .fn{display:none}.rivals .plate .sn{display:inline}
  .rivals .plate .mn span:not(.tot){display:none}
  .rivals .chip{font-size:10px;padding:1px 5px;top:auto;bottom:-9px;right:4px}
  .rivals .below .tag{display:none}
  .bubble{left:4px;top:-20px;font-size:14px}
  .center{grid-template-columns:auto 1fr;gap:10px;margin:12px 2px}
  .center .pile:nth-child(2){display:none}
  .pile .stack{width:52px}.pile .stack .card{--w:52px;width:52px}
  .host img{width:42px;height:42px}.host p{font-size:16px}
  .you .hand{gap:7px}
  .card .cp{display:none}
  .abox{flex-direction:column;text-align:center;gap:10px}
  .abox .card{--w:110px}
  .cover .art h1{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div id="brand"><a class="hl" href="/">Homo Ludens</a><h1>Tulip <span>7</span></h1></div>
    <div class="where" id="where">Menniste Bruyloft, Amsterdam</div>
    <span class="sp"></span>
    <button class="tbtn" id="bRules">Rules</button>
    <button class="tbtn" id="bAch">Achievements</button>
    <button class="tbtn" id="bHelp">Help</button>
    <button class="tbtn" id="bSpeed">Speed</button>
    <button class="tbtn" id="bSound">Sound</button>
    <button class="tbtn" id="bNew">New game</button>
  </header>
  <div class="panel board" id="board" hidden></div>
  <div class="panel strip" id="strip" hidden aria-live="polite"></div>
  <div class="main">
    <section class="table" id="table">
      <div class="glow"></div>
      <div class="rivals" id="rivals"></div>
      <div class="center">
        <div class="pile"><div class="stack" id="deckPile"></div><span class="tag"><b id="deckN">94</b> in the pile</span></div>
        <div class="pile"><div class="floor">the floor</div><span class="tag"><b id="discN">0</b> on the floor</span></div>
        <div class="host"><img id="hostImg" alt=""><div><small>Jan Theunisz, the host</small><p id="say">Sit down. The wine is poured.</p></div></div>
      </div>
      <div class="you" id="you"></div>
    </section>
    <aside class="side">
      <div class="panel ctrl" id="ctrl"></div>
      <div class="panel log" id="log" aria-live="polite"></div>
    </aside>
  </div>
  <div class="foot">A Homo Ludens prototype. History: Garber 1989; Goldgar 2007 and in <i>History Today</i>. Art made for this game.</div>
</div>
<div class="ann" id="ann" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div class="achtoast" id="achToast"></div>

<script>/*ART*/</script>
<script>/*ENGINE*/</script>
<script>

</script>
</body>
</html>
