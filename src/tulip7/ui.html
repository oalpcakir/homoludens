<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffaf0; --cream:#f6ecd6; --ink:#2a2018; --muted:#75604a; --line:rgba(90,58,34,.2);
  --delft:#1f4e9c; --delft2:#e2eaf8; --delft3:#163a76; --tulip:#d7261e; --leaf:#3f8a4a; --gold:#e0a82e; --gold2:#a87618;
  --wood:#4a2f1c; --good:#2f8a4a; --bad:#c0392b;
  --cw:96px; --mw:46px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;background:#3a2516}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg) center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(40,24,12,.35),rgba(40,24,12,.05) 30%,rgba(40,24,12,.25));backdrop-filter:blur(2px)}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 28px;display:grid;gap:10px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff6e2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.top .hl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;color:#fff6e2;text-decoration:none;display:block}
.top h1{font-size:38px;line-height:1}
.top h1 span{color:#ffd45c}
.top .where{font-style:italic;font-family:"EB Garamond",serif;font-size:18px}
.top .sp{flex:1}
.tbtn{background:rgba(255,250,240,.9);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;text-shadow:none}
.tbtn:hover{background:#fff}
.tbtn.on{background:var(--delft);color:#fff;border-color:var(--delft)}

.panel{background:rgba(255,250,240,.93);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(30,15,5,.25)}

/* index board */
.board[hidden]{display:none}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px}
.cell{border-radius:9px;padding:4px 4px 5px;text-align:center;background:var(--cream);border:1px solid var(--line);font-size:12px;line-height:1.2;position:relative}
.cell b{display:block;font-family:"EB Garamond",serif;font-size:15px}
.cell .ix{font-weight:700;font-size:15px;color:var(--delft)}
.cell .rk{color:var(--muted)}
.cell.now{background:var(--delft);color:#fff;border-color:var(--delft3);box-shadow:0 0 0 2px #ffd45c}
.cell.now .ix,.cell.now .rk{color:#fff}
.cell.past{opacity:.55}
.cell.dead{opacity:.35;text-decoration:line-through}
.cell.crash{background:#fbe1dc;border-color:#e59a8f}
.cell.crash.hit{background:var(--bad);color:#fff}
.cell.alk{background:#fff2c9;border-color:#e9c96a}
.cell.alk.now{background:var(--gold2);color:#fff}
.cell .rk.hot{color:var(--bad);font-weight:700}

/* seats */
.rivals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seat{padding:10px 12px;position:relative;transition:box-shadow .2s, transform .2s}
.seat.turn{box-shadow:0 0 0 3px var(--delft),0 8px 20px rgba(30,15,5,.3)}
.seat.pick{cursor:pointer;box-shadow:0 0 0 3px var(--gold),0 8px 20px rgba(30,15,5,.3);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 6px rgba(224,168,46,.55),0 8px 20px rgba(30,15,5,.3)}}
.who{display:flex;gap:10px;align-items:center}
.who img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:var(--cream);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.who .nm{font-family:"EB Garamond",serif;font-size:19px;font-weight:600;line-height:1.1}
.who small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.who .sp{flex:1}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--cream);color:var(--muted);white-space:nowrap}
.chip.stayed{background:#e2f2e6;color:var(--good)}
.chip.bust{background:#fbe1dc;color:var(--bad)}
.chip.book{background:#efe2fb;color:#6a2ca0}
.chip.frozen{background:#e3f0e6;color:var(--leaf)}
.chip.turn{background:var(--delft);color:#fff}
.money{display:flex;gap:10px;font-size:14px;margin:6px 0 4px;flex-wrap:wrap}
.money span{display:flex;align-items:center;gap:4px}
.money img{width:22px;height:22px}
.money b{font-variant-numeric:tabular-nums}
.money .tot{margin-left:auto;font-weight:700}
.hand{display:flex;flex-wrap:wrap;gap:4px;min-height:calc(var(--mw)*1.38 + 4px);position:relative}
.tally{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.tally b{color:var(--ink)}
.sc{position:absolute;top:8px;right:10px}

/* cards */
.card{position:relative;width:var(--cw);aspect-ratio:96/134;border-radius:10px;background:linear-gradient(#fffdf7,#f7ecd5);border:3px solid var(--c,#c9a96a);box-shadow:0 2px 5px rgba(40,20,5,.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 3px 3px;flex:none}
.card img{width:100%;aspect-ratio:1;object-fit:contain;margin-top:6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.card .bd{position:absolute;top:-7px;left:-7px;min-width:28px;height:28px;padding:0 5px;border-radius:999px;background:var(--c);color:var(--ci,#fff);font:700 15px/24px "Source Sans 3",sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:1}
.card .nm.long{font-size:10px;max-height:3.4em}
.card .nm{font-family:"EB Garamond",serif;font-weight:600;font-size:12.5px;line-height:1.05;text-align:center;margin-top:auto;padding:0 2px;max-height:2.2em;overflow:hidden}
.card.mod,.card.x2{--c:var(--gold);--ci:#3a2510}
.card.act{--c:var(--delft)}
.card.held{--c:var(--leaf)}
.card.dupe{--c:var(--bad);box-shadow:0 0 0 3px rgba(192,57,43,.35)}
.mini .card{width:var(--mw);border-width:2px;border-radius:7px;padding:2px}
.mini .card img{margin-top:2px}
.mini .card .bd{top:-6px;left:-6px;min-width:20px;height:20px;font-size:11.5px;line-height:17px;padding:0 3px;border-width:1.5px}
.mini .card .nm{display:none}
.card.new{animation:deal .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes deal{from{transform:translateY(-60px) rotateY(80deg) scale(.6);opacity:0}}
.blown .card{animation:blow 1.1s ease-in forwards;animation-delay:calc(var(--k)*40ms)}
@keyframes blow{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
.sheet{position:fixed;width:70px;pointer-events:none;z-index:40;animation:fly 1.4s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* middle */
.mid{display:grid;grid-template-columns:auto 1fr 280px;gap:10px;align-items:stretch}
.deck{padding:10px 14px;display:flex;gap:12px;align-items:center}
.back{width:76px;aspect-ratio:96/134;border-radius:9px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line),2px 2px 0 #e9dcc0,4px 4px 0 #d9c7a2,0 6px 12px rgba(0,0,0,.3);
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0 15%,transparent 16%),repeating-linear-gradient(45deg,var(--delft) 0 6px,#2d61b8 6px 12px);display:grid;place-items:center}
.back svg{width:38px;height:38px}
.deck .ct{font-size:13px;color:var(--muted);line-height:1.3}
.deck .ct b{font-size:20px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.say{padding:10px 14px;display:flex;gap:12px;align-items:center}
.say img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.say p{margin:0;font-family:"EB Garamond",serif;font-size:19px;line-height:1.3}
.say small{display:block;color:var(--muted);font-family:"Source Sans 3",sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.log{padding:8px 12px;font-size:13px;overflow:auto;max-height:110px}
.log p{margin:0 0 3px}

/* you */
.you{padding:12px 14px;display:grid;grid-template-columns:1fr 300px;gap:14px}
.you .hand{min-height:calc(var(--cw)*1.4 + 8px);gap:10px;padding-top:6px}
.ctrl{display:flex;flex-direction:column;gap:8px;justify-content:center}
.ctrl .odds{font-size:14px;color:var(--muted);min-height:20px}
.ctrl .odds b{color:var(--ink)}
.meter{height:8px;border-radius:999px;background:#ead9b8;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--gold),var(--bad));background-size:300px 100%;width:0;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px}
.btn img{width:30px;height:30px}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.hit{background:var(--delft);border-color:var(--delft3);color:#fff;justify-content:center;font-size:18px}
.btn.hit small{color:#dfe8fb}
.btn.purse{background:#fff7e3}
.btn.paper{background:#eef3fc}
.btn.alk{background:#fff1c4}
.picker{display:flex;flex-direction:column;gap:6px}
.picker .t{font-weight:700}
.wait{color:var(--muted);font-style:italic;text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,16,6,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.45);border:1px solid var(--line)}
.mbox h2{font-size:30px;line-height:1.1}
.mbox .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mbox p{margin:10px 0}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mbox .btn{flex:1;min-width:200px}
.mbox .btn.primary{background:var(--delft);color:#fff;border-color:var(--delft3);justify-content:center}
.mbox .btn.primary small{color:#dfe8fb}
.mbox table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.mbox td,.mbox th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.mbox td.n,.mbox th.n{text-align:right;font-variant-numeric:tabular-nums}
.mbox .facts{background:var(--cream);border-radius:10px;padding:10px 14px;font-size:15px}
.mbox .facts li{margin:4px 0}
.mbox .src{font-size:12.5px;color:var(--muted)}
.news{font-family:"EB Garamond",serif;font-size:20px;line-height:1.35;border-left:4px solid var(--gold);padding-left:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{flex:1;min-width:120px;background:var(--cream);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.hot b{color:var(--bad)}
.cover{max-width:760px;padding:0;overflow:hidden}
.cover .art{height:260px;background:var(--cover) center 40%/cover;position:relative}
.cover .art h1{position:absolute;left:24px;bottom:16px;font-size:64px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);font-family:"EB Garamond",serif;line-height:.9}
.cover .art h1 small{display:block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-family:"Source Sans 3",sans-serif;font-weight:700;margin-bottom:6px}
.cover .in{padding:18px 24px 22px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.mode.sel{border-color:var(--delft);background:var(--delft2)}
.mode b{font-family:"EB Garamond",serif;font-size:20px}
.mode small{display:block;color:var(--muted);font-size:13.5px}
.rules h3{margin-top:14px;font-size:20px}
.rules ul{padding-left:20px;margin:6px 0}
.rules li{margin:3px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.legend .card{--cw:58px}
.legend .card .nm{font-size:9.5px}
.legend .card .bd{min-width:22px;height:22px;font-size:12px;line-height:18px;top:-5px;left:-5px}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0) scale(.9);z-index:45;background:var(--paper);border-radius:14px;padding:12px 20px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:"EB Garamond",serif;font-size:26px;font-weight:600;display:flex;align-items:center;gap:12px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast img{width:56px}
.foot{color:#fff6e2;font-size:12.5px;text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:center}
.foot a{color:#ffe08a}

@media (max-width:900px){
  .board{grid-template-columns:repeat(5,1fr)}
  .rivals{grid-template-columns:1fr}
  .mid{grid-template-columns:1fr}
  .log{display:none}
  .you{grid-template-columns:1fr}
  :root{--cw:74px}
  .modes{grid-template-columns:1fr}
  .cover .art h1{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><a class="hl" href="/">Homo Ludens</a><h1>Tulip <span>7</span></h1></div>
    <div class="where" id="where">Menniste Bruyloft, Amsterdam</div>
    <span class="sp"></span>
    <button class="tbtn" id="bRules">Rules</button>
    <button class="tbtn" id="bOdds">Odds</button>
    <button class="tbtn" id="bSpeed">Speed: normal</button>
    <button class="tbtn" id="bSound">Sound</button>
    <button class="tbtn" id="bNew">New game</button>
  </header>
  <div class="panel board" id="board"></div>
  <section class="rivals" id="rivals"></section>
  <section class="mid">
    <div class="panel deck"><div class="back" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 36V20" stroke="#3f8a4a" stroke-width="2.5"/><path d="M20 26c-6-1-9-5-10-9 5 0 9 3 10 9zM20 26c6-1 9-5 10-9-5 0-9 3-10 9z" fill="#3f8a4a"/><path d="M12 8c2 6 4 10 8 12 4-2 6-6 8-12-3 2-5 3-6 5-1-3-1-5-2-7-1 2-1 4-2 7-1-2-3-3-6-5z" fill="#d7261e"/></svg></div>
      <div class="ct"><b id="deckN">94</b>papers in the pile<br><span id="discN">0 on the floor</span></div></div>
    <div class="panel say"><img id="sayImg" alt=""><div><small>Jan Theunisz, the host</small><p id="say">Sit down. The wine is poured.</p></div></div>
    <div class="panel log" id="log" aria-live="polite"></div>
  </section>
  <section class="panel you seat" id="you" data-i="0"></section>
  <div class="foot">A Homo Ludens prototype. Rules after <i>Flip 7</i> (The Op Games). History: Garber 1989, Goldgar 2007. Art made for this game.</div>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>/*ART*/</script>
<script>/*ENGINE*/</script>
<script>
const {VARIETIES:V, SPECIAL:SP, IDX, RISK, EVENINGS:EV, ROMAN, STYLES, GPP, FEE, SETTLE, TARGET} = T7;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = g => 'f' + Math.round(g).toLocaleString('en-US');
const pct = x => Math.round(x * 100) + '%';
document.body.style.setProperty('--bg', `url(${ART.bg_tavern})`);
$('#sayImg').src = ART.c_theunisz;

/* ---------- settings ---------- */
const SET = Object.assign({odds:true, fast:false, sound:true, mode:'winter'}, (() => { try { return JSON.parse(localStorage.getItem('tulip7.set')) || {}; } catch(e){ return {}; } })());
const saveSet = () => { try { localStorage.setItem('tulip7.set', JSON.stringify(SET)); } catch(e){} };
function syncBtns(){
  $('#bOdds').classList.toggle('on', SET.odds); $('#bOdds').textContent = 'Odds: ' + (SET.odds ? 'on' : 'off');
  $('#bSpeed').textContent = 'Speed: ' + (SET.fast ? 'fast' : 'normal');
  $('#bSound').classList.toggle('on', SET.sound); $('#bSound').textContent = 'Sound: ' + (SET.sound ? 'on' : 'off');
}
$('#bOdds').onclick = () => { SET.odds = !SET.odds; saveSet(); syncBtns(); render(); };
$('#bSpeed').onclick = () => { SET.fast = !SET.fast; saveSet(); syncBtns(); };
$('#bSound').onclick = () => { SET.sound = !SET.sound; saveSet(); syncBtns(); };
$('#bRules').onclick = () => showRules();
$('#bNew').onclick = () => showStart();
syncBtns();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pace = (k = 1) => sleep((SET.fast ? 260 : 680) * k);

/* ---------- sound (Web Audio, no files) ---------- */
let AC = null;
function ac(){ if (!SET.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch(e){ return null; } }
function noise(a, dur, f1, f2, q = 1, gain = .25){
  const n = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = n; const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f1, a.currentTime); f.frequency.exponentialRampToValueAtTime(f2, a.currentTime + dur);
  const g = a.createGain(); g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(gain, a.currentTime + dur * .15); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function tone(a, f, dur, gain = .12, type = 'sine', t0 = 0){
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(gain, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur);
}
const SND = {
  flip(){ const a = ac(); if (a) noise(a, .09, 3000, 1500, .7, .18); },
  clink(){ const a = ac(); if (!a) return; [2637, 3520, 4186].forEach((f, i) => tone(a, f * (1 + Math.random() * .01), .9, .05, 'sine', i * .002)); tone(a, 2700, .7, .04, 'sine', .09); },
  wind(){ const a = ac(); if (a){ noise(a, 1.3, 300, 1400, .6, .35); noise(a, 1.0, 900, 300, .8, .15); } },
  book(){ const a = ac(); if (!a) return; [523, 659, 784, 1047].forEach((f, i) => tone(a, f, .5, .08, 'triangle', i * .09)); },
  thud(){ const a = ac(); if (a){ tone(a, 110, .25, .25, 'sine'); noise(a, .12, 400, 120, .7, .2); } },
  coin(){ const a = ac(); if (!a) return; tone(a, 1800, .25, .06, 'square'); tone(a, 2400, .3, .05, 'sine', .05); },
  chalk(){ const a = ac(); if (!a) return; for (let i = 0; i < 3; i++) setTimeout(() => noise(a, .12, 5000, 3000, 2, .12), i * 140); },
  crash(){ const a = ac(); if (!a) return; tone(a, 196, 1.6, .16, 'triangle'); tone(a, 185, 1.6, .12, 'triangle', .05); noise(a, 1.6, 600, 150, .5, .2); }
};

/* ---------- state ---------- */
let G = null, ui = {pick:null, turn:null, seen:new Set(), log:[], blown:new Set()};
const RIVALS = [
  {name:'Joost van Cuyck', short:'Van Cuyck', style:'cautious', img:'c_cuyck', bio:'29, Amsterdam. On 7 February 1637 he walked away from a deal: "not satisfied with the guarantor".'},
  {name:'Andries de Busscher', short:'De Busscher', style:'balanced', img:'c_busscher', bio:'31, a cooper from Haarlem, from a family of art collectors.'},
  {name:'Abraham van Meeckeren', short:'Van Meeckeren', style:'greedy', img:'c_meeckeren', bio:'A Haarlem brewer. Never leaves the table early.'}
];
const LINES = {
  bust:["Gone with the wind, {p}.","Windhandel! {p}'s papers blow off the table.","Two {v}s in one evening, {p}? The wind takes it all.","That is what they call wind trade, {p}."],
  book:["A full tulip book! {p} closes the evening.","Seven tulips, seven pages. Well played, {p}.","{p} has the whole book. Everyone stops."],
  freeze:["{p} pays the wine money for {q}. Sealed.","{q}'s evening is sealed with {p}'s wine.","Drink up, {q}. {p} has closed your deal."],
  freezeSelf:["{p} pays the wine money and stands up.","{p} seals the evening with a glass."],
  flip3:["The seghsman chalks three more for {q}.","{p} calls the broker: three papers for {q}!","Three strokes on the slate for {q}."],
  saved:["{p} pays rouwkoop and walks away from the second {v}.","Regret money! {p} escapes the duplicate.","{p} buys their way out. Honour saved."],
  stayPurse:["{p} pockets the money.","{p} takes cash. Sensible.","{p} stands up, purse in hand."],
  stayPaper:["{p} writes it on paper.","{p} signs another promise.","Paper, says {p}. The bulbs are in the ground anyway."],
  turnYou:["Your turn. Another paper?","Well? The seghsman is waiting.","Another, or a glass of wine?"],
  give:["{p} hands a spare rouwkoop to {q}."]
};
const pickLine = (k, d) => { const a = LINES[k]; return a[Math.floor(Math.random() * a.length)].replace(/\{(\w)\}/g, (_, x) => x === 'p' ? d.p : x === 'q' ? d.q : d.v); };
function say(t){ $('#say').textContent = t; }
function log(h){ ui.log.unshift(h); ui.log = ui.log.slice(0, 40); $('#log').innerHTML = ui.log.map(x => `<p>${x}</p>`).join(''); }
function toast(html, img, ms = 1100){ const t = $('#toast'); t.innerHTML = (img ? `<img src="${ART[img]}" alt="">` : '') + html; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), SET.fast ? ms * .6 : ms); }
const nm = p => p.human ? 'You' : p.short;
const nmIn = p => p.human ? 'you' : p.short;

/* ---------- cards ---------- */
function cardHTML(c, extra = ''){
  const isNew = !ui.seen.has(c.uid); ui.seen.add(c.uid);
  const cls = 'card ' + (isNew ? 'new ' : '') + extra;
  if (c.k === 'num'){ const v = V[c.v]; return `<div class="${cls} num" style="--c:${v.hex};--ci:${v.ink}" title="${esc(v.name + ': ' + v.note)}"><b class="bd">${v.n}</b><img src="${ART[v.id]}" alt=""><span class="nm ${v.name.length > 16 ? 'long' : ''}">${esc(v.name)}</span></div>`; }
  if (c.k === 'mod') return `<div class="${cls} mod" title="${esc(SP.mod.note)}"><b class="bd">+${c.v}</b><img src="${ART.m_offset}" alt=""><span class="nm">Offsets</span></div>`;
  if (c.k === 'x2') return `<div class="${cls} x2" title="${esc(SP.x2.note)}"><b class="bd">×2</b><img src="${ART.m_broken}" alt=""><span class="nm">Broken tulip</span></div>`;
  const s = SP[c.k]; return `<div class="${cls} act ${c.k === 'second' ? 'held' : ''}" title="${esc(s.name + ': ' + s.note)}"><img src="${ART[s.art]}" alt=""><span class="nm">${s.name}</span></div>`;
}
function handHTML(p){
  if (ui.blown.has(p.i)) return '';
  let h = p.cards.map(c => cardHTML(c)).join('');
  if (p.second) h += cardHTML(p.second);
  if (p.bustCard) h += cardHTML({...p.bustCard}, 'dupe');
  return h;
}
function statusChip(p){
  if (G && G.turn === p && p.status === 'active') return `<span class="chip turn">${p.human ? 'Your turn' : 'Thinking…'}</span>`;
  const m = {active:['', 'At the table'], stayed:['stayed', p.frozen ? 'Sealed (wijnkoop)' : 'Stood up'], bust:['bust', 'Gone with the wind'], book:['book', 'Tulip book!'], idle:['', '']};
  const [c, t] = m[p.status] || ['', '']; return t ? `<span class="chip ${c}">${t}${p.status === 'stayed' && p.dest ? ' · ' + (p.dest === 'paper' ? 'paper' : 'purse') : ''}</span>` : '';
}
function moneyHTML(p){
  if (G.mode === 'classic') return `<div class="money"><span>Total <b>${p.total}</b> / ${TARGET}</span></div>`;
  const paper = G.crashed ? `<span title="Settled at 3½ per cent"><img src="${ART.i_paper}" alt="">Settled <b>${fmt(p.settled)}</b></span>` : `<span title="Paper is worth its guilders times the current index"><img src="${ART.i_paper}" alt="">Paper <b>${fmt(G.paperValue(p))}</b></span>`;
  return `<div class="money"><span title="Cash, safe"><img src="${ART.i_purse}" alt="">Purse <b>${fmt(p.purse)}</b></span>${paper}<span class="tot">${fmt(G.standing(p))}</span></div>`;
}
function tallyHTML(p){
  if (!p.cards.length && !p.bustCard) return '';
  if (p.status === 'bust') return 'Nothing this evening.';
  const s = G.roundScore(p), u = p.nums.length;
  return `This evening <b>${s}</b>${G.mode === 'winter' ? ' = <b>' + fmt(s * GPP * (G.alkmaar ? 2 : 1)) + '</b>' : ''} · ${u} of 7 tulips${p.x2 ? ' · broken ×2' : ''}`;
}

/* ---------- render ---------- */
function renderBoard(){
  const b = $('#board');
  if (!G || G.mode === 'classic'){ b.hidden = true; return; }
  b.hidden = false;
  let h = '';
  for (let e = 0; e < IDX.length; e++){
    const dead = G.crashed && e > G.crashAfter, now = !G.crashed && e === G.evening && !G.alkmaar, past = e < G.evening || (G.crashed && e <= G.crashAfter);
    const rk = RISK[e] ? `crash ${pct(RISK[e])}` : 'no risk';
    h += `<div class="cell ${now ? 'now' : ''} ${past && !now ? 'past' : ''} ${dead ? 'dead' : ''}" title="Paper written this evening is bought at index ×${IDX[e]}. Chance the crash comes before this evening: ${pct(RISK[e])}"><b>${ROMAN[e]}</b>${EV[e].short}<div class="ix">×${IDX[e]}</div><div class="rk ${RISK[e] >= .2 ? 'hot' : ''}">${rk}</div></div>`;
  }
  h += `<div class="cell crash ${G.crashed ? 'hit' : ''}" title="After evening VIII the crash is certain"><b>3 Feb</b>Haarlem<div class="ix" style="color:inherit">crash</div><div class="rk" style="color:inherit">paper → 3½%</div></div>`;
  h += `<div class="cell alk ${G.alkmaar && !G.over ? 'now' : ''}" title="A cash auction: winnings go to the purse, doubled"><b>5 Feb</b>Alkmaar<div class="ix" style="color:inherit">cash ×2</div><div class="rk" style="color:inherit">final</div></div>`;
  b.innerHTML = h;
}
function seatHTML(p, r){
  const big = p.human;
  return `${big ? '' : `<div class="who"><img src="${ART[r.img]}" alt=""><div><div class="nm">${esc(p.name)}</div><small>${STYLES[p.style].label}</small></div><span class="sp"></span>${statusChip(p)}</div>`}
    ${moneyHTML(p)}<div class="hand ${big ? '' : 'mini'}">${handHTML(p)}</div><div class="tally">${tallyHTML(p)}</div>`;
}
function render(){
  if (!G) return;
  renderBoard();
  const R = $('#rivals');
  R.innerHTML = G.players.slice(1).map((p, k) => `<div class="panel seat ${G.turn === p ? 'turn' : ''} ${ui.pick && ui.pick.cands.includes(p) ? 'pick' : ''}" data-i="${p.i}" title="${esc(RIVALS[k].bio)}">${seatHTML(p, RIVALS[k])}</div>`).join('');
  const me = G.players[0], you = $('#you');
  you.classList.toggle('turn', G.turn === me); you.classList.toggle('pick', !!(ui.pick && ui.pick.cands.includes(me)));
  you.innerHTML = `<div><div class="who" style="margin-bottom:2px"><div class="nm">You</div><span class="sp"></span>${statusChip(me)}</div>${seatHTML(me)}</div><div class="ctrl" id="ctrl">${ctrlHTML()}</div>`;
  $('#deckN').textContent = G.draw.length; $('#discN').textContent = G.discard.length + ' on the floor';
  const ev = G.alkmaar ? 'Alkmaar, 5 February 1637' : G.mode === 'winter' ? `Evening ${ROMAN[G.evening]} · ${EV[G.evening].date}` : `Round ${G.round} · first to ${TARGET}`;
  $('#where').textContent = ev + (G.alkmaar ? '' : ' · Menniste Bruyloft, Amsterdam');
  document.querySelectorAll('.seat.pick').forEach(el => el.onclick = () => ui.pick && ui.pick.done(G.players[+el.dataset.i]));
  wireCtrl();
}
function ctrlHTML(){
  const me = G.players[0];
  if (ui.pick){
    const lbl = ui.pick.kind === 'give' ? 'Give your spare Rouwkoop to:' : `Who gets ${SP[ui.pick.card.k].name}?`;
    return `<div class="picker"><div class="t">${lbl}</div><small class="wait" style="text-align:left">${esc(SP[ui.pick.kind === 'give' ? 'second' : ui.pick.card.k].note)}</small>${ui.pick.cands.map(q => `<button class="btn" data-pick="${q.i}">${q.human ? 'Yourself' : esc(q.name)}${q.status === 'active' ? `<small>this evening ${G.roundScore(q)} · ${q.nums.length} tulips</small>` : ''}</button>`).join('')}</div>`;
  }
  if (!ui.turn) return `<div class="wait">${me.status === 'active' ? 'Wait for your turn…' : G.over ? '' : 'Watching the others…'}</div>`;
  const s = G.roundScore(me), od = G.bustOdds(me), pl = G.pile(), dup = Math.round(od * pl.length);
  const odds = SET.odds ? `<div class="odds">Next paper is a duplicate: <b>${pct(od)}</b> (${dup} of ${pl.length})${me.second ? ' · your Rouwkoop covers one' : ''}</div><div class="meter"><i style="width:${Math.min(100, od * 100)}%;background-position:${-od * 300}px 0"></i></div>` : '';
  let stay;
  if (G.mode === 'classic') stay = `<button class="btn purse" data-act="stay"><img src="${ART.i_purse}" alt="">Stand up · bank ${s}<small>total would be ${me.total + s}</small></button>`;
  else if (G.alkmaar) stay = `<button class="btn alk" data-act="purse"><img src="${ART.i_purse}" alt="">Stand up · cash ${fmt(s * GPP * 2)}<small>Alkmaar pays double, in cash</small></button>`;
  else {
    const rn = G.riskNext(), g = s * GPP;
    stay = `<button class="btn purse" data-act="purse"><img src="${ART.i_purse}" alt="">Stand up · to purse ${fmt(g)}<small>cash, safe from the crash</small></button>
            <button class="btn paper" data-act="paper"><img src="${ART.i_paper}" alt="">Stand up · on paper ${fmt(g)}<small>bought at ×${IDX[G.evening]} · crash risk before next evening ${pct(rn)}</small></button>`;
  }
  return `${odds}<button class="btn hit" data-act="hit">Take another paper<small>one more promise from the pile</small></button>${stay}`;
}
function wireCtrl(){
  document.querySelectorAll('#ctrl [data-act]').forEach(b => b.onclick = () => { const f = ui.turn; ui.turn = null; f && f(b.dataset.act); });
  document.querySelectorAll('#ctrl [data-pick]').forEach(b => b.onclick = () => ui.pick && ui.pick.done(G.players[+b.dataset.pick]));
}

/* ---------- modal helpers ---------- */
function modal(html, cls = ''){ const m = $('#modal'), b = $('#mbox'); b.className = 'mbox ' + cls; b.innerHTML = html; m.hidden = false; const f = b.querySelector('button'); f && f.focus(); return b; }
function closeModal(){ $('#modal').hidden = true; }
function ask(html, cls){ return new Promise(res => { const b = modal(html, cls); b.querySelectorAll('[data-v]').forEach(x => x.onclick = () => { closeModal(); res(x.dataset.v); }); }); }

/* ---------- human agent ---------- */
const Human = {
  hitOrStay(g, p){
    return new Promise(res => {
      say(pickLine('turnYou', {}));
      ui.turn = a => { if (a === 'hit') res('hit'); else { p._dest = a === 'stay' ? null : a; res('stay'); } render(); };
      render();
    });
  },
  async dest(g, p){
    if (p._dest){ const d = p._dest; p._dest = null; return d; }
    const s = G.roundScore(p) * GPP;
    return ask(`<div class="kick">Evening ${ROMAN[G.evening]}</div><h2>Where does your ${fmt(s)} go?</h2><p>The evening is over and you kept your papers. Bank them in your purse, or keep them on paper at index ×${IDX[G.evening]}.</p>
      <div class="row"><button class="btn purse" data-v="purse"><img src="${ART.i_purse}" alt="">To purse<small>cash, safe</small></button><button class="btn paper" data-v="paper"><img src="${ART.i_paper}" alt="">On paper<small>crash risk before next evening ${pct(G.riskNext())}</small></button></div>`);
  },
  sell(g, p){ return Promise.resolve(p._sell === true); },
  target(g, p, c, cands){ return pickFrom('target', c, cands); },
  giveSecond(g, p, cands){ return pickFrom('give', null, cands); }
};
function pickFrom(kind, card, cands){
  return new Promise(res => { ui.pick = {kind, card, cands, done(q){ ui.pick = null; res(q); render(); }}; say(kind === 'give' ? 'You already have a Rouwkoop. Who gets the spare?' : `${SP[card.k].name}! Choose a player.`); render(); });
}
const Bot = {
  async hitOrStay(g, p){ await pace(.9); return T7.AI.hitOrStay(g, p); },
  dest: (g, p) => T7.AI.dest(g, p), sell: (g, p) => T7.AI.sell(g, p),
  async target(g, p, c, cands){ await pace(.5); return T7.AI.target(g, p, c, cands); },
  giveSecond: (g, p, c) => T7.AI.giveSecond(g, p, c)
};

/* ---------- events from the engine ---------- */
async function onEvent(t, d){
  const p = d.p, q = d.q;
  switch (t){
    case 'roundStart': ui.seen = new Set(); ui.blown = new Set(); render(); await pace(.5); break;
    case 'turn': render(); if (!p.human) await pace(.2); break;
    case 'card': SND.flip(); render(); await pace(); break;
    case 'action': {
      SND.flip(); const s = SP[d.c.k];
      toast(`${nm(p)}: ${s.name}`, s.art); log(`<b>${nm(p)}</b> drew <b>${s.name}</b>.`);
      if (d.c.k === 'flip3') SND.chalk(); render(); await pace(1.1); break; }
    case 'keep': render(); break;
    case 'give': log(`${nm(p)} gave a spare Rouwkoop to ${nmIn(q)}.`); say(pickLine('give', {p:nm(p), q:nmIn(q)})); render(); await pace(); break;
    case 'waste': log(`${nm(p)}'s spare Rouwkoop is discarded.`); render(); break;
    case 'saved': SND.coin(); say(pickLine('saved', {p:nm(p), v:V[d.c.v].name})); log(`<b>${nm(p)}</b> paid rouwkoop: the second ${V[d.c.v].name} is gone.`); toast(`Rouwkoop! ${nm(p)} escapes`, 'a_rouwkoop'); render(); await pace(1.2); break;
    case 'bust': await blow(p); say(pickLine('bust', {p:nm(p), v:V[d.c.v].name})); log(`<b>${nm(p)}</b> drew a second ${V[d.c.v].name}. Gone with the wind.`); break;
    case 'book': SND.book(); toast(`${nm(p)}: tulip book complete! +15`, 'i_book', 1600); say(pickLine('book', {p:nm(p)})); log(`<b>${nm(p)}</b> completed a tulip book (+15). The evening ends.`); render(); await pace(1.8); break;
    case 'freeze': SND.clink(); say(p === q ? pickLine('freezeSelf', {p:nm(p)}) : pickLine('freeze', {p:nm(p), q:nmIn(q)})); log(`<b>${nm(p)}</b> sealed ${p === q ? 'their own' : nmIn(q) + "'s"} evening with Wijnkoop${G.mode === 'winter' && !G.alkmaar ? ' (on paper)' : ''}.`); render(); await pace(1.3); break;
    case 'flip3': say(pickLine('flip3', {p:nm(p), q:nmIn(q)})); log(`<b>${nm(p)}</b> sent the seghsman to ${nmIn(q)}: three more papers.`); render(); await pace(1); break;
    case 'stay': SND.thud(); say(pickLine(p.dest === 'paper' ? 'stayPaper' : 'stayPurse', {p:nm(p)})); log(`<b>${nm(p)}</b> stood up with ${G.roundScore(p)}${p.dest ? ' → ' + p.dest : ''}.`); render(); await pace(.8); break;
    case 'reshuffle': log('The floor is swept: the discards are shuffled into a new pile.'); break;
    case 'roundEnd': render(); await pace(.6); await roundSummary(); break;
    case 'evening': await eveningIntro(d.e); break;
    case 'sold': if (!p.human) log(`<b>${nm(p)}</b> sold their paper for ${fmt(d.v - d.fee)}.`); else log(`You sold your paper for ${fmt(d.v - d.fee)} (wine money ${fmt(d.fee)}).`); SND.coin(); render(); break;
    case 'crash': await crashScene(); break;
    case 'alkmaar': await alkmaarScene(); break;
    case 'gameOver': render(); await endScene(); break;
  }
}
async function blow(p){
  render(); await pace(.7);
  const seat = document.querySelector(`.seat[data-i="${p.i}"]`), hand = seat && seat.querySelector('.hand');
  SND.wind();
  if (hand){
    hand.classList.add('blown');
    hand.querySelectorAll('.card').forEach((c, k) => { c.style.setProperty('--k', k); c.style.setProperty('--dx', (200 + Math.random() * 300) + 'px'); c.style.setProperty('--dy', (-120 + Math.random() * 160) + 'px'); c.style.setProperty('--rot', (Math.random() * 120 - 30) + 'deg'); });
    const r = hand.getBoundingClientRect();
    for (let k = 0; k < 4; k++){
      const s = document.createElement('img'); s.src = ART.i_wind; s.className = 'sheet'; s.alt = '';
      s.style.left = (r.left + Math.random() * r.width * .7) + 'px'; s.style.top = (r.top + Math.random() * r.height * .6) + 'px';
      s.style.setProperty('--dx', (250 + Math.random() * 350) + 'px'); s.style.setProperty('--dy', (-200 + Math.random() * 120) + 'px'); s.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      s.style.animationDelay = (k * 90) + 'ms'; document.body.appendChild(s); setTimeout(() => s.remove(), 1800);
    }
  }
  await sleep(SET.fast ? 700 : 1200);
  ui.blown.add(p.i); render();
}

/* ---------- scenes ---------- */
async function eveningIntro(e){
  ui.seen = new Set(); G.players.forEach(p => { p.status = 'idle'; }); render();
  const me = G.players[0], val = me.units * IDX[e], fee = Math.round(val * FEE);
  const rn = RISK[e + 1] ?? 1, gain = e > 0 ? IDX[e] / IDX[e - 1] : 1;
  let rows = G.players.map(p => `<tr><td>${p.human ? '<b>You</b>' : esc(p.name)}</td><td class="n">${fmt(p.purse)}</td><td class="n">${fmt(p.units * IDX[e])}</td></tr>`).join('');
  const sellRow = me.units > 0
    ? `<div class="row"><button class="btn paper" data-v="hold"><img src="${ART.i_paper}" alt="">Hold my paper<small>worth ${fmt(val)} tonight</small></button><button class="btn purse" data-v="sell"><img src="${ART.i_purse}" alt="">Sell it all: ${fmt(val - fee)}<small>wine money ${fmt(fee)} (2½%)</small></button></div>`
    : `<div class="row"><button class="btn primary" data-v="hold">Sit down</button></div>`;
  const v = await ask(`<div class="kick">Evening ${ROMAN[e]} of the winter</div><h2>${EV[e].date}</h2><p class="news">${EV[e].news}</p>
    <div class="stats"><div class="stat"><b>×${IDX[e]}</b>paper index${e > 0 ? ` (×${gain.toFixed(2).replace(/\.?0+$/, '')} since last time)` : ''}</div><div class="stat ${rn >= .2 ? 'hot' : ''}"><b>${pct(rn)}</b>chance the crash comes before the next evening</div></div>
    <table><tr><th></th><th class="n">Purse</th><th class="n">Paper tonight</th></tr>${rows}</table>${sellRow}`);
  me._sell = v === 'sell';
  say(e === 0 ? 'Sit down. The wine is poured, and nobody here has seen a single bulb.' : EV[e].news);
  render();
}
async function roundSummary(){
  const rows = G.players.map(p => {
    let r;
    if (p.status === 'bust') r = '<span style="color:var(--bad)">Gone with the wind</span>';
    else if (G.mode === 'classic') r = `+${p.last}${p.status === 'book' ? ' (tulip book +15)' : ''}`;
    else r = `+${fmt(p.lastG)} → ${p.lastDest === 'paper' ? 'paper' : 'purse'}${p.status === 'book' ? ' · tulip book' : ''}${p.frozen ? ' · sealed' : ''}`;
    return `<tr><td>${p.human ? '<b>You</b>' : esc(p.name)}</td><td>${r}</td><td class="n">${G.mode === 'classic' ? p.total : fmt(G.standing(p))}</td></tr>`;
  }).join('');
  const last = G.mode === 'classic' && G.players.some(p => p.total >= TARGET);
  const title = G.alkmaar ? 'Alkmaar is over' : G.mode === 'classic' ? `Round ${G.round}` : `End of evening ${ROMAN[G.evening]}`;
  await ask(`<div class="kick">${G.mode === 'classic' ? 'Flip 7 rules' : 'The bill'}</div><h2>${title}</h2><table><tr><th></th><th>This evening</th><th class="n">${G.mode === 'classic' ? 'Total' : 'Worth'}</th></tr>${rows}</table>
    <div class="row"><button class="btn primary" data-v="ok">${last || G.alkmaar ? 'See the result' : 'Next evening'}</button></div>`);
}
async function crashScene(){
  SND.crash();
  const early = G.crashAfter < IDX.length - 1;
  const rows = G.players.map(p => `<tr><td>${p.human ? '<b>You</b>' : esc(p.name)}</td><td class="n">${fmt(p.atCrash)}</td><td class="n">${fmt(p.settled)}</td></tr>`).join('');
  renderBoard();
  await ask(`<div class="kick">${early ? 'Weeks pass in the taverns. Then:' : 'Then:'}</div><h2>Tuesday, 3 February 1637</h2>
    <p class="news">In Haarlem a pound of Witte Croonen is offered at 1,250 guilders, then 1,100, then 1,000. Nobody bids.</p>
    <p>Within a week nobody in any town is buying. Buyers stop paying, and the courts will not touch contracts they call gambling. Every paper in this room is now worth what a buyer can be made to pay: in the end, in May 1638, Haarlem settled on <b>3½ per cent</b>.</p>
    <table><tr><th></th><th class="n">Paper at the crash</th><th class="n">Settled at 3½%</th></tr>${rows}</table>
    <div class="row"><button class="btn primary" data-v="ok">On to Alkmaar</button></div>`);
  render();
}
async function alkmaarScene(){
  await ask(`<div class="kick">The last evening</div><h2>Thursday, 5 February 1637, Alkmaar</h2>
    <p class="news">Two days after Haarlem, the orphans of Wouter Winckel sell his bulbs for cash in the Nieuwe Schutters-Doelen. A Viceroy goes for 4,203 guilders; the sale makes about 90,000.</p>
    <p>An estate sale for cash, watched over by the orphans' guardians, not paper in a tavern. Tonight there is no paper: everything you win goes into your purse, <b>twice over</b>.</p>
    <div class="row"><button class="btn primary" data-v="ok">Ride to Alkmaar</button></div>`);
  say('Cash tonight. The orphan masters are watching.'); render();
}
async function endScene(){
  const P = [...G.players].sort((a, b) => G.standing(b) - G.standing(a));
  const me = G.players[0], win = P[0] === me, top = G.standing(P[0]);
  const rows = P.map((p, k) => `<tr><td>${k + 1}. ${p.human ? '<b>You</b>' : esc(p.name)}</td><td class="n">${G.mode === 'classic' ? p.total : fmt(p.purse + p.settled)}</td></tr>`).join('');
  let mine = '';
  if (G.mode === 'winter') mine = me.atCrash > 0 ? `<p>Your paper at the crash was worth <b>${fmt(me.atCrash)}</b>. It settled for <b>${fmt(me.settled)}</b>.</p>` : `<p>You held no paper when the crash came.</p>`;
  const facts = G.mode === 'winter' ? `<div class="facts"><b>What really happened</b><ul>
    <li>Only a few hundred people traded: about 285 in Haarlem and 60 in Amsterdam. Only 37 spent more than 400 guilders.</li>
    <li>Most of the winter's prices were never paid. On 27 April 1637 the States of Holland suspended the contracts; in May 1638 Haarlem let buyers walk away for 3½ per cent: <i>rouwkoop</i>.</li>
    <li>Historians have found almost no bankruptcies caused by tulips, and nobody drowned in a canal. Those stories came from pamphlets, from Charles Mackay's 1841 book and from a novel.</li>
    <li>The commonest bulbs swelled the most. That is why the 12s are the most valuable cards and the most dangerous.</li></ul>
    <div class="src">Sources: Peter Garber, "Tulipmania" (1989); Anne Goldgar, <i>Tulipmania</i> (2007).</div></div>` : '';
  const v = await ask(`<div class="kick">${G.mode === 'winter' ? 'The winter of 1636–37' : 'Game over'}</div><h2>${win ? 'You finish richest.' : esc(P[0].name) + ' finishes richest.'}</h2>
    <table>${rows}</table>${mine}${facts}<div class="row"><button class="btn primary" data-v="again">Play again</button><button class="btn" data-v="menu">Change mode</button></div>`);
  if (v === 'again') start(G.mode); else showStart();
}
function legendHTML(){ return `<div class="legend">${V.slice().reverse().map(v => `<div class="card num" style="--c:${v.hex};--ci:${v.ink}" title="${esc(v.note)}"><b class="bd">${v.n}</b><img src="${ART[v.id]}" alt=""><span class="nm">${esc(v.name)}</span></div>`).join('')}</div>`; }
function showRules(){
  modal(`<div class="rules"><div class="kick">How to play</div><h2>Tulip 7</h2>
  <p>Amsterdam, winter 1636. The bulbs are in the ground; what changes hands in the tavern is paper. Each evening you take papers one at a time, each a promise for a tulip you have not seen.</p>
  <h3>Each evening</h3><ul>
  <li>On your turn, <b>take another paper</b> or <b>stand up</b> and bank what is in front of you.</li>
  <li>If a tulip you already have comes again, your evening is <b>gone with the wind</b>: you score nothing.</li>
  <li>Seven different tulips is a <b>tulip book</b>: +15, and the evening ends for everyone.</li>
  <li>Your evening = the tulip numbers added up, doubled by a <b>Broken tulip</b>, plus any <b>Offsets</b>.</li></ul>
  <h3>Special papers</h3><ul>
  <li><b>Wijnkoop</b> (wine money): choose a player at the table; their evening is sealed and banked.</li>
  <li><b>Seghsman</b> (the broker): choose a player; they must take three more papers.</li>
  <li><b>Rouwkoop</b> (regret money): keep it; it cancels your next duplicate.</li></ul>
  <h3>The winter</h3><ul>
  <li>When you stand up, put your evening (×${GPP} guilders a point) in your <b>purse</b> (safe) or <b>on paper</b>. Paper is bought at tonight's index and grows as the index rises.</li>
  <li>At the start of each evening you can sell all your paper at the new index (2½% wine money).</li>
  <li>The board shows the chance that the crash comes before each evening. After evening VIII it is certain. When it comes, all paper settles at <b>3½ per cent</b>.</li>
  <li>Wijnkoop puts the sealed player's evening on paper, like it or not.</li>
  <li>The last evening is the Alkmaar auction: cash only, doubled. Richest at the end wins.</li></ul>
  <h3>Why are the common tulips worth most?</h3><p>The number on a card is how much that variety swelled on paper that winter, and how many of its papers are in the pile. Cheap bulbs sold by the pound swelled fifty times; the famous rarities hardly moved. Semper Augustus is 0: its owner would not sell.</p>
  ${legendHTML()}
  <div class="row"><button class="btn primary" data-v="x">Back to the table</button></div></div>`);
  $('#mbox [data-v]').onclick = closeModal;
}
function showStart(){
  let mode = SET.mode;
  const b = modal(`<div class="art" style="--cover:url(${ART.bg_cover})"><h1><small>Homo Ludens</small>Tulip 7</h1></div><div class="in">
    <p style="font-family:'EB Garamond',serif;font-size:20px;margin-top:0">Amsterdam, winter 1636. Seven tulips, one tavern, and a market made of paper.</p>
    <div class="modes"><div class="mode" data-m="winter" tabindex="0"><b>The winter of 1636</b><small>Eight evenings, a rising price index and a crash you can see coming. Purse or paper?</small></div>
    <div class="mode" data-m="classic" tabindex="0"><b>Classic</b><small>Plain <i>Flip 7</i> rules: first to ${TARGET} points.</small></div></div>
    <p style="font-size:14px;color:var(--muted)">You play against three traders from the archives: Joost van Cuyck (cautious), Andries de Busscher (steady) and Abraham van Meeckeren (greedy).</p>
    <div class="row"><button class="btn primary" id="go">Sit down at the table</button><button class="btn" id="rl">How to play</button></div></div>`, 'cover');
  const sel = () => b.querySelectorAll('.mode').forEach(m => m.classList.toggle('sel', m.dataset.m === mode));
  b.querySelectorAll('.mode').forEach(m => { m.onclick = () => { mode = m.dataset.m; sel(); }; m.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); mode = m.dataset.m; sel(); } }; });
  sel(); $('#go').onclick = () => { SET.mode = mode; saveSet(); closeModal(); start(mode); }; $('#rl').onclick = showRules;
}
let runId = 0;
async function start(mode){
  const my = ++runId;
  ui = {pick:null, turn:null, seen:new Set(), log:[], blown:new Set()}; $('#log').innerHTML = '';
  const players = [{name:'You', short:'You', human:true, style:'balanced', agent:Human}, ...RIVALS.map(r => ({...r, agent:Bot}))];
  G = new T7.Game({mode, players, emit: async (t, d) => { if (my !== runId) throw 'stale'; await onEvent(t, d); if (my !== runId) throw 'stale'; }});
  window.G = G;
  render(); say('Sit down. The wine is poured.');
  try { await G.run(); } catch(e){ if (e !== 'stale') { console.error(e); } }
}
showStart();
</script>
