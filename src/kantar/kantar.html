/* Kantar stylesheet (single source).
   Cleaned 2026-10-16: unused rules, never-winning declarations and 80 of 91 !important removed; every step
   verified against a computed-style snapshot of 17,082 elements in 36 game states (3 screen sizes): 0 differences.
   The !important flags that remain are needed (drag ghost, dragging cursor, pan glow, stall slots).
   Commodity tiles are one component sized by --ts (tile side); art PNG/WebPs are pre-normalised squares. */
:root{
  --bg:#1b130e; --bg2:#271b13; --panel:#2b1e15; --panel2:#33241a; --line:rgba(214,172,92,.28);
  --wood:#4b301e; --wood2:#36231a; --brass:#d2a650; --brass2:#8e6a2a; --brass3:#f1d99a;
  --paper:#f3e9d4; --paper2:#e6d6b5; --ink:#2b1e14; --text:#f1e6d1; --muted:#b9a68c;
  --tq:#3a9a92; --izred:#b5372c;
  --saf:#8c52c4; --ipek:#a3253c; --kahve:#7a4a2b; --bakir:#bb5c2e;
  --good:#8fd0a5; --bad:#f0907e;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#170f0b; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#170f0b; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,

*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;background:var(--bg);position:relative}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}

button{font:inherit}

.panel{background:linear-gradient(var(--panel2),var(--panel));border-radius:10px;padding:14px 16px}

.center{display:flex;flex-direction:column}

   repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 9px),
   linear-gradient(var(--wood),var(--wood2))}

.scale{position:relative;margin-top:4px}
.post{position:absolute;left:50%;background:linear-gradient(90deg,var(--brass2),var(--brass3),var(--brass2));border-radius:6px;box-shadow:0 0 12px rgba(0,0,0,.4)}
.post::before{content:"";position:absolute;top:-18px;left:-10px;width:32px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,var(--brass3),var(--brass2))}
.base{position:absolute;left:50%;bottom:6px;border-radius:40px 40px 4px 4px;background:linear-gradient(var(--brass3),var(--brass) 40%,var(--brass2));box-shadow:0 6px 10px rgba(0,0,0,.45)}

.beam::before,

.pan{position:absolute;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.pan.M .strings{display:none}

.sS{--sc:var(--saf)}

.log{overflow:auto;font-size:14px;color:#e3d4bb;padding-right:4px}

.modal{position:fixed;inset:0;background:rgba(12,7,4,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.hide{display:none}
.sheet{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);border-radius:10px;padding:26px 30px}

.goods{display:flex;gap:10px;margin:10px 0}
.mlabel{text-align:center;letter-spacing:.04em}
.market{margin:4px auto 0}
.pr{font-size:16px;color:var(--brass3)}
small.up{color:var(--good);margin-left:3px}

:root{--brass:#cda666;--brass3:#f1dbb0;--panel:#281c16;--panel2:#32231b}
body::before{background:radial-gradient(ellipse 75% 70% at 46% 52%,rgba(14,9,7,.80),rgba(14,9,7,.56) 100%),var(--bazaar) center center/cover fixed no-repeat}
body::after{background:radial-gradient(ellipse 80% 68% at 50% 34%, transparent 32%,rgba(0,0,0,.43) 98%)}
.frieze{display:none}
.wrap{max-width:1560px;grid-template-columns:minmax(0,1fr) minmax(280px,320px);gap:16px;min-width:0}
.center,
.right.panel,
.side.panel{min-width:0;max-width:100%}
header.top{border-bottom:1px solid rgba(211,172,109,.24);padding-bottom:16px}
header.top h1{font-size:52px;letter-spacing:.045em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
header.top p{font-size:14px;color:#d5c4aa}
.btn{background:linear-gradient(180deg,rgba(243,215,166,.10),rgba(243,215,166,.025));border:1px solid rgba(205,166,102,.40);border-radius:9px;box-shadow:inset 0 1px rgba(255,255,255,.055)}
.btn:hover:not(:disabled){background:rgba(213,174,111,.16)}
.panel,
.stall,
.counter{backdrop-filter:blur(6px);box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,241,207,.045)}
.panel{border:1px solid rgba(214,172,92,.22)}
.right.panel{background:linear-gradient(180deg,rgba(46,32,26,.88),rgba(32,23,20,.91))}
.side.panel{background:linear-gradient(180deg,rgba(46,32,26,.88),rgba(32,23,20,.91))}
.panel h2{font-size:27px;padding-bottom:9px}
.scoreline{padding-top:9px;border-top:1px solid rgba(214,172,92,.15)}
.stall{background:linear-gradient(180deg,rgba(54,37,29,.83),rgba(38,27,22,.87));padding:12px 14px;border-radius:12px}
#oppStall{border-left:3px solid rgba(190,139,91,.72)}
#youStall{border-left:3px solid rgba(91,165,147,.72)}
.col{background:rgba(0,0,0,.17);border:1px solid rgba(211,172,109,.10);border-left:3px solid var(--sc);border-radius:9px;padding:8px 7px}
.col .ct{white-space:normal}
.counter{background:linear-gradient(180deg,rgba(56,39,29,.82),rgba(32,22,18,.92));border:1px solid rgba(205,166,102,.32);padding:18px 15px 22px}
.counter::before{opacity:.32}
.market{width:min(100%,710px);background:rgba(19,12,8,.38);border:1px solid rgba(211,172,109,.25);border-radius:12px}
.scale{height:calc(350px*var(--f,1))}
.scaleIn{width:680px;height:350px;left:50%;margin-left:-340px;transform:scale(var(--f,1));transform-origin:top center}
.scaleIn::before{display:none}
.beam{top:40px;width:460px;left:50%;margin-left:-230px;transform-origin:center}
.post{top:30px;bottom:22px;width:12px;margin-left:-6px}
.base{width:160px;margin-left:-80px;height:22px}
.pan{width:200px;top:46px}
.pan.L{left:calc(50% - 330px)}
.pan.R{left:calc(50% + 130px)}
.pan.M{left:calc(50% - 100px);top:150px}
.strings{width:200px;height:82px}
.dish{min-height:96px;padding:8px 8px 18px;border-radius:8px 8px 100px 100px / 8px 8px 46px 46px;background:linear-gradient(#e3bf7d,#bd9146 42%,#7d5427);box-shadow:0 12px 21px #0006,inset 0 2px rgba(255,245,215,.4)!important}
.pan.pick .dish{outline:3px solid #8fd0a5}
@media(max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr) minmax(255px,290px);padding:14px 11px}
.market{gap:8px}
.market .slot{width:78px;height:107px;flex-basis:78px}}
@media(max-width:850px){.wrap{grid-template-columns:minmax(0,1fr)}
.center,
.right.panel,
.side.panel{grid-column:1;grid-row:auto}
.market .slot{width:90px;height:123px;flex-basis:90px}}
@media(max-width:550px){header.top h1{font-size:38px}
.market{gap:5px;padding:7px}
.market .slot{width:clamp(45px,17vw,70px);height:auto;aspect-ratio:90/123;flex:0 1 clamp(45px,17vw,70px)}
.counter{padding:12px 7px}
.cols{gap:4px}
.col{padding:6px 3px}
.col .ct{font-size:10px}}
@media(prefers-reduced-motion:reduce){.beam,
.pan,
.dish{transition:none;animation:none}}
.language-switch{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:10px;border:1px solid rgba(215,177,106,.37);background:rgba(35,24,18,.66);font:600 13px/1.4 "Source Sans 3",system-ui,sans-serif;color:#f3dfb8;white-space:nowrap}
.language-switch select{background:#35251b;color:#f5e3bf;border:0;outline-offset:3px;border-radius:5px;font:inherit;cursor:pointer;padding:3px}
@media(max-width:650px){.language-switch{padding:3px 6px;font-size:12px}}
.col .ct img.commodity-mini{margin-right:3px;vertical-align:middle}
.log .commodity-inline{display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
:root{--tile-cream:#f5e9d1;--tile-shadow:0 3px 7px rgba(0,0,0,.32)}
.market{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:clamp(6px,1vw,14px);max-width:800px;min-height:142px;padding:12px 10px}
.market .slot{width:clamp(66px,7.5vw,115px)!important;height:clamp(66px,7.5vw,115px)!important;aspect-ratio:1;flex:none}
#rulesGoods{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.side .row{display:flex;flex-wrap:wrap;gap:7px}
@media(max-width:850px){.market .slot{width:clamp(58px,14vw,95px)!important;height:clamp(58px,14vw,95px)!important}}
@media(max-width:550px){.market{gap:4px;padding:8px 4px;min-height:95px}
.market .slot{width:clamp(45px,16.5vw,74px)!important;height:clamp(45px,16.5vw,74px)!important}}
@media(max-width:550px){.right.panel,
.side.panel{min-width:0;max-width:100%;overflow:hidden}
.market{max-width:100%}}
.ledger-icon,
.chip img,
#goodsKey img,
.commodity-mini,
.log .commodity-mini{border-radius:0;object-fit:contain;background:transparent;mix-blend-mode:normal}
.stall .col{min-width:0}
.stall .col .ct{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
.stall .col .ct .commodity-mini{width:24px;height:24px;flex:none;object-fit:contain}
.stall .col .ct b{margin-left:2px}
.stall .col{min-height:49px}
@media(max-width:550px){.stall .col .ct .commodity-mini{width:20px;height:20px}}

<script>

const SU=['S','I','K','B'];
const SD={S:{ad:'Safran',p:5,n:4},I:{ad:'İpek',p:4,n:5},K:{ad:'Kahve',p:3,n:7},B:{ad:'Bakır',p:2,n:8}};
const PMIN=1,PMAX=7;
const Z=()=>({S:0,I:0,K:0,B:0});
const tot=o=>o.S+o.I+o.K+o.B;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= rules engine ================= */
function newGame(first,mode,tut){
  const d=[];SU.forEach(s=>{for(let i=0;i<SD[s].n;i++)d.push(s)});shuffle(d);
  return {all:d,hidden:d.slice(0,3),open:d.slice(3,6),market:d.slice(6,11),deck:d.slice(11),turn:0,splitter:first,first,mode,tut,
    tab:[Z(),Z()],burned:Z(),price:{S:5,I:4,K:3,B:2},seals:[{uc:1,kes:1},{uc:1,kes:1}],phase:'split',piles:null};
}
function cl(s){return {all:s.all,hidden:s.hidden,open:s.open,market:s.market,deck:s.deck,turn:s.turn,splitter:s.splitter,first:s.first,mode:s.mode,tut:s.tut,
  tab:[{...s.tab[0]},{...s.tab[1]}],burned:{...s.burned},price:{...s.price},seals:[{...s.seals[0]},{...s.seals[1]}],
  phase:s.phase,piles:s.piles?s.piles.map(p=>p.slice()):null}}
const sealsOpen=s=>!(s.tut&&s.turn===0);
function give(s,w,p){p.forEach(c=>s.tab[w][c]++)}
function burnCard(s,c){s.burned[c]++;if(s.mode==='narh')s.price[c]=Math.min(PMAX,s.price[c]+1)}
function endTurn(s){
  s.piles=null;const need=5-s.market.length;
  s.market=s.market.concat(s.deck.slice(0,need));s.deck=s.deck.slice(need);
  s.turn++;s.splitter^=1;s.phase=s.turn>=6?'end':'split';
}
function doSplit(s,idxs,piles){
  const n=cl(s);n.market=s.market.filter((_,i)=>!idxs.includes(i));
  n.piles=piles.map(p=>p.slice());if(piles.length===3)n.seals[s.splitter].uc=0;
  if(s.mode==='narh'){const cnt=Z();piles.flat().forEach(c=>cnt[c]++);SU.forEach(c=>{if(cnt[c]>=2)n.price[c]=Math.max(PMIN,n.price[c]-1)})}
  n.phase='choose';return n;
}
function doCut(s,pi,ci){const n=cl(s);const c=n.piles[pi].splice(ci,1)[0];burnCard(n,c);n.seals[1-s.splitter].kes=0;return n}
function doChoose(s,cut,pick){
  let n=cut?doCut(s,cut[0],cut[1]):cl(s);const ch=1-s.splitter;
  give(n,ch,n.piles[pick]);const rest=n.piles.filter((_,i)=>i!==pick);
  if(rest.length===1){give(n,n.splitter,rest[0]);endTurn(n)}else{n.piles=rest;n.phase='rest'}
  return n;
}
function doRest(s,pick){const n=cl(s);give(n,n.splitter,n.piles[pick]);n.piles[1-pick].forEach(c=>burnCard(n,c));endTurn(n);return n}
function combos3(len){const out=[];for(let a=0;a<len;a++)for(let b=a+1;b<len;b++)for(let c=b+1;c<len;c++)out.push([a,b,c]);return out}
function splitOpts(s){
  const m=s.market,out=[],seenSub=new Set();
  for(const idxs of combos3(m.length)){
    const t=idxs.map(i=>m[i]),sk=t.slice().sort().join('');if(seenSub.has(sk))continue;seenSub.add(sk);
    const seen=new Set();
    for(let mk=0;mk<4;mk++){const A=[t[0]],B=[];[1,2].forEach((i,k)=>((mk>>k)&1?B:A).push(t[i]));
      const key=[A.slice().sort().join(''),B.slice().sort().join('')].sort().join('|');
      if(!seen.has(key)){seen.add(key);out.push({idxs,piles:[A,B]})}}
    if(s.seals[s.splitter].uc&&sealsOpen(s))out.push({idxs,piles:[[t[0]],[t[1]],[t[2]]]});
  }
  return out;
}
function chooseOpts(s){
  const out=[],ch=1-s.splitter;
  s.piles.forEach((_,pk)=>out.push({cut:null,pick:pk}));
  if(s.seals[ch].kes&&sealsOpen(s))s.piles.forEach((p,pi)=>{const seen=new Set();p.forEach((c,ci)=>{if(seen.has(c))return;seen.add(c);
    s.piles.forEach((_,pk)=>out.push({cut:[pi,ci],pick:pk}))})});
  return out;
}
function children(s){
  if(s.phase==='split')return splitOpts(s).map(o=>[o,doSplit(s,o.idxs,o.piles)]);
  if(s.phase==='choose')return chooseOpts(s).map(o=>[o,doChoose(s,o.cut,o.pick)]);
  return [0,1].map(i=>[{pick:i},doRest(s,i)]);
}
function score(s){
  const r={p:[0,0],suit:{}};
  SU.forEach(c=>{const a=s.tab[0][c],b=s.tab[1][c],w=a>b?0:b>a?1:-1;r.suit[c]=w;if(w>=0)r.p[w]+=s.price[c]});
  const ta=tot(s.tab[0]),tb=tot(s.tab[1]);r.haf=ta<tb?0:tb<ta?1:-1;if(r.haf>=0)r.p[r.haf]+=3;r.tot=[ta,tb];
  r.kw=1-s.first;r.kefil=kefilOf(s);r.p[r.kw]+=r.kefil;
  r.w=r.p[0]>r.p[1]?0:r.p[1]>r.p[0]?1:(s.mode==='classic'?r.kw:(r.suit.S>=0?r.suit.S:-1));
  return r;
}
function kefilOf(s){return s.mode==='narh'?2:1}
function unseen(s,c){return SD[c].n-s.tab[0][c]-s.tab[1][c]-s.burned[c]-s.open.filter(x=>x===c).length}

/* ================= AI ================= */
function heur(s){
  if(s.phase==='end'){const r=score(s);return r.p[1]-r.p[0]+(r.w===1?.1:r.w===0?-.1:0)}
  const left=3*(6-s.turn),pool=left+3;let v=0;
  SU.forEach(c=>{const k=unseen(s,c)*left/pool,d=s.tab[1][c]-s.tab[0][c];v+=s.price[c]*Math.tanh(d/(0.45+0.55*Math.sqrt(k)))});
  const D=tot(s.tab[1])-tot(s.tab[0]);v+=3*Math.tanh(-D/(0.6+0.35*Math.sqrt(left)));
  const sv=x=>x.uc+x.kes;v+=0.6*(sv(s.seals[1])-sv(s.seals[0]));
  v+=(s.first===0?1:-1)*kefilOf(s);
  return v;
}
function search(s,limit,a,b){
  if(s.phase==='end'||s.turn>limit)return heur(s);
  const owner=s.phase==='choose'?1-s.splitter:s.splitter,kids=children(s);
  if(owner===1){let best=-1e9;for(const k of kids){const v=search(k[1],limit,a,b);if(v>best)best=v;if(best>a)a=best;if(a>=b)break}return best}
  let best=1e9;for(const k of kids){const v=search(k[1],limit,a,b);if(v<best)best=v;if(best<b)b=best;if(a>=b)break}return best;
}
function aiAct(s){
  // Fairness: the search only reaches the next refill, which is the visible caravan; the evaluation uses
  // counts of unseen goods, never their order (verified by the reshuffle test). Master looks two rounds ahead, Apprentice one.
  const usta=set.diff==='usta',limit=usta?s.turn+1:s.turn,kids=children(s);
  let best=-1e9,bi=0;
  kids.forEach((k,i)=>{const v=search(k[1],limit,-1e9,1e9)+Math.random()*(usta?.36:1.2);if(v>best){best=v;bi=i}});
  return kids[bi];
}

/* ================= sound v2.7 (Web Audio, synthesised, no files) =================
   Modelled sounds instead of beeps: inharmonic struck-metal partials for coins, the brass pans and finger
   cymbals (zil); Karplus–Strong plucked strings (oud-like) in makam Hicaz for the result; noise models for
   parchment, wax and fire. Everything goes through one bus: dry + a short generated "vaulted hall" reverb,
   then a compressor so a shower of coins can never clip. */
const AU={c:null,dry:null,rev:null,bus:null,noise:null,ks:{}};
function buildAudio(c,dest){
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=.002;comp.release.value=.25;
  const bus=c.createGain();bus.gain.value=.9;bus.connect(comp);comp.connect(dest);
  const dry=c.createGain();dry.gain.value=1;dry.connect(bus);
  const rev=c.createConvolver();rev.buffer=hallImpulse(c,1.9);const wet=c.createGain();wet.gain.value=.55;rev.connect(wet);wet.connect(bus);
  const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  Object.assign(AU,{c,dry,rev,bus,noise:n,ks:{}});
}
function hallImpulse(c,dur){
  const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/c.sampleRate;lp+=(Math.random()*2-1-lp)*(.55-.4*t/dur);d[i]=lp*Math.pow(1-t/dur,2.4)*(t<.012?0:1)}
    [.013,.021,.034,.047].forEach((t,k)=>{const i=Math.floor(t*c.sampleRate)+ch*37;if(i<len)d[i]+=.5/(k+1)})}
  return b;
}
function ac(){
  if(!AU.c){try{const C=window.AudioContext||window.webkitAudioContext,c=new C();buildAudio(c,c.destination)}catch(e){return null}}
  if(AU.c.state==='suspended')AU.c.resume();return AU.c;
}
function voice(pan=0,rev=.25){const c=AU.c,g=c.createGain(),p=c.createStereoPanner?c.createStereoPanner():null;
  if(p){p.pan.value=Math.max(-1,Math.min(1,pan));g.connect(p);p.connect(AU.dry)}else g.connect(AU.dry);
  if(rev>0){const s=c.createGain();s.gain.value=rev;g.connect(s);s.connect(AU.rev)}return g}
function strike(f,t,dur,g,out,{type='sine',att=.002,glide=0}={}){const c=AU.c,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(f*glide,t+dur);v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(v);v.connect(out);o.start(t);o.stop(t+dur+.05)}
function hiss(t,dur,g,out,{type='bandpass',f=1000,q=1,f2=0,att=.002}={}){const c=AU.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),v=c.createGain();
  s.buffer=AU.noise;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(v);v.connect(out);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
/* metal: a struck object = a few inharmonic modes, higher modes decay faster */
function metal(f,t,g,out,modes,decay){modes.forEach(([r,a,dk])=>strike(f*r*(1+(Math.random()-.5)*.004),t,decay*dk,g*a,out))}
const COIN=[[1,1,1],[1.73,.55,.7],[2.32,.42,.55],[2.92,.26,.42],[3.87,.16,.3]];
const BRASS=[[1,1,1],[2.71,.5,.62],[5.15,.24,.38],[8.4,.1,.22]];
const ZIL=[[1,1,1],[1.58,.7,.85],[2.33,.45,.7],[2.34,.45,.7],[3.11,.25,.5]];
function pluck(freq,dur,bright){const c=AU.c,key=`${freq.toFixed(1)}|${dur}|${bright}`;let b=AU.ks[key];
  if(!b){const sr=c.sampleRate,len=Math.floor(sr*dur),N=Math.max(2,Math.round(sr/freq));b=c.createBuffer(1,len,sr);const d=b.getChannelData(0),buf=new Float32Array(N);
    for(let i=0;i<N;i++)buf[i]=(Math.random()*2-1)*(i<N*.5?1:.6);let p=0;const damp=.5*(.9935+.0045*bright),fadeFrom=Math.floor(len*.55);
    for(let i=0;i<len;i++){const cur=buf[p],nx=buf[(p+1)%N];const v=damp*(cur+nx);buf[p]=v;d[i]=cur*(i<fadeFrom?1:Math.pow(1-(i-fadeFrom)/(len-fadeFrom),2));p=(p+1)%N}
    AU.ks[key]=b}
  return b}
function oud(freq,t,g,out,dur=1.6,bright=.8){const c=AU.c,s=c.createBufferSource(),v=c.createGain(),lp=c.createBiquadFilter();s.buffer=pluck(freq,dur,bright);
  lp.type='lowpass';lp.frequency.value=900+2600*bright;v.gain.value=g;s.connect(lp);lp.connect(v);v.connect(out);s.start(t)}
const HICAZ={D3:146.83,Eb3:155.56,Fs3:185,G3:196,A3:220,D4:293.66,Eb4:311.13,Fs4:369.99,G4:392,A4:440,Bb4:466.16,D5:587.33};
const rnd=(a,b)=>a+Math.random()*(b-a);
const sfx={
  go(fn){if(!set.snd)return;const c=ac();if(!c||!AU.dry)return;try{fn(c.currentTime+.01)}catch(e){}},
  /* a single silver akçe dropped on the counter */
  coin(d=0,pitch=1,gain=1){this.go(t=>{t+=d;const out=voice(rnd(-.45,.45),.22),f=rnd(2100,2700)*pitch,g=gain*1.6;
    hiss(t,.012,.45*g,out,{type:'highpass',f:4200,q:.7,att:.0008});metal(f,t,.16*g,out,COIN,rnd(.35,.6));
    if(Math.random()<.6){const t2=t+rnd(.05,.11);metal(f*rnd(.97,1.03),t2,.07*g,out,COIN,.25);hiss(t2,.008,.18*g,out,{type:'highpass',f:4600})}})},
  /* coins sliding onto a pile: quick, irregular, settling */
  coins(n){n=Math.max(1,n);let tt=0;for(let i=0;i<n;i++){this.coin(tt,rnd(.92,1.06),.6);tt+=rnd(.045,.11)*(1+i*.04)}
    if(n>2)this.go(t=>{const out=voice(0,.15);hiss(t+tt*.6,.25,.08,out,{type:'bandpass',f:2400,q:1.2})})},
  /* a good set on the scale: parchment/cloth slide + soft thump on wood */
  place(){this.go(t=>{const out=voice(rnd(-.2,.2),.04);out.gain.value=.8;hiss(t,.09,.22,out,{type:'bandpass',f:1300,f2:2800,q:.9,att:.01});
    strike(150,t+.04,.12,.22,out,{glide:.6});hiss(t+.04,.05,.14,out,{type:'lowpass',f:500})})},
  /* the beam moves: a short rattle of the pan chains */
  tick(){this.go(t=>{const out=voice(rnd(-.3,.3),.1);for(let i=0;i<4;i++){const ti=t+i*rnd(.025,.045);hiss(ti,.018,rnd(.12,.22),out,{type:'bandpass',f:rnd(4200,6200),q:9})}})},
  /* pans offered: the brass pan rings, the beam knocks, the chains settle */
  clank(){this.go(t=>{const out=voice(0,.35);hiss(t,.06,.28,out,{type:'lowpass',f:260});metal(rnd(300,330),t,.13,out,BRASS,2.2);
    for(let i=0;i<7;i++){const ti=t+.03+i*rnd(.03,.06);hiss(ti,.02,rnd(.05,.1),out,{type:'bandpass',f:rnd(3800,6000),q:8})}})},
  /* wax seal pressed: deep thump, wooden knock, a little squash */
  seal(){this.go(t=>{const out=voice(0,.08);out.gain.value=1.4;strike(115,t,.28,.6,out,{glide:.42});hiss(t,.07,.32,out,{type:'bandpass',f:420,q:3.5});
    hiss(t+.015,.16,.14,out,{type:'lowpass',f:900,att:.01})})},
  /* a good burns: whoosh and crackle */
  burn(){this.go(t=>{const out=voice(rnd(-.2,.2),.3);hiss(t,.75,.12,out,{type:'lowpass',f:300,f2:1800,q:.6,att:.12});
    for(let i=0;i<26;i++){const ti=t+Math.pow(Math.random(),1.6)*.85;hiss(ti,rnd(.004,.016),rnd(.05,.28),out,{type:'highpass',f:rnd(1500,4500),q:2,att:.0006})}})},
  /* narh rises / falls: a small brass bell, up a fifth or down a fourth */
  up(){this.go(t=>{const out=voice(.15,.4);out.gain.value=.8;metal(1318,t,.07,out,ZIL,1.2);metal(1975,t+.12,.08,out,ZIL,1.4)})},
  down(){this.go(t=>{const out=voice(-.15,.4);out.gain.value=.8;metal(1480,t,.07,out,ZIL,1.1);metal(1109,t+.13,.07,out,ZIL,1.3)})},
  /* new round: a pair of zil (finger cymbals) */
  turn(){this.go(t=>{const out=voice(0,.5);out.gain.value=.9;metal(2210,t,.045,out,ZIL,2.2);metal(2240,t+.16,.04,out,ZIL,2.4)})},
  /* result: an oud phrase in makam Hicaz over a coin shower (win) or a falling phrase (loss) */
  win(){this.coins(10);this.go(t=>{const out=voice(0,.45),H=HICAZ;out.gain.value=.8;[[H.D4,0],[H.Fs4,.16],[H.G4,.32],[H.A4,.48],[H.D5,.7]].forEach(([f,d])=>oud(f,t+.2+d,.5,out,1.8,.85));oud(H.D3,t+.9,.35,out,2.4,.6)})},
  lose(){this.go(t=>{const out=voice(0,.45),H=HICAZ;out.gain.value=.63;[[H.A3,0],[H.G3,.28],[H.Fs3,.56],[H.Eb3,.84],[H.D3,1.2]].forEach(([f,d])=>oud(f,t+d,.45,out,2.2,.45))})}
};

/* ================= settings ================= */
let hasSavedSettings=false;
const set={diff:'usta',mode:'narh',tut:true,pv:true,snd:true};
try{const saved=JSON.parse(localStorage.getItem('kantar-set')||'null');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){Object.assign(set,saved);hasSavedSettings=true}}catch(e){}
if(!hasSavedSettings)Object.assign(set,{diff:'cirak',mode:'classic',teach:true});
function saveSet(){try{localStorage.setItem('kantar-set',JSON.stringify(set))}catch(e){}}

/* ================= card identities (for animation) ================= */
let ID;
function initIds(){ID={suit:G.all,MID:[6,7,8,9,10],DID:[...Array(13)].map((_,i)=>11+i),PID:[],TID:[Z2(),Z2()],BID:[]}}
function Z2(){return {S:[],I:[],K:[],B:[]}}
function pushTab(w,ids){ids.forEach(id=>ID.TID[w][ID.suit[id]].push(id))}
function refillIds(){const need=G.market.length-ID.MID.length;if(need>0){ID.MID=ID.MID.concat(ID.DID.slice(0,need));ID.DID=ID.DID.slice(need)}}

/* ================= actions (shared by player & AI) ================= */
function actSplit(idxs,piles){
  const avail=idxs.map(i=>ID.MID[i]);
  ID.PID=piles.map(p=>p.map(c=>{const j=avail.findIndex(id=>ID.suit[id]===c);return avail.splice(j,1)[0]}));
  ID.MID=ID.MID.filter((_,i)=>!idxs.includes(i));
  const pb=G.price;G=doSplit(G,idxs,piles);priceFx(pb);
  piles.length===3?(sfx.seal(),later(()=>sfx.clank(),180)):sfx.clank();
}
function actCut(pi,ci){const id=ID.PID[pi].splice(ci,1)[0];ID.BID.push(id);const pb=G.price;G=doCut(G,pi,ci);sfx.seal();later(()=>sfx.burn(),120);priceFx(pb);return ID.suit[id]}
function actChoose(pick){
  const ch=1-G.splitter,sp=G.splitter;pushTab(ch,ID.PID[pick]);sfx.coins(Math.max(1,ID.PID[pick].length));
  const rest=ID.PID.filter((_,i)=>i!==pick);
  G=doChoose(G,null,pick);
  if(rest.length===1){pushTab(sp,rest[0]);ID.PID=[];refillIds()}else ID.PID=rest;
}
function actRest(pick){
  const sp=G.splitter;pushTab(sp,ID.PID[pick]);ID.BID.push(...ID.PID[1-pick]);ID.PID=[];
  const pb=G.price;G=doRest(G,pick);refillIds();sfx.coins(1);sfx.burn();priceFx(pb);
}
let flashP={};
function priceFx(pb){
  let up=0,dn=0;SU.forEach(c=>{if(G.price[c]>pb[c]){flashP[c]='up';up=1}else if(G.price[c]<pb[c]){flashP[c]='dn';dn=1}});
  if(up)later(()=>sfx.up(),350);if(dn)later(()=>sfx.down(),350);
  if(up||dn)later(()=>{flashP={}},1600);
}

/* ================= UI ================= */
let G,first=0,ui={},logs=[],lastTurn=-1,started=false;
/* Stability v0.4: stale async callbacks never touch a subsequent game. */
let session=0, pendingTimers=new Set();
function later(fn,ms){const token=session;const handle=setTimeout(()=>{pendingTimers.delete(handle);if(token===session)fn()},ms);pendingTimers.add(handle);return handle}
function cancelPending(){session++;pendingTimers.forEach(clearTimeout);pendingTimers.clear();cancelDrag();}
const SAVE_KEY='kantar-game-v04',SAVE_VERSION=5;
function validSave(v){
  if(v&&v.version===4&&v.ui){v.version=5;v.logs=[];v.ui.note=null}
  if(!v||v.version!==SAVE_VERSION||!v.G||!v.ID||!v.ui)return false;
  const g=v.G,id=v.ID;
  if(!Array.isArray(g.all)||g.all.length!==24||!g.all.every(c=>SU.includes(c)))return false;
  if(!Number.isInteger(g.turn)||g.turn<0||g.turn>6||![0,1].includes(g.splitter)||!['split','choose','rest','end'].includes(g.phase))return false;
  if(!['classic','narh'].includes(g.mode)||!Array.isArray(g.tab)||g.tab.length!==2||!Array.isArray(g.seals)||g.seals.length!==2)return false;
  const counts=Z();g.all.forEach(c=>counts[c]++);if(SU.some(c=>counts[c]!==SD[c].n))return false;
  for(const m of [g.market,g.deck,g.hidden,g.open,...(g.piles||[])] )if(!Array.isArray(m)||!m.every(c=>SU.includes(c)))return false;
  for(const obj of [...g.tab,g.burned,g.price])if(!obj||SU.some(c=>!Number.isInteger(obj[c])||obj[c]<0||obj[c]>24))return false;
  if(SU.some(c=>g.price[c]<1||g.price[c]>7))return false;
  if(!Array.isArray(id.MID)||!Array.isArray(id.DID)||!Array.isArray(id.PID)||!Array.isArray(id.BID)||!Array.isArray(id.TID)||id.TID.length!==2)return false;
  const ids=[...id.MID,...id.DID,...id.PID.flat(),...id.BID,...id.TID.flatMap(t=>SU.flatMap(c=>t[c]||[])),0,1,2,3,4,5];
  if(ids.length!==24||new Set(ids).size!==24||ids.some(n=>!Number.isInteger(n)||n<0||n>23))return false;
  if(id.MID.length!==g.market.length||id.PID.length!==(g.piles||[]).length)return false;
  if(id.MID.some((n,i)=>g.all[n]!==g.market[i]))return false;
  if(id.PID.some((p,i)=>p.length!==g.piles[i].length||p.some((n,j)=>g.all[n]!==g.piles[i][j])))return false;
  return Array.isArray(v.logs)&&Array.isArray(v.ui.sel)&&v.ui.sel.length<=3;
}
function saveGame(){if(!started||!G||ui.busy)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:SAVE_VERSION,G,ID,ui:{sel:ui.sel||[],uc:!!ui.uc,cut:!!ui.cut,note:ui.note||null},logs:logs.slice(0,60),first,lastTurn,trail}))}catch(e){console.warn('Save unavailable',e)}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function readSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const v=JSON.parse(raw);if(validSave(v))return v;clearSave()}catch(e){clearSave()}return null}
function restoreGame(v){turnBaseline=null;cancelPending();G=v.G;ID=v.ID;first=v.first;logs=v.logs;lastTurn=v.lastTurn;trail=Array.isArray(v.trail)?v.trail:[];ui={sel:v.ui.sel,uc:v.ui.uc,cut:v.ui.cut,note:v.ui.note,busy:false,fresh:0};started=true;teachMode=set.teach===undefined?true:!!set.teach;KS={t0:0,tm:0,tb:0,tg:0,ap:0,left:false};try{window.posthog&&posthog.capture('kantar_resume',{game:'kantar',turn:G.turn,mode:G.mode})}catch(e){}flashP={};$('endM').classList.add('hide');fit();render();if(G.phase==='end')later(showEnd,300);else if(ownerOf(G)===1)aiStep();else saveGame()}

    else if(sa.suit[c]===0&&now.suit[c]===0&&lead>left&&s.tab[0][c]-s.tab[1][c]<=unseen(s,c))S.push(gtag(c));
    else if(sa.suit[c]===1&&now.suit[c]!==1)RG.push(gtag(c));});
  if(W.length)R.push(t('rWin',list(W)));if(S.length)R.push(t('rSecure',list(S)));if(RG.length)R.push(t('rRivalGains',list(RG)));
  const ta=tot(after.tab[0]),tb=tot(after.tab[1]);
  if(ta<tb)R.push(t('rLightYes',ta,tb));else if(ta>tb&&tot(s.tab[0])<=tot(s.tab[1]))R.push(t('rLightNo',ta,tb));

function autoPlace(mi){

  if(ui.sel.length>=3)return;
  let pan;if(ui.uc){const used=ui.sel.map(s=>s.pan);pan=[0,1,2].find(p=>!used.includes(p))}
  else{const n0=ui.sel.filter(x=>x.pan===0).length;pan=n0<=ui.sel.length-n0?0:1}
  placeCard(mi,pan);
}

/* ---- FLIP animation keyed by card identity ---- */
function snap(){const m={};document.querySelectorAll('[data-key]').forEach(el=>{if(!el.closest('.ghost'))m[el.dataset.key]=el.getBoundingClientRect()});return m}
function flip(old){
  document.querySelectorAll('[data-key]').forEach(el=>{
    const o=old[el.dataset.key];if(!o||el.classList.contains('dragging'))return;const n=el.getBoundingClientRect();
    if(!n.width||!n.height)return;
    const dx=o.left-n.left,dy=o.top-n.top,sx=o.width/n.width,sy=o.height/n.height;
    if(Math.abs(dx)<2&&Math.abs(dy)<2&&Math.abs(sx-1)<.02)return;
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
let saveQueued=false;
function render(){const o=snap();draw();flip(o);if(!saveQueued){saveQueued=true;setTimeout(()=>{saveQueued=false;saveGame()},250)}}

function previewText(k){
  if(!set.pv)return '';
  const fmt=s=>{const r=score(s);return `${r.p[0]} : ${r.p[1]}`};
  try{
    if(playerSplitting()){
      if(ui.sel.length<3)return '';
      const P=selPiles();if(k>=P.length)return '';
      let s=doSplit(G,ui.sel.map(x=>x.mi),P);s=doChoose(s,null,k);
      if(s.phase==='rest'){const a=doRest(s,0),b=doRest(s,1),ra=score(a),rb=score(b);s=(ra.p[0]-ra.p[1]>=rb.p[0]-rb.p[1])?a:b}
      return t('ifTheyTake',fmt(s));
    }
    const yourMove=G.phase!=='end'&&ownerOf(G)===0&&!ui.busy;
    if(!yourMove)return '';
    if(G.phase==='choose'){let s=doChoose(G,null,k);
      if(s.phase==='rest'){const a=doRest(s,0),b=doRest(s,1),ra=score(a),rb=score(b);s=(ra.p[1]-ra.p[0]>=rb.p[1]-rb.p[0])?a:b}
      return t('ifYouTake',fmt(s))}
    if(G.phase==='rest')return t('ifYouTake',fmt(doRest(G,k)));
  }catch(e){}
  return '';
}
function coachText(){
  if(!G.tut||G.phase==='end')return '';
  if(ui.busy)return t('coachWatch');
  if(ownerOf(G)!==0)return t('coachRival');
  if(G.phase==='split'){
    if(ui.sel.length===0)return t('coach1');
    if(ui.sel.length<3)return t('coach1b',ui.sel.length,3-ui.sel.length);
    return t('coach2');
  }
  if(G.phase==='choose')return ui.cut?t('coachCut'):t('coachChoose');
  return t('coachRest');
}
function decisionInsight(){
  if(!set.pv||ui.busy||ownerOf(G)!==0||G.phase==='end')return '';
  if(G.phase==='split'){
    if(ui.sel.length!==3)return t('insight0');
    const piles=selPiles(),types=Z();piles.flat().forEach(c=>types[c]++);
    const nar=G.mode==='narh'?SU.filter(c=>types[c]>=2&&G.price[c]>PMIN).map(c=>[c,G.price[c],G.price[c]-1]):[];
    const info=piles.map((p,k)=>`${t('panN',k+1)}: ${pileStr(p)}`).join(' · ');
    return `${t('offerInfo',info)} ${nar.length?t('narhFall',priceList(nar)):''} ${t('thinkRival')}`;
  }
  if(G.phase==='choose'||G.phase==='rest'){
    if(ui.cut)return t('cutInsight');
    const opts=G.piles.map((p,k)=>{
      try{let n=G.phase==='rest'?doRest(G,k):doChoose(G,null,k);
        if(n.phase==='rest'){const x=doRest(n,0),y=doRest(n,1);n=score(x).p[1]-score(x).p[0]>=score(y).p[1]-score(y).p[0]?x:y}
        const now=score(G),after=score(n),delta=after.p[0]-now.p[0];
        const gains=SU.filter(c=>now.suit[c]!==0&&after.suit[c]===0).map(gtag);
        const losses=SU.filter(c=>now.suit[c]===0&&after.suit[c]!==0).map(gtag);
        const signs=[gains.length?t('gains',list(gains)):'',losses.length?t('losses',list(losses)):''].filter(Boolean);
        return `<b>${t('panN',k+1)}:</b> ${pileStr(p)} · ${t('effect')} <span class="${delta>=0?'good':'bad'}">${signed(delta)}</span>${signs.length?' · '+signs.join('; '):''}`;
      }catch(e){return `${t('panN',k+1)}: ${pileStr(p)}`}
    });
    return `${t('compare')} ${opts.join('<hr class="ins-hr">')}<div class="muted ins-note">${t('previewNote')}</div>`;
  }
  return '';
}

function turnRecap(before){

  const r=score(G),acq=SU.flatMap(c=>{const a=G.tab[0][c]-before.tab[0][c],b=G.tab[1][c]-before.tab[1][c];return (a||b)?[[c,a,b]]:[]});
  return {k:'recap',turn:before.turn+1,acq,prices:priceDiff(before.price,G.price),diff:r.p.map((v,i)=>v-before.score.p[i])};

/* ---- drag & drop (mouse + touch) ---- */
let drag=null;
function cancelDrag(){if(!drag)return;const d=drag;drag=null;if(d.g)d.g.remove();if(d.el)d.el.classList.remove('dragging');document.body.classList.remove('isDragging');document.querySelectorAll('.dropOver').forEach(x=>x.classList.remove('dropOver'));}
window.addEventListener('blur',cancelDrag);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelDrag();});
function hit(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const p=el.closest('.pan.droppable');if(p&&!p.classList.contains('hide'))return {pan:+p.dataset.pan};if(el.closest('#market.live'))return {market:1};return null}
function markDrop(tg){document.querySelectorAll('.dropOver').forEach(e=>e.classList.remove('dropOver'));if(!tg)return;(tg.market?$('market'):$('pan'+tg.pan)).classList.add('dropOver')}
document.addEventListener('pointerdown',e=>{
  ac();const el=e.target.closest('[data-drag]');if(!el||e.button>0||drag)return;
  e.preventDefault();const r=el.getBoundingClientRect();
  drag={pointerId:e.pointerId,el,src:el.dataset.drag,mi:+el.dataset.mi,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,started:false};
});
document.addEventListener('pointermove',e=>{
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(!drag.started){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.started=true;const g=drag.el.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-key');g.style.width=drag.w+'px';g.style.height=drag.h+'px';
    document.body.appendChild(g);drag.g=g;drag.el.classList.add('dragging');document.body.classList.add('isDragging');sfx.place()}
  drag.g.style.transform=`translate(${e.clientX-drag.ox}px,${e.clientY-drag.oy}px) rotate(5deg) scale(1.08)`;
  /* keep the scale reachable on short screens: scroll while dragging near the top/bottom edge */
  const edge=56;if(e.clientY>innerHeight-edge)scrollBy(0,14);else if(e.clientY<edge)scrollBy(0,-14);
  markDrop(hit(e.clientX,e.clientY));
});
function endDrag(e,cancel){
  if(!drag||((e.type==='pointerup'||e.type==='pointercancel')&&drag.pointerId!==e.pointerId))return;const d=drag;drag=null;document.body.classList.remove('isDragging');markDrop(null);
  if(!d.started){if(!cancel){if(d.src==='m')autoPlace(d.mi);else if(!ui.uc){const x=ui.sel.find(s=>s.mi===d.mi);if(x){x.pan^=1;sfx.place();render()}}else unplace(d.mi)}return}
  const tg=cancel?null:hit(e.clientX,e.clientY);
  const gr=d.g.getBoundingClientRect();d.g.remove();d.el.classList.remove('dragging');
  if(tg&&tg.market){if(d.src==='p')unplace(d.mi);else render()}
  else if(tg)placeCard(d.mi,tg.pan);
  else render();
  const el=document.querySelector(`[data-key="${ID.MID[d.mi]}"]`);
  if(el){const n=el.getBoundingClientRect();el.animate([{transform:`translate(${gr.left-n.left}px,${gr.top-n.top}px) rotate(5deg)`},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})}
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();drag={el,src:el.dataset.drag,mi:+el.dataset.mi,started:false};endDrag(e,false)}});

/* ---- turn flow ---- */
function playerOffer(){
  const idxs=ui.sel.map(x=>x.mi),piles=selPiles(),pb=G.price;
  // first real move of a game: how long it took and whether the teacher's suggestion was used
  if(!KS.first&&KS.t0){KS.first=1;track('kantar_first_move',{ms:Date.now()-KS.t0,teacher:teachMode,applied:KS.ap>0,mode:G.mode,diff:set.diff})}
  if(TCH.key===stateKey(G))teacherFeedback('split',{piles});
  actSplit(idxs,piles);
  const price=priceDiff(pb,G.price);
  addLog({k:'split',who:0,turn:G.turn+1,piles,uc:piles.length===3,price});
  ui.note=price.length?[{k:'price',price}]:null;ui.sel=[];advance();
}
function playerCut(pi,i){
  const pb=G.price,c=actCut(pi,i);ui.cut=false;
  const e={k:'cut',who:0,c,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];render();
}
function playerPick(k){
  if(TCH.key===stateKey(G))teacherFeedback(G.phase,{pick:k});
  if(G.phase==='choose'){
    const taken=G.piles[k].slice(),rest=G.piles.filter((_,i)=>i!==k);
    addLog({k:'take',who:0,taken,rest:rest.length===1?rest[0].slice():null});
    actChoose(k);
  }else{
    const pb=G.price,taken=G.piles[k].slice(),burned=G.piles[1-k].slice();
    actRest(k);addLog({k:'rest',who:0,taken,burned,price:priceDiff(pb,G.price)});
  }
  ui.note=null;advance();
}
function aiStep(){
  ui.busy=true;render();
  const delay=G.phase==='split'?(ui.fresh?2000:1100):900;ui.fresh=0;
  later(()=>{
    const [act]=aiAct(G),s=G;
    if(s.phase==='split'){actSplit(act.idxs,act.piles);const price=priceDiff(s.price,G.price);
      addLog({k:'split',who:1,turn:s.turn+1,piles:act.piles,uc:act.piles.length===3,price});
      ui.note=act.piles.length===3?[{k:'uc',price}]:(price.length?[{k:'price',price}]:null);
      ui.busy=false;advance();}
    else if(s.phase==='choose'){
      const go=()=>{const piles=G.piles,rest=piles.filter((_,i)=>i!==act.pick);
        const e={k:'take',who:1,taken:piles[act.pick].slice(),rest:rest.length===1?rest[0].slice():null};
        actChoose(act.pick);addLog(e);ui.note=(act.cut&&ui.note?ui.note:[]).concat([e]);ui.busy=false;advance()};
      if(act.cut){const pb=G.price,c=actCut(act.cut[0],act.cut[1]);const e={k:'cut',who:1,c,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];render();later(go,900)}
      else go();
    }else{const pb=G.price,taken=s.piles[act.pick].slice(),burned=s.piles[1-act.pick].slice();actRest(act.pick);
      const e={k:'rest',who:1,taken,burned,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];ui.busy=false;advance()}
  },delay);
}
function banner(text){const b=$('banner');b.textContent=text;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function advance(){
  if(G.turn!==lastTurn){
    if(lastTurn>=0){if(turnBaseline){const recap=turnRecap(turnBaseline);if(recap)addLog(recap)}trail.push(score(G).p.slice())}
    turnBaseline=G.phase==='end'?null:takeTurnBaseline();const note=ui.note;resetUi();ui.note=note;lastTurn=G.turn;
    if(G.phase!=='end'){ui.fresh=1;later(()=>{banner(t('banner',G.turn+1,G.splitter===0));sfx.turn()},G.turn?250:150)}}
  render();
  if(G.phase==='end'){saveGame();later(()=>showEnd(),1200);return}
  if(ownerOf(G)===1)aiStep();
}
function showEnd(quiet){
  if(!quiet&&set.teach===undefined){set.teach=false;saveSet()}
  if(!quiet)recordGame();
  const r=score(G);const w=r.w;
  const head=w===0?t('endWin'):w===1?t('endLose'):t('endDraw');
  const lines=SU.map(c=>[gtag(c),G.price[c],G.tab[0][c],G.tab[1][c],r.suit[c],G.price[c]]);
  lines.push([ki('light')+t('lightLoad'),'',r.tot[0],r.tot[1],r.haf,3]);
  if(r.kefil)lines.push([ki('coin')+t('compCoin'),'',r.kw===0?'✓':'',r.kw===1?'✓':'',r.kw,r.kefil]);
  const rows=lines.map((l,i)=>`<tr style="animation-delay:${quiet?0:.35+i*.35}s"><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]===0?`<b class="g">${t('toYou',l[5])}</b>`:l[4]===1?`<b class="r">${t('toRival',l[5])}</b>`:t('nobody')}</td></tr>`).join('');
  const tight=SU.filter(c=>Math.abs(G.tab[0][c]-G.tab[1][c])===1).map(gtag);
  const why=tight.length?t('tight',list(tight)):'';const EH=t('endHead');
  $('endSheet').innerHTML=`${ART_ON?`<figure class="endart ${w===0?'win':w===1?'lose':'draw'} ${set.diff==='usta'?'usta':'cirak'}" aria-hidden="true"></figure>`:''}<h2>${head}</h2><p class="final">${t('you')} <b>${r.p[0]}</b> · ${t('rival')} <b>${r.p[1]}</b>${r.p[0]===r.p[1]?(G.mode==='classic'?t('tieClassic'):t('tieNarh')):''}</p>
   <table class="endT"><tr><th>${EH[0]}</th><th>${G.mode==='narh'?EH[1]:EH[2]}</th><th>${EH[3]}</th><th>${EH[4]}</th><th>${EH[5]}</th></tr>${rows}</table>
   <p class="small">${why} ${t('hidden',list([0,1,2].map(id=>gtag(ID.suit[id]))))}</p>
   ${trailChart(trail,set.diff)}
   <div class="opts"><button class="btn" id="closeEnd">${t('lookCounter')}</button><button class="btn" id="endStats">${t('statsBtn')}</button><button class="btn" id="endShare">${t('shareBtn')}</button><span style="flex:1"></span><button class="btn primary" id="again">${t('again',first!==0)}</button></div>
   <div data-hl-next data-hl-lang="${language}"></div>`;
  $('endM').classList.remove('hide');
  if(!quiet){lines.forEach((l,i)=>{if(l[4]>=0)later(()=>sfx.coins(Math.min(6,l[5])),350+i*350)});
    later(()=>w===0?sfx.win():w===1?sfx.lose():sfx.turn(),350+lines.length*350+200);}
  $('again').onclick=()=>{$('endM').classList.add('hide');start(1-first)};
  $('closeEnd').onclick=()=>$('endM').classList.add('hide');
  $('endStats').onclick=()=>openStats();
  $('endShare').onclick=e=>shareResult(e.currentTarget);
}
function start(f){KS={t0:Date.now(),tm:0,tb:0,tg:0,ap:0,left:false};track('kantar_game_start',{mode:set.mode,diff:set.diff,teacher:set.teach===undefined?true:!!set.teach,first:f===0?'you':'rival'});teachMode=set.teach===undefined?true:!!set.teach;TCH.key=null;TCH.data=null;turnBaseline=null;cancelPending();clearSave();started=true;first=f;G=newGame(f,set.mode,set.tut);initIds();logs=[];trail=[score(G).p.slice()];lastTurn=-1;ui={note:null};resetUi();flashP={};fit();advance()}

/* ---- responsive scale ---- */
function fit(){const w=$('counter').clientWidth-28,f=Math.min(1,w/680);/* .scale height comes from CSS (350 drawn, 410 painted) */$('scale').style.setProperty('--f',f.toFixed(3));$('scale').style.setProperty('--cz',Math.min(1.45,Math.max(1,.8/f)).toFixed(3));document.body.classList.toggle('narrow',f<.85)}
addEventListener('resize',fit);

/* ---- static text + language switch ---- */
function applyStatic(){
  document.documentElement.lang=language;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle)});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria))});
  const gh=t('goodsHead');
  $('goodsKey').innerHTML=`<table><tr><th>${gh[0]}</th><th>${gh[1]}</th><th>${gh[2]}</th></tr>${SU.map(c=>`<tr><td>${gtag(c)}</td><td>${SD[c].n}</td><td>${SD[c].p}</td></tr>`).join('')}</table>`;
  $('rulesGoods').innerHTML=SU.map(c=>card(c)).join('');
  $('playBtn').textContent=started?t('newWith'):t('open');
  if(typeof renderStart==='function'&&$('welcome')&&!$('welcome').hidden)renderStart();
  $('languageSelect').value=language;
}
function setLanguage(l){
  language=l==='tr'?'tr':'en';try{localStorage.setItem('kantar-lang',language)}catch(e){}
  $('banner').textContent='';$('banner').classList.remove('show');TCH.key=null;TCH.data=null;applyStatic();if(G)render();if(!$('endM').classList.contains('hide')&&G&&G.phase==='end')showEnd(true);
}
$('languageSelect').addEventListener('change',e=>setLanguage(e.target.value));

/* ---- setup ---- */
function syncOpts(){
  document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>{const on=set[sg.dataset.set]===b.dataset.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')}));
  $('optTut').checked=set.tut;$('optTeach').checked=set.teach===undefined?true:!!set.teach;$('optPv').checked=set.pv;$('optSnd').checked=set.snd;
  document.querySelectorAll('.narhOnly').forEach(e=>e.style.opacity=set.mode==='narh'?1:.45);
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{set[b.parentElement.dataset.set]=b.dataset.v;saveSet();syncOpts()});
$('optTut').onchange=e=>{set.tut=e.target.checked;saveSet()};
$('optPv').onchange=e=>{set.pv=e.target.checked;saveSet()};
$('optSnd').onchange=e=>{set.snd=e.target.checked;saveSet()};
function beginFromSetup(learning=false){
  if(learning){Object.assign(set,{diff:'cirak',mode:'classic',teach:true,tut:true,pv:true});syncOpts()}
  saveSet();$('rules').classList.add('hide');ac();sfx.coin();start(learning?0:first);
  requestAnimationFrame(()=>{const b=document.querySelector('#market button');if(b)b.focus({preventScroll:true})});
}
$('learnBtn').onclick=()=>beginFromSetup(true);
$('learnAgain').onclick=()=>beginFromSetup(true);
$('playBtn').onclick=()=>beginFromSetup();
$('quickPlay').onclick=()=>beginFromSetup();
// "Play without the teacher": the same gentle start, teacher off (it can be switched on again in the game's header)
$('noTeachBtn').onclick=()=>{set.teach=false;syncOpts();beginFromSetup()};
$('setupDetails').addEventListener('toggle',e=>{if(e.target.open){syncOpts();requestAnimationFrame(()=>e.target.scrollIntoView({behavior:'smooth',block:'start'}))}});
/* which start the sheet offers: first visit, saved settings, or a match in progress */
var startMode='first';
function renderStart(){
  const first=startMode==='first',resume=startMode==='resume';
  $('welcomeSteps').hidden=!first;
  $('learnBtn').hidden=!first;$('noTeachBtn').hidden=!first;
  $('quickPlay').hidden=startMode!=='saved';$('quickResume').hidden=!resume;$('learnAgain').hidden=first;
  const te=set.teach===undefined?true:!!set.teach;
  $('startNote').textContent=first?t('startNoteLearn'):resume?t('startNoteResume',Math.min(6,((previousSave&&previousSave.G&&previousSave.G.turn)||0)+1))
    :t('startNoteSaved',set.diff==='usta'?t('master'):t('apprentice'),set.mode==='narh'?t('modeNarh'):t('modeClassic'),te);
}
$('resumeBtn').onclick=()=>{$('rules').classList.add('hide');if(G)render()};
$('rulesBtn').onclick=()=>{$('welcome').hidden=true;$('setupDetails').open=true;applyStatic();$('resumeBtn').style.display=started?'':'none';syncOpts();$('rules').classList.remove('hide')};
$('statsBtn').onclick=openStats;
$('newBtn').onclick=()=>{$('endM').classList.add('hide');$('rules').classList.add('hide');start(0)};
$('sndBtn').onclick=()=>{set.snd=!set.snd;saveSet();if(set.snd)sfx.coin();if(G)render()};
$('pvBtn').onclick=()=>{set.pv=!set.pv;saveSet();if(G)render()};
$('teachBtn').onclick=()=>setTeach(!teachMode);
$('optTeach').onchange=e=>{set.teach=e.target.checked;saveSet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('endM').classList.contains('hide'))$('endM').classList.add('hide');else if(started&&!$('rules').classList.contains('hide')){$('rules').classList.add('hide');render()}}});
applyStatic();syncOpts();
// the short start sheet is always first; the full rules and options stay folded until asked for
$('welcome').hidden=false;$('setupDetails').open=false;
startMode=hasSavedSettings?'saved':'first';
G=newGame(0,set.mode,set.tut);initIds();resetUi();fit();draw();
const previous=readSave();var previousSave=previous;
if(previous){startMode='resume';const go=()=>{$('rules').classList.add('hide');ac();restoreGame(previous)};
  $('resumeSaved').style.display='';$('resumeSaved').onclick=go;$('quickResume').onclick=go;}
renderStart();

</script>
</body>
