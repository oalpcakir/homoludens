<title>Retourvloot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+DW+Pica+SC&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a director's desk in the East India House. A chart of the route east fills the middle; the headline numbers
   sit in the top bar; every department (fleet, auction, Asia, shareholders, books, aims) is one tab in the side drawer. */
:root{
  --paper:#efe9db; --paper-2:#e6dfcd; --card:#f8f4ea; --ink:#2a2419; --ink-2:#5b5244; --ink-3:#6f6556;
  --delft:#26457d; --delft-soft:rgba(38,69,125,.10); --brass:#8a5d0f; --brass-soft:rgba(138,93,15,.13);
  --rule:rgba(92,70,36,.24); --rule-2:rgba(92,70,36,.12); --loss:#9b2f27; --gain:#2c6a47;
  --bar:#1b2538; --bar-ink:#f1ead8; --bar-ink-2:#b9b19e; --bar-rule:rgba(241,234,216,.14);
  /* chart (map) */
  --sea:#e9dcbc; --sea-2:#dccaa0; --land:#d7c294; --land-2:#c8ae78; --coast:#6e5128; --chart-ink:#3b2d18; --chart-ink-2:#6f5a3a; --rhumb:rgba(110,81,40,.16);
  --out:#24477f; --home:#a86b08; --seal:#a3262a; --chart:#e9dcbc; --on-badge:#fff;
  --f-display:"IM Fell DW Pica","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-sc:"IM Fell DW Pica SC","IM Fell DW Pica",Georgia,serif;
  --f-body:"Spectral","Iowan Old Style",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161f; --paper-2:#191f2b; --card:#171d29; --ink:#ebe4d3; --ink-2:#b4ab98; --ink-3:#8b8371;
  --delft:#9bb8ee; --delft-soft:rgba(155,184,238,.13); --brass:#ddae55; --brass-soft:rgba(221,174,85,.15);
  --rule:rgba(235,228,211,.20); --rule-2:rgba(235,228,211,.09); --loss:#ec8a7f; --gain:#86cda3;
  --bar:#0b0f16; --bar-rule:rgba(241,234,216,.10);
  --sea:#1b2433; --sea-2:#253047; --land:#3b3a33; --land-2:#4a473c; --coast:#a99568; --chart-ink:#e2d6b8; --chart-ink-2:#b3a481; --rhumb:rgba(226,214,184,.10);
  --out:#8fb2f0; --home:#e6b04f; --seal:#e0645c; --chart:#1b2433; --on-badge:#121826; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161f; --paper-2:#191f2b; --card:#171d29; --ink:#ebe4d3; --ink-2:#b4ab98; --ink-3:#8b8371;
  --delft:#9bb8ee; --delft-soft:rgba(155,184,238,.13); --brass:#ddae55; --brass-soft:rgba(221,174,85,.15);
  --rule:rgba(235,228,211,.20); --rule-2:rgba(235,228,211,.09); --loss:#ec8a7f; --gain:#86cda3;
  --bar:#0b0f16; --bar-rule:rgba(241,234,216,.10);
  --sea:#1b2433; --sea-2:#253047; --land:#3b3a33; --land-2:#4a473c; --coast:#a99568; --chart-ink:#e2d6b8; --chart-ink-2:#b3a481; --rhumb:rgba(226,214,184,.10);
  --out:#8fb2f0; --home:#e6b04f; --seal:#e0645c; --chart:#1b2433; --on-badge:#121826; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.num,table,.kpi b,output{font-variant-numeric:tabular-nums lining-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-weight:400;text-wrap:balance;margin:0}
p{margin:0 0 .6em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.neg{color:var(--loss)} .pos{color:var(--gain)}

/* ---------- app frame: top bar + desk, fits one screen on a laptop ---------- */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;min-height:620px}
.top{background:var(--bar);color:var(--bar-ink);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 24px;align-items:center;padding:8px 20px;border-bottom:3px solid var(--brass)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.01em}
.brand .sub{display:block;font-family:var(--f-sc);color:var(--bar-ink-2);font-size:13.5px;letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.mark{font-family:var(--f-sc);font-size:14px;border:1.5px solid #d7a64a;color:#e8bd66;padding:3px 7px 1px;letter-spacing:.14em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-width:0}
.kpi{padding:1px 16px;border-left:1px solid var(--bar-rule);min-width:0}
.kpi .kl{display:block;font-family:var(--f-sc);font-size:13.5px;line-height:1.2;letter-spacing:.08em;color:var(--bar-ink-2)}
.kpi b{display:block;font-weight:500;font-size:26px;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:14px;line-height:1.3;color:var(--bar-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b.neg{color:#f19a8e} .kpi .pos{color:#9fdcb5} .kpi .neg{color:#f19a8e}
.kpi .moodrow{display:flex;align-items:center;gap:10px}
.kpi .moodrow b{flex:none}
.kpi .meter{flex:1;height:6px;margin:0;min-width:40px;background:rgba(241,234,216,.16)}
.kpi .meter i{background:#e2b45a}
.kpi .meter.bad i{background:#ee7d70}
.when-box{display:flex;align-items:center;gap:16px}
.clock{text-align:right}
.clock .d{font-family:var(--f-display);font-size:24px;line-height:1.1;white-space:nowrap}
.clock .w{font-size:13.5px;color:var(--bar-ink-2);white-space:nowrap}
.clock .w b{color:#e8bd66;font-weight:600}
.speed{display:flex;border:1px solid rgba(241,234,216,.3);border-radius:6px;overflow:hidden}
.speed button{background:none;border:0;padding:8px 12px;cursor:pointer;font-size:15px;color:var(--bar-ink);border-left:1px solid rgba(241,234,216,.2);min-width:44px}
.speed button:first-child{border-left:0}
.speed button[aria-pressed="true"]{background:#e2b45a;color:#1b2538;font-weight:600}
.speed button:hover:not([aria-pressed="true"]){background:rgba(241,234,216,.1)}

.desk{display:grid;grid-template-columns:minmax(0,1fr) clamp(390px,30vw,480px);gap:12px;padding:12px 16px;min-height:0}
.mapcol{display:grid;grid-template-rows:minmax(0,1fr) clamp(126px,20vh,224px);gap:12px;min-height:0;min-width:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:0}
.card h2{font-family:var(--f-sc);font-size:19px;letter-spacing:.04em;color:var(--delft);display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.card h2 small{font-family:var(--f-body);font-size:14px;letter-spacing:0;color:var(--ink-3);font-style:italic}

/* ---------- the chart ---------- */
.mapcard{padding:0;overflow:hidden;position:relative;min-height:0}
.mapwrap{background:var(--sea) url(img/rv_paper.webp) 0 0/360px;background-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapwrap{background-image:none}}
:root[data-theme="dark"] .mapwrap{background-image:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#map .land{fill:var(--land);stroke:var(--coast);stroke-width:.9;stroke-linejoin:round}
#map .wl{fill:none;stroke:var(--coast);stroke-linejoin:round}
#map .rh{stroke:var(--rhumb);stroke-width:.7;fill:none}
#map .rh.m{stroke-width:1.1}
#map .frame{fill:none;stroke:var(--chart-ink);stroke-width:1.2}
#map .tick{fill:var(--chart-ink)}
#map .tick.b{fill:var(--sea)}
#map .rgn{font-family:var(--f-display);font-style:italic;fill:var(--chart-ink-2);letter-spacing:.18em;text-anchor:middle}
#map .sea-l{font-family:var(--f-display);font-style:italic;fill:var(--chart-ink-2);opacity:.85;text-anchor:middle;letter-spacing:.12em}
#map .pl{font-family:var(--f-body);font-size:var(--plfs,16px);fill:var(--chart-ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round;font-weight:500}
#map .pl.dim{fill:var(--chart-ink-2);font-weight:400;font-style:italic}
#map .pl.hub{font-family:var(--f-display);font-size:var(--hubfs,20px);font-weight:400}
#map .route{fill:none;stroke-width:1.6;stroke-dasharray:7 6;stroke-linecap:round}
#map .route.out{stroke:var(--out);opacity:.55}
#map .route.home{stroke:var(--home);opacity:.6}
#map .hit{cursor:pointer}
#map .hit:hover .badge,#map .hit:focus .badge,#map .hit.sel .badge{stroke:var(--brass);stroke-width:3}
#map .hit:focus{outline:none}
#map .badge{stroke:var(--sea);stroke-width:2}
#map .ship .hull{fill:var(--on-badge)}
#map .ship.out .badge{fill:var(--out)}
#map .ship.home .badge{fill:var(--home)}
#map .ship.lost .badge{fill:var(--loss)}
#map .seal-env{fill:#f6efdc;stroke:#6e5128;stroke-width:1}
#map .seal-wax{fill:var(--seal)}
#map .post .dot{fill:var(--brass);stroke:var(--sea);stroke-width:2}
#map .post.can .dot{fill:var(--sea);stroke:var(--brass);stroke-width:2.2}
#map .post.ordered .dot{fill:var(--sea);stroke:var(--out);stroke-width:2.4;stroke-dasharray:3 2}
#map .post.lost .dot{fill:var(--loss);stroke:var(--sea)}
#map .post .mono{fill:none;stroke:var(--seal);stroke-width:2}
#map .post .x{stroke:#fff;stroke-width:2;stroke-linecap:round}
#map .post .lead{stroke:var(--chart-ink-2);stroke-width:1;fill:none;opacity:.75;pointer-events:none}
#map .post .lead-pt{fill:var(--chart-ink-2);pointer-events:none}
#map .port .dot{fill:var(--out);stroke:var(--sea);stroke-width:2.5}
#map .count{font-family:var(--f-body);font-size:13px;font-weight:600;fill:var(--on-badge);text-anchor:middle;dominant-baseline:central}
#map .countb{stroke:var(--sea);stroke-width:2}
#map .cart-bg{fill:var(--card);stroke:var(--chart-ink);stroke-width:1.2}
#map .cart-in{fill:none;stroke:var(--chart-ink);stroke-width:.6}
#map .cart-t{font-family:var(--f-display);fill:var(--chart-ink);text-anchor:middle}
#map .cart-s{font-family:var(--f-display);font-style:italic;fill:var(--chart-ink-2);text-anchor:middle}
#map .wreckx{stroke:var(--loss);stroke-width:2.5;stroke-linecap:round}
.mapcard{display:flex;flex-direction:column}
.mapbar{display:flex;align-items:center;gap:8px 14px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--rule);background:var(--card);flex-wrap:wrap}
.mapbar h2{margin:0;font-size:18px;white-space:nowrap}
@media (max-width:1440px){.brand .sub{display:none}.brand h1{font-size:28px}.kpi{padding:1px 14px}}
@media (max-width:1560px){.mapbar h2 small{display:none}}
.mapchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);border-radius:99px;padding:2px 11px;font-size:14px;color:var(--ink-2);white-space:nowrap;background:var(--paper)}
.chip b{color:var(--ink);font-weight:600}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%}
.keybtn{background:none;border:1px solid var(--rule);border-radius:6px;padding:3px 12px;font-size:14px;color:var(--delft);cursor:pointer;min-height:30px}
.keybtn[aria-expanded="true"]{background:var(--delft);color:var(--card)}
.mapwrap{position:relative;inset:auto;flex:1;min-height:0}
.mapkey{position:absolute;top:10px;right:10px;z-index:3;width:280px;display:grid;gap:5px;font-size:14.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px rgba(20,14,4,.22)}
.mapkey span{display:flex;align-items:center;gap:9px}
.mapkey p{font-size:14px;margin:6px 0 0;color:var(--ink-3)}
.mapkey i,.chip i{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.lg-out{background:var(--out)} .lg-home{background:var(--home)}
i.lg-letter{width:15px;height:11px;border-radius:1px;background:radial-gradient(circle at 50% 62%,var(--seal) 0 2.6px,#f6efdc 3px);border:1px solid #6e5128}
.lg-post{background:var(--brass)} i.lg-mono{background:var(--brass);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--seal)}
i.lg-can{border:2px solid var(--brass)} i.lg-ord{border:2px dashed var(--out)} .lg-lost{background:var(--loss)}
.chip i.lg-asia{background:var(--delft);box-shadow:0 0 0 3px var(--delft-soft)}
.pop{position:absolute;z-index:4;width:320px;max-width:calc(100% - 24px);background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:8px;box-shadow:0 12px 34px rgba(20,14,4,.28);padding:14px 16px 12px}
.pop .pk{font-family:var(--f-sc);font-size:13.5px;letter-spacing:.07em;color:var(--brass)}
.pop h3{font-family:var(--f-display);font-size:23px;line-height:1.15;margin:1px 0 8px;padding-right:22px}
.pop p{font-size:15px;margin:0 0 8px}
.pop .x{position:absolute;top:6px;right:6px;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px;border-radius:4px}
.pop .x:hover{background:var(--delft-soft)}
.pop .kv{font-size:15px}
.pop .row{margin-top:8px}
.pbar{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.pbar i{display:block;height:100%}

/* ---------- strip under the chart ---------- */
.strip{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:0}
.strip .card{display:flex;flex-direction:column;min-height:0;padding:10px 16px}
.strip .card h2{font-size:17px;margin-bottom:6px}
/* bottom room for the site's round Feedback/Discord buttons, which sit over this card's lower-left corner */
.notes{list-style:none;margin:0;padding:0 4px 46px 0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.notes li{font-size:15px;line-height:1.4;padding:6px 10px 6px 12px;border-left:3px solid var(--delft);background:var(--delft-soft);border-radius:0 4px 4px 0}
.notes li.warn{border-left-color:var(--loss);background:color-mix(in srgb,var(--loss) 9%,transparent)}
.notes li.good{border-left-color:var(--gain);background:color-mix(in srgb,var(--gain) 9%,transparent)}
.log{list-style:none;margin:0;padding:0 4px 0 0;overflow-y:auto;min-height:0;font-size:15px;line-height:1.4}
.log li{padding:5px 0 5px 14px;border-bottom:1px solid var(--rule-2);position:relative}
.log li::before{content:"";position:absolute;left:0;top:12px;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.log li.ship::before{background:var(--out)} .log li.loss::before{background:var(--loss)} .log li.money::before{background:var(--brass)}
.log time{font-size:13.5px;color:var(--ink-3);font-family:var(--f-sc);letter-spacing:.04em;margin-right:6px}

/* ---------- side drawer ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--rule);background:var(--paper-2)}
.tabs button{position:relative;background:none;border:0;border-bottom:3px solid transparent;padding:11px 2px 9px;font-family:var(--f-sc);font-size:15.5px;letter-spacing:.03em;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--delft-soft)}
.tabs button[aria-selected="true"]{color:var(--delft);border-bottom-color:var(--delft);background:var(--card)}
.tabs button .dot{position:absolute;top:7px;right:calc(50% - 30px);width:8px;height:8px;border-radius:50%;background:var(--brass)}
.tabs button .dot.warn{background:var(--loss)}
.panes{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pane .card{border:0;border-radius:0;background:none;padding:16px 20px;border-bottom:1px solid var(--rule-2)}
.pane .card:last-child{border-bottom:0}
.sidefoot{border-top:1px solid var(--rule);padding:8px 14px;display:flex;justify-content:flex-end;background:var(--paper-2)}
.sidefoot .row{gap:8px}

.meta{font-size:15px;color:var(--ink-3);margin:-4px 0 12px}
.note{font-size:15px;color:var(--ink-3);font-style:italic}
.lab,label{font-size:15px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.check{gap:8px;cursor:pointer}
.row.check input{width:18px;height:18px;accent-color:var(--delft)}
.between{justify-content:space-between}
.big-out{font-size:18px;font-weight:600;color:var(--ink)}
input[type=range]{accent-color:var(--delft);width:100%;min-width:0;margin:6px 0 2px;height:22px}
select{background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;max-width:100%;font-size:15px}
.btn{background:var(--delft);color:var(--card);border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;min-height:42px}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.btn.wide{width:100%;font-size:16px;min-height:46px}
.btn.wide::before{content:"";display:inline-block;width:24px;height:24px;margin:-5px 8px -6px 0;background:url(img/rv_silver.webp) center/contain no-repeat;vertical-align:middle}
.btn.ghost{background:none;color:var(--delft);border:1px solid var(--rule)}
.btn.ghost:hover{background:var(--delft-soft)}
.btn.small{padding:6px 12px;font-size:14.5px;min-height:36px;font-weight:500}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.eff{font-size:15px;color:var(--ink-2);margin:6px 0 0;line-height:1.45}
.eff b{font-weight:600;color:var(--ink)}
details.help{margin:14px 0 0;font-size:15px;color:var(--ink-2)}
details.help summary{cursor:pointer;color:var(--delft);font-size:14.5px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--delft);font-size:13px;font-weight:600;line-height:1}
details.help[open] summary::before{content:"−"}
details.help[open] summary{margin-bottom:8px}
details.help p{margin:0 0 8px}

.meter{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass);width:0}
.meter.bad i{background:var(--loss)}
canvas.spark{width:100%;height:64px;display:block;margin-top:4px}
canvas.bars{width:100%;height:110px;display:block;margin:2px 0 6px}

table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-sc);font-weight:400;font-size:14px;letter-spacing:.05em;color:var(--ink-2);text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--rule)}
td{padding:5px 6px 5px 0;border-bottom:1px solid var(--rule-2);vertical-align:middle}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.books td.r{white-space:nowrap}
.books tr.tot td{border-top:1px solid var(--rule);font-weight:600}
.books tr.subrow td{font-size:14px;color:var(--ink-2);padding-left:12px}

/* warehouse rows */
.wh{display:flex;flex-direction:column}
.good{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.good:first-child{padding-top:2px}
.good .gico{width:38px;height:38px;grid-row:span 2;object-fit:contain}
.good .gn{font-weight:600;font-size:15.5px;line-height:1.2}
.good .gn small{font-weight:400;color:var(--ink-3);font-size:14px;margin-left:6px}
.good .gs{text-align:right;font-weight:600;white-space:nowrap}
.good .gctl{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.good .gctl output{text-align:right;font-size:15px}
.good .gp{grid-column:2/4;font-size:15px;color:var(--ink-3)}
.good .gp b{color:var(--ink);font-weight:600}
