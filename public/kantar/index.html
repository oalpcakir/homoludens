/* Kantar stylesheet (single source).

   verified against a computed-style snapshot of 17,082 elements in 36 game states (3 screen sizes): 0 differences.
   The !important flags that remain are needed (drag ghost, dragging cursor, pan glow, stall slots).
   Commodity tiles are one component sized by --ts (tile side); art PNG/WebPs are pre-normalised squares. */
:root{
  --bg:#1b130e; --bg2:#271b13; --panel:#2b1e15; --panel2:#33241a; --line:rgba(214,172,92,.28);
  --wood:#4b301e; --wood2:#36231a; --brass:#d2a650; --brass2:#8e6a2a; --brass3:#f1d99a;
  --paper:#f3e9d4; --paper2:#e6d6b5; --ink:#2b1e14; --text:#f1e6d1; --muted:#b9a68c;
  --tq:#3a9a92; --izred:#b5372c;
  --saf:#8c52c4; --ipek:#a3253c; --kahve:#7a4a2b; --bakir:#bb5c2e;
  --good:#8fd0a5; --bad:#f0907e;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#170f0b; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#170f0b; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,
*::before,
*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;background:var(--bg);position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}

:focus-visible{outline:2px solid var(--brass3);outline-offset:2px}

.panel{background:linear-gradient(var(--panel2),var(--panel));border-radius:10px;padding:14px 16px}
.panel h2{color:var(--brass3);margin-bottom:8px;border-bottom:1px solid var(--line)}

.center{display:flex;flex-direction:column}
.stall{background:

   linear-gradient(var(--wood),var(--wood2))}

.post::before{content:"";position:absolute;top:-18px;left:-10px;width:32px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,var(--brass3),var(--brass2))}
.base{position:absolute;left:50%;bottom:6px;border-radius:40px 40px 4px 4px;background:linear-gradient(var(--brass3),var(--brass) 40%,var(--brass2));box-shadow:0 6px 10px rgba(0,0,0,.45)}

.beam::before,
.beam::after{content:"";position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--brass)}

.pan{position:absolute;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}

.sheet{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);border-radius:10px;padding:26px 30px}

.scaleIn{position:absolute;top:0}

body.isDragging,
body.isDragging *{cursor:grabbing!important;user-select:none}
.slot{border:1.5px dashed rgba(210,166,80,.45)}

:root{--brass:#cda666;--brass3:#f2d6a1;--panel:#251a15;--panel2:#30221b;--line:rgba(211,172,109,.21)}
body{font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.42}
h1,
h2,
h3,
.prompt,
.big,
.pr{font-family:"EB Garamond",Georgia,serif}
body::before{background:radial-gradient(ellipse 72% 45% at 47% 17%,rgba(103,65,40,.24),transparent 75%),linear-gradient(125deg,#211712,#170f0d)}
.wrap{padding:18px 25px 40px;align-items:start}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 0 15px}
header.top h1{line-height:1}
header.top p{line-height:1.2}
header.top .sp{flex:1}
header.top .btn{height:36px;padding:6px 12px;white-space:nowrap}
.btn{color:#efd8ac;font-size:13px;font-weight:600;transition:background .17s,border-color .17s,transform .17s}
.btn:hover:not(:disabled){background:rgba(211,172,109,.13);border-color:rgba(215,177,106,.75)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:#cda666;color:#21150e;border-color:#e9c988;border-radius:10px;box-shadow:0 3px 9px rgba(0,0,0,.20)}
#sndBtn,
#pvBtn{border-radius:999px}
.center{grid-column:1;grid-row:2 / span 2;gap:12px}
.right.panel{grid-column:2;grid-row:2;overflow:hidden}
.side.panel{grid-column:2;grid-row:3;overflow:hidden}
.panel h2{line-height:1.06;letter-spacing:.005em}
.panel h3{font-size:13px}
.right.panel{border-left:1px solid var(--line);padding:16px}
.right.panel h2:before{content:"";margin:0}
.big{font-size:31px}
.log{max-height:180px}
#oppStall,
#youStall{border:1px solid rgba(218,180,120,.20)}
.stall .hd{margin-bottom:7px;gap:10px;flex-wrap:wrap}
.stall .hd h2{font-size:23px}
.stall .hd .meta{font-size:12px;color:#bba68c}
.cols{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.col .ct{font-size:12px}
.col .ct b{font:600 17px/1 "EB Garamond",serif}
.col .st{font-size:10px;padding:1px 5px}
.counter{border-radius:12px;overflow:hidden}
.counter::after{display:none}
.prompt{font-size:26px;line-height:1.1}
.note{font-size:14px;color:#cfc0ab}
.mlabel{font:600 17px/1.2 "EB Garamond",serif;margin-top:12px}
.market{box-shadow:none}
.market .slot{min-width:0}
.scaleIn::before{background:none}
.post{opacity:1;background:linear-gradient(90deg,#66451e,#d4a65a 30%,#ebc782 45%,#946023 80%,#53351e)}
.post::before{background:radial-gradient(circle at 30% 25%,#f3d38c,#aa762d 70%)}
.base{opacity:1;background:linear-gradient(#d6aa61,#8a622c 55%,#5c3c20)}
.beam{opacity:1;height:10px;border:1px solid rgba(92,52,18,.48);background:linear-gradient(#f0ca7d,#bb8a3e 55%,#715025);box-shadow:0 4px 8px #0005}
.strings path{stroke:#d6ae6e;stroke-width:1.8}
.dish{border:2px solid #8c602d}
.pan .tag{font-size:14px;bottom:-55px}
.actions{margin-top:12px}

/* ---- Settings in the start sheet: rival portraits, rule cards, switches ---- */

/* ===== Layout pass (2026-10-23): the decision on one desktop screen =====

.rv-lost{font-size:13.5px;color:#7a6248}
.rv-ic{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 11px/1 "Source Sans 3",system-ui,sans-serif;color:#fff;font-style:normal;letter-spacing:-.04em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.25)}
.c-best{--rc:#1f7f72}.c-good{--rc:#6c8a33}.c-inacc{--rc:#c08d12}.c-mistake{--rc:#c8641f}.c-blunder{--rc:#a3252c}.c-star{--rc:#8e6a2a}
.rv-ic{background:var(--rc,#8e6a2a)}
.rv-riv{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:8px 12px;border-radius:10px;border:1px dashed rgba(163,37,44,.45);background:rgba(163,37,44,.05);text-align:left;font:inherit;color:#3a210f;cursor:pointer}
.rv-riv:hover{background:rgba(163,37,44,.09)}
.rv-riv .rivface{display:block;flex:none;width:40px;height:40px;margin:0;border-radius:50%;box-shadow:0 0 0 2px #cda666}
.rv-riv b{display:block;font:600 15.5px/1.25 "EB Garamond",Georgia,serif;color:#8a2a24}
.rv-riv small{display:block;font-size:13px;color:#6e5a44;line-height:1.35}
.rv-line{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 12px}
.rv-rd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 8px;border-radius:10px;border:1.5px solid rgba(168,132,62,.35);background:rgba(255,250,238,.5);cursor:pointer;font:inherit;color:#6b3412;min-height:44px}
.rv-rd:hover{border-color:#a8843e;background:rgba(255,250,238,.9)}
.rv-rd.on{border-color:#b8862f;background:linear-gradient(#fff6e0,#f3e1b8);box-shadow:0 0 0 2px rgba(210,166,80,.35)}
.rv-rd>span{font:600 12px/1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8a6e50}
.rv-rd .rv-ms{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:20px}
.rv-rd .rv-ms.p2 .rv-ic{opacity:.92;border-radius:5px}
.rv-rd .rv-ms.riv{min-height:14px}
.rv-rd .rv-ms.riv .rv-ic{width:16px;height:16px;font-size:10px}
.rv-det{border-top:1px solid rgba(150,111,61,.28);padding-top:10px}
.rv-det h3{font:600 20px "EB Garamond",Georgia,serif;color:#6b3412;margin:0 0 8px}
.rv-dec{margin:0 0 14px;padding:10px 12px 12px;border-radius:12px;background:rgba(255,250,238,.6);border:1px solid rgba(168,132,62,.3)}
.rv-dec.riv{border-style:dashed;border-color:rgba(163,37,44,.4);background:rgba(163,37,44,.04)}
.rv-dh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
.rv-dh .rv-role{font:600 16px "EB Garamond",Georgia,serif;color:#3a210f}
.rv-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;font-weight:700;font-size:14px;color:var(--rc);background:#fffaf0;box-shadow:inset 0 0 0 1.5px var(--rc)}
.rv-dh .rv-pts{font-size:14px;color:#7a6248}
.rv-sealtag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#6b3412;padding:1px 8px 1px 2px;border-radius:999px;background:rgba(210,166,80,.2)}
.rv-sealtag i{display:inline-block;width:18px;height:18px;background:center/contain no-repeat}
.rv-sealtag.uc i{background-image:var(--ka-seal-uc,none)}.rv-sealtag.kes i{background-image:var(--ka-seal-kes,none)}
.rv-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rv-cmp.one{grid-template-columns:minmax(0,1fr)}
.rv-col{min-width:0;padding:8px 8px 10px;border-radius:10px;background:radial-gradient(ellipse at 50% 0%,#3a281b,#24170f);box-shadow:inset 0 0 0 1px rgba(210,166,80,.3)}
.rv-col>h4{margin:0 0 6px;font:600 12px/1.2 "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#d9c39a;text-align:center}
.rv-col.best>h4{color:#8fd0c4}
.rv-col.played.c-mistake>h4,.rv-col.played.c-blunder>h4{color:#f0a48f}
.rv-pans{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:nowrap}
.rv-pan{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center}
.rv-pan .rv-goods{display:flex;justify-content:center;align-items:flex-end;min-height:46px;padding:0 6px 3px}
.rv-pan .rv-goods .card.tile{--ts:42px}
.rv-pan .rv-goods .card.tile+.card.tile{margin-left:-10px}
.rv-pan .rv-goods .card.tile{flex:none}
.rv-pan .rv-dish{width:100%;min-width:62px;height:13px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#f1d99a,#d2a650 45%,#8e6a2a);box-shadow:0 3px 5px rgba(0,0,0,.45)}
.rv-pan .rv-empty{font-size:12px;color:#b9a68c;font-style:italic;padding-bottom:6px}
.rv-pan .rv-pl{margin-top:5px;min-height:18px;font-size:11.5px;line-height:1.2;color:#b9a68c;text-align:center;white-space:nowrap}
.rv-pan.took .rv-dish{box-shadow:0 0 0 2px #8fd0a5,0 0 10px rgba(143,208,165,.7),0 3px 5px rgba(0,0,0,.45)}
.rv-pan.took .rv-pl{color:#bfeccc;font-weight:700}
.rv-pan.burns{opacity:.6}
.rv-pan.burns .rv-pl{color:#f0a48f}
.rv-goods .card.rv-cutc{opacity:.45;filter:grayscale(.6)}
.rv-goods .card.rv-cutc::after{content:"";position:absolute;inset:0;background:var(--ka-burn,none) center/70% no-repeat}
.rv-pan.burns .rv-goods{filter:grayscale(.5)}
.rv-seals{text-align:center;margin-top:7px}
.rv-col .rv-sealtag{color:#f1d99a;background:rgba(210,166,80,.16)}
.rv-same{margin:8px 0 0;font-size:14px;color:#1f7f72;font-weight:600}
.rv-why{margin:10px 0 0;font-size:14.5px;line-height:1.5;color:#3a210f}
.rv-why b{color:#6b3412}
.rv-why ul{margin:4px 0 0;padding-left:18px;color:#5a4632;font-size:14px}
.rv-why .commodity-inline,.rv-riv .commodity-inline{white-space:nowrap}
.rv-err{color:#a3252c}
@media(max-width:560px){
  .rv-sheet{padding:20px 14px}
  .rv-line{gap:4px}
  .rv-rd{padding:6px 0 7px}
  .rv-rd>span{font-size:11px;letter-spacing:.02em}
  .rv-cmp{gap:6px}
  .rv-col{padding:7px 3px 8px}
  .rv-pan .rv-goods{padding:0 3px 2px;min-height:38px}
  .rv-pan .rv-goods .card.tile{--ts:34px}
  .rv-pan .rv-goods .card.tile+.card.tile{margin-left:-9px}
  .rv-pan .rv-dish{min-width:44px;height:10px}
  .rv-pans{gap:3px}
  .rv-pan .rv-pl{font-size:10.5px;white-space:normal;max-width:72px}
  .rv-open{padding:9px 10px;gap:10px}
}
/* settings: the third rival choice, two players on one screen, spans the row; the names under it */
.seg.pick button.pnp-opt{grid-column:1 / -1}
.rp-face.pnp{background:radial-gradient(circle at 50% 35%,#7b4d2c,#4a2c18);color:#f1d99a}
.rp-face.pnp svg{width:34px;height:34px}
.pnp-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pnp-names[hidden],.ol[hidden]{display:none}
.pnp-names label{display:flex;align-items:center;gap:8px;min-width:0}
.pnp-names label>i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font:600 14px/1 Marcellus,Georgia,serif;font-style:normal;color:#3a210f;background:linear-gradient(#f1d99a,#d2a650);box-shadow:0 0 0 1px #8e6a2a}
.pnp-names input{min-width:0;width:100%;font:16px "Source Sans 3",system-ui,sans-serif;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(168,132,62,.55);background:#fffaf0;color:#3a210f}
.pnp-names input:focus{outline:2px solid #b8862f;outline-offset:1px}
/* stalls: the seat number in place of the rival's portrait */
.seatno{display:inline-grid;place-items:center;width:28px;height:28px;margin:-4px 8px -6px 0;vertical-align:middle;border-radius:50%;font:600 15px/1 Marcellus,Georgia,serif;font-style:normal;color:#2b1e14;background:linear-gradient(#f1d99a,#d2a650);box-shadow:0 0 0 2px rgba(205,166,102,.45),0 2px 5px rgba(0,0,0,.4)}
.prompt .pn{color:#f6e3b4;font-weight:700}
/* the hand-over cover: nothing of the board shows through */
.pass{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px 16px;cursor:pointer;color:var(--text);text-align:center;
  background:radial-gradient(ellipse 80% 65% at 50% 42%,rgba(40,26,16,.9),rgba(14,9,7,.97)),var(--ka-bg-tall,none) center/cover no-repeat,#140d09}
.pass.hide{display:none}
.pass-in{max-width:440px;width:100%;display:flex;flex-direction:column;align-items:center}
.pass-seal{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;margin-bottom:18px;font:400 44px/1 Marcellus,Georgia,serif;font-style:normal;color:#2b1e14;
  background:radial-gradient(circle at 38% 30%,#fbe9b8,#d2a650 55%,#8e6a2a);box-shadow:0 0 0 3px rgba(241,217,154,.35),0 0 0 9px rgba(210,166,80,.12),0 12px 30px rgba(0,0,0,.6)}
.pass-k{margin:0;font:600 13px/1.3 "Source Sans 3",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pass h2{margin:6px 0 10px;font:400 clamp(34px,9vw,54px)/1.08 Marcellus,Georgia,serif;color:var(--brass3);overflow-wrap:anywhere;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.pass-role{margin:0 0 24px;font-size:18px;color:#f1e6d1}
.pass-role b{color:var(--brass3)}
.pass .btn.primary{min-height:48px;padding:10px 26px;font-size:17px;border-radius:10px;color:var(--ink)}
.pass-hint{margin:16px 0 0;font-size:14px;color:var(--muted);max-width:34ch}
@media(prefers-reduced-motion:no-preference){.pass:not(.hide) .pass-in{animation:passIn .45s cubic-bezier(.2,.8,.2,1)}@keyframes passIn{from{opacity:0;transform:translateY(14px) scale(.97)}}}
</style>
</head>
<body>
<div class="frieze" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a class="hl-back" href="/">Homo Ludens</a>
    <i class="kemblem" aria-hidden="true"></i><h1>Kantar</h1><span class="modeTag" id="modeTag"></span>
    <p data-i18n="tagline"></p>
    <span class="sp"></span>
    <div class="tgroup" role="group" data-i18n-aria="tgroupAria">
    <button class="btn icon tog" id="teachBtn"></button>
    <button class="btn icon tog" id="pvBtn"></button>
    <button class="btn icon tog" id="sndBtn"></button>
    </div>
    <label class="language-switch" for="languageSelect"><span id="langLabel" data-i18n="language"></span><select id="languageSelect" data-i18n-aria="langAria"><option value="en">EN</option><option value="tr">TR</option></select></label>
    <span class="hsep" aria-hidden="true"></span>
    <button class="btn tb" id="statsBtn" data-i18n="stats"></button>
    <button class="btn tb" id="rulesBtn" data-i18n="rules"></button>
    <button class="btn primary" id="newBtn" data-i18n="newGame"></button>
  </header>

  <aside class="side panel" data-i18n-aria="market">
    <h2 data-i18n="market"></h2>
    <!-- symbol first: each block is an icon | its cards; the icon opens the explanation (hover, focus or tap) -->
    <div class="mk-row mk-caravan">
      <button class="mk-ic caravan" type="button" data-tip="tip-caravan" aria-describedby="tip-caravan" aria-expanded="false" data-i18n-aria="caravan"><i class="mk-i" aria-hidden="true">i</i></button>
      <div class="row" id="caravan"></div>
      <div class="mk-tip" role="tooltip" id="tip-caravan"><b data-i18n="caravan"></b> <span data-i18n="caravanHelp"></span> <span id="deckInfo"></span></div>
    </div>
    <div class="mk-row mk-removed">
      <button class="mk-ic removed" type="button" data-tip="tip-removed" aria-describedby="tip-removed" aria-expanded="false" data-i18n-aria="removed"><svg viewBox="0 0 60 58" aria-hidden="true"><defs><linearGradient id="mkW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5530"/><stop offset="1" stop-color="#4a2a16"/></linearGradient><linearGradient id="mkB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d99a"/><stop offset=".55" stop-color="#d2a650"/><stop offset="1" stop-color="#8e6a2a"/></linearGradient></defs><path d="M8 25c0-9 9.8-15 22-15s22 6 22 15z" fill="url(#mkW)" stroke="#2b1a0e" stroke-width="1.2"/><rect x="6" y="25" width="48" height="25" rx="2.5" fill="url(#mkW)" stroke="#2b1a0e" stroke-width="1.2"/><path d="M6 25h48v4H6z" fill="url(#mkB)"/><path d="M15 11.6V50M45 11.6V50" stroke="url(#mkB)" stroke-width="4"/><rect x="25" y="22" width="10" height="12" rx="2" fill="url(#mkB)" stroke="#5a3a18" stroke-width=".8"/><circle cx="30" cy="27" r="1.6" fill="#3a2410"/><path d="M30 28v3" stroke="#3a2410" stroke-width="1.4"/></svg><i class="mk-i" aria-hidden="true">i</i></button>
      <div class="row" id="removed"></div>
      <div class="mk-tip" role="tooltip" id="tip-removed"><b data-i18n="removed"></b> <span data-i18n="removedHelp"></span></div>
    </div>
    <div class="mk-row mk-burned">
      <button class="mk-ic burned" type="button" data-tip="tip-burned" aria-describedby="tip-burned" aria-expanded="false" data-i18n-aria="burned"><i class="mk-i" aria-hidden="true">i</i></button>
      <div class="row" id="burned"></div>
      <div class="mk-tip" role="tooltip" id="tip-burned"><b data-i18n="burned"></b> <span data-i18n="burnedHelp"></span></div>
    </div>
    <div class="mk-row mk-goods">
      <button class="mk-ic goods" type="button" data-tip="tip-goods" aria-describedby="tip-goods" aria-expanded="false" data-i18n-aria="goods"><svg viewBox="0 0 60 58" aria-hidden="true"><defs><linearGradient id="mkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a8"/><stop offset=".5" stop-color="#d2a650"/><stop offset="1" stop-color="#7d5a22"/></linearGradient></defs><path d="M6 50h48" stroke="#5a3a18" stroke-width="2" stroke-linecap="round"/><path d="M9 49l3-17h14l3 17z" fill="url(#mkG)" stroke="#5a3a18" stroke-width="1"/><path d="M14 32c0-5 10-5 10 0" fill="none" stroke="#8e6a2a" stroke-width="2.4"/><path d="M31 49l2.4-12h10.2L46 49z" fill="url(#mkG)" stroke="#5a3a18" stroke-width="1"/><path d="M35 37c0-3.6 7-3.6 7 0" fill="none" stroke="#8e6a2a" stroke-width="2"/><path d="M47 49l1.6-7.5h5.8L56 49z" fill="url(#mkG)" stroke="#5a3a18" stroke-width=".9"/></svg><i class="mk-i" aria-hidden="true">i</i></button>
      <div id="goodsKey"></div>
      <div class="mk-tip" role="tooltip" id="tip-goods"><b data-i18n="goods"></b> <span data-i18n="goodsHelp"></span></div>
    </div>
  </aside>

  <main class="center">
    <section class="stall" id="oppStall"></section>
    <section class="counter" id="counter">
      <div class="banner" id="banner"></div>
      <div class="prompt" id="prompt"></div>
      <div class="advice">
      <div class="teacher" id="teacher" role="status" aria-live="polite"></div>
      <div class="coach" id="coach" role="status" aria-live="polite"></div><div id="insight" role="status" aria-live="polite"></div>

      </div>

      <div class="market" id="market"></div>
      <div class="scale" id="scale"><div class="scaleIn">
        <div class="post"></div><div class="base"></div>
        <div class="beam" id="beam"></div>
        <div class="pan L" id="pan0" data-pan="0" role="group"><svg class="strings" viewBox="0 0 200 82"><path d="M100 2 L8 80 M100 2 L192 80" stroke="#d2a650" stroke-width="1.5" fill="none"/></svg><div class="dish"></div><div class="tag"></div></div>
        <div class="pan R" id="pan1" data-pan="1" role="group"><svg class="strings" viewBox="0 0 200 82"><path d="M100 2 L8 80 M100 2 L192 80" stroke="#d2a650" stroke-width="1.5" fill="none"/></svg><div class="dish"></div><div class="tag"></div></div>

  <aside class="right panel" data-i18n-aria="ledger">

    <p class="muted" style="margin:2px 0 0" data-i18n="ifEnded"></p>
    <h3 data-i18n="log"></h3>
    <div class="log" id="log" tabindex="0" role="log" aria-live="off" data-i18n-aria="log"></div>
  </aside>
</div>

<div class="modal" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
  <div class="sheet">
    <button class="xclose" id="rulesX" type="button" data-i18n-aria="sClose" hidden>×</button>
    <h2 id="rulesTitle" data-i18n="rulesTitle"></h2>
    <!-- The start sheet. First visit: what Kantar is, in three steps, then "Learn with the teacher".
         Returning (saved settings): "Play" with those settings. A match in progress: "Continue".
         The full rules, history notes and every option stay one click away in #setupDetails. -->
    <section id="welcome" aria-label="Kantar introduction">
      <p class="welcome-lead" data-i18n="welcomeLead"></p>
      <ol class="welcome-steps" id="welcomeSteps">
        <li data-i18n="welcomePick"></li>
        <li data-i18n="welcomeSplit"></li>
        <li data-i18n="welcomeScore"></li>
      </ol>
      <div class="start-main">
        <button class="btn primary" id="learnBtn" data-i18n="learnPlay"></button>
        <button class="btn primary" id="quickResume" data-i18n="resumeMatch" hidden></button>
        <button class="btn primary" id="quickPlay" data-i18n="playSaved" hidden></button>
        <p class="muted welcome-note" id="startNote"></p>
      </div>
      <div class="start-alt">
        <button class="btn" id="noTeachBtn" data-i18n="noTeach"></button>
        <button class="btn" id="learnAgain" data-i18n="learnPlay" hidden></button>
      </div>
    </section>
    <details id="setupDetails"><summary data-i18n="moreOptions"></summary>
    <div class="optgrid">
      <span class="ol" data-i18n="optRival"></span><div class="seg pick" data-set="diff">
        <button data-v="cirak"><i class="rp-face cirak" aria-hidden="true"></i><span class="rp-t"><b data-i18n="apprentice"></b><small data-i18n="cirakSub"></small></span></button>
        <button data-v="usta"><i class="rp-face usta" aria-hidden="true"></i><span class="rp-t"><b data-i18n="master"></b><small data-i18n="ustaSub"></small></span></button>
        <button data-v="pnp" class="pnp-opt"><i class="rp-face pnp" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="10" r="4.2" fill="currentColor"/><path d="M3.5 25c.6-5.2 3.6-8 7.5-8s6.9 2.8 7.5 8z" fill="currentColor"/><circle cx="22" cy="11.5" r="3.6" fill="currentColor" opacity=".7"/><path d="M16.8 18.6c1.4-1.2 3.1-1.8 5.2-1.8 3.4 0 6 2.5 6.5 7.2h-8.7" fill="currentColor" opacity=".7"/></svg></i><span class="rp-t"><b data-i18n="pnp"></b><small data-i18n="pnpSub"></small></span></button>
      </div>
      <span class="ol pnpOnly" data-i18n="optNames" hidden></span><div class="pnp-names pnpOnly" hidden>
        <label><i aria-hidden="true">1</i><input id="pName0" maxlength="14" autocomplete="off" spellcheck="false" data-i18n-aria="pName1"></label>
        <label><i aria-hidden="true">2</i><input id="pName1" maxlength="14" autocomplete="off" spellcheck="false" data-i18n-aria="pName2"></label>
      </div>
      <span class="ol" data-i18n="optRules"></span><div class="seg pick" data-set="mode">
        <button data-v="classic"><i class="rp-ic emblem" aria-hidden="true"></i><span class="rp-t"><b data-i18n="modeClassic"></b><small data-i18n="classicSub"></small></span></button>
        <button data-v="narh"><i class="rp-ic narh" aria-hidden="true"></i><span class="rp-t"><b data-i18n="modeNarh"></b><small data-i18n="narhSub"></small></span></button>
      </div>
      <span class="ol" data-i18n="optZoom"></span><div class="seg zoomseg" data-set="zoom"><button data-v="fit" data-i18n="zoomFit"></button><button data-v="0.8">80%</button><button data-v="0.9">90%</button><button data-v="1">100%</button></div>
      <span class="ol" data-i18n="optSettings"></span><div class="checks sw">

<script>
/* ================= engine: rules, AI and teacher search =================
   Everything from here to the sound section is pure (no DOM): the page also runs this exact text in a Web Worker
   (built from a Blob, see SEARCH below), so the search never blocks the page on a slow phone. */
const SU=['S','I','K','B'];
const SD={S:{ad:'Safran',p:5,n:4},I:{ad:'İpek',p:4,n:5},K:{ad:'Kahve',p:3,n:7},B:{ad:'Bakır',p:2,n:8}};
const PMIN=1,PMAX=7;
const priceDiff=(a,b)=>SU.filter(c=>a[c]!==b[c]).map(c=>[c,a[c],b[c]]);
const Z=()=>({S:0,I:0,K:0,B:0});
const tot=o=>o.S+o.I+o.K+o.B;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= rules engine ================= */
function newGame(first,mode,tut){
  const d=[];SU.forEach(s=>{for(let i=0;i<SD[s].n;i++)d.push(s)});shuffle(d);
  return dealFrom(d,first,mode,tut);
}
/* the opening position of a deal (the review replays a match from it) */
function dealFrom(d,first,mode,tut){
  return {all:d,hidden:d.slice(0,3),open:d.slice(3,6),market:d.slice(6,11),deck:d.slice(11),turn:0,splitter:first,first,mode,tut,
    tab:[Z(),Z()],burned:Z(),price:{S:5,I:4,K:3,B:2},seals:[{uc:1,kes:1},{uc:1,kes:1}],phase:'split',piles:null};
}
function cl(s){return {all:s.all,hidden:s.hidden,open:s.open,market:s.market,deck:s.deck,turn:s.turn,splitter:s.splitter,first:s.first,mode:s.mode,tut:s.tut,
  tab:[{...s.tab[0]},{...s.tab[1]}],burned:{...s.burned},price:{...s.price},seals:[{...s.seals[0]},{...s.seals[1]}],
  phase:s.phase,piles:s.piles?s.piles.map(p=>p.slice()):null}}
const sealsOpen=s=>!(s.tut&&s.turn===0);
function give(s,w,p){p.forEach(c=>s.tab[w][c]++)}
function burnCard(s,c){s.burned[c]++;if(s.mode==='narh')s.price[c]=Math.min(PMAX,s.price[c]+1)}
function endTurn(s){
  s.piles=null;const need=5-s.market.length;
  s.market=s.market.concat(s.deck.slice(0,need));s.deck=s.deck.slice(need);
  s.turn++;s.splitter^=1;s.phase=s.turn>=6?'end':'split';
}
function doSplit(s,idxs,piles){
  const n=cl(s);n.market=s.market.filter((_,i)=>!idxs.includes(i));
  n.piles=piles.map(p=>p.slice());if(piles.length===3)n.seals[s.splitter].uc=0;
  if(s.mode==='narh'){const cnt=Z();piles.flat().forEach(c=>cnt[c]++);SU.forEach(c=>{if(cnt[c]>=2)n.price[c]=Math.max(PMIN,n.price[c]-1)})}
  n.phase='choose';return n;
}
function doCut(s,pi,ci){const n=cl(s);const c=n.piles[pi].splice(ci,1)[0];burnCard(n,c);n.seals[1-s.splitter].kes=0;return n}
function doChoose(s,cut,pick){
  let n=cut?doCut(s,cut[0],cut[1]):cl(s);const ch=1-s.splitter;
  give(n,ch,n.piles[pick]);const rest=n.piles.filter((_,i)=>i!==pick);
  if(rest.length===1){give(n,n.splitter,rest[0]);endTurn(n)}else{n.piles=rest;n.phase='rest'}
  return n;
}
function doRest(s,pick){const n=cl(s);give(n,n.splitter,n.piles[pick]);n.piles[1-pick].forEach(c=>burnCard(n,c));endTurn(n);return n}
function combos3(len){const out=[];for(let a=0;a<len;a++)for(let b=a+1;b<len;b++)for(let c=b+1;c<len;c++)out.push([a,b,c]);return out}
function splitOpts(s){
  const m=s.market,out=[],seenSub=new Set();
  for(const idxs of combos3(m.length)){
    const t=idxs.map(i=>m[i]),sk=t.slice().sort().join('');if(seenSub.has(sk))continue;seenSub.add(sk);
    const seen=new Set();
    for(let mk=0;mk<4;mk++){const A=[t[0]],B=[];[1,2].forEach((i,k)=>((mk>>k)&1?B:A).push(t[i]));
      const key=[A.slice().sort().join(''),B.slice().sort().join('')].sort().join('|');
      if(!seen.has(key)){seen.add(key);out.push({idxs,piles:[A,B]})}}
    if(s.seals[s.splitter].uc&&sealsOpen(s))out.push({idxs,piles:[[t[0]],[t[1]],[t[2]]]});
  }
  return out;
}
function chooseOpts(s){
  const out=[],ch=1-s.splitter;
  s.piles.forEach((_,pk)=>out.push({cut:null,pick:pk}));
  if(s.seals[ch].kes&&sealsOpen(s))s.piles.forEach((p,pi)=>{const seen=new Set();p.forEach((c,ci)=>{if(seen.has(c))return;seen.add(c);
    s.piles.forEach((_,pk)=>out.push({cut:[pi,ci],pick:pk}))})});
  return out;
}
function children(s){
  if(s.phase==='split')return splitOpts(s).map(o=>[o,doSplit(s,o.idxs,o.piles)]);
  if(s.phase==='choose')return chooseOpts(s).map(o=>[o,doChoose(s,o.cut,o.pick)]);
  return [0,1].map(i=>[{pick:i},doRest(s,i)]);
}
function score(s){
  const r={p:[0,0],suit:{}};
  SU.forEach(c=>{const a=s.tab[0][c],b=s.tab[1][c],w=a>b?0:b>a?1:-1;r.suit[c]=w;if(w>=0)r.p[w]+=s.price[c]});
  const ta=tot(s.tab[0]),tb=tot(s.tab[1]);r.haf=ta<tb?0:tb<ta?1:-1;if(r.haf>=0)r.p[r.haf]+=3;r.tot=[ta,tb];
  r.kw=1-s.first;r.kefil=kefilOf(s);r.p[r.kw]+=r.kefil;
  r.w=r.p[0]>r.p[1]?0:r.p[1]>r.p[0]?1:(s.mode==='classic'?r.kw:(r.suit.S>=0?r.suit.S:-1));
  return r;
}
function kefilOf(s){return s.mode==='narh'?2:1}
function unseen(s,c){return SD[c].n-s.tab[0][c]-s.tab[1][c]-s.burned[c]-s.open.filter(x=>x===c).length}

/* ================= AI ================= */
function heur(s){
  if(s.phase==='end'){const r=score(s);return r.p[1]-r.p[0]+(r.w===1?.1:r.w===0?-.1:0)}
  const left=3*(6-s.turn),pool=left+3;let v=0;
  SU.forEach(c=>{const k=unseen(s,c)*left/pool,d=s.tab[1][c]-s.tab[0][c];v+=s.price[c]*Math.tanh(d/(0.45+0.55*Math.sqrt(k)))});
  const D=tot(s.tab[1])-tot(s.tab[0]);v+=3*Math.tanh(-D/(0.6+0.35*Math.sqrt(left)));
  const sv=x=>x.uc+x.kes;v+=0.6*(sv(s.seals[1])-sv(s.seals[0]));
  v+=(s.first===0?1:-1)*kefilOf(s);
  return v;
}
function search(s,limit,a,b){
  if(s.phase==='end'||s.turn>limit)return heur(s);
  const owner=s.phase==='choose'?1-s.splitter:s.splitter,kids=children(s);
  if(owner===1){let best=-1e9;for(const k of kids){const v=search(k[1],limit,a,b);if(v>best)best=v;if(best>a)a=best;if(a>=b)break}return best}
  let best=1e9;for(const k of kids){const v=search(k[1],limit,a,b);if(v<best)best=v;if(best<b)b=best;if(a>=b)break}return best;
}
/* seeded noise: the caller passes a seed, so the worker and the page pick the same move for the same state */
function rng(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function aiAct(s,diff,seed){
  // Fairness: the search only reaches the next refill, which is the visible caravan; the evaluation uses
  // counts of unseen goods, never their order (verified by the reshuffle test). Master looks two rounds ahead, Apprentice one.
  if(!diff)diff=typeof set!=='undefined'?set.diff:'usta';
  const rnd=seed===undefined?Math.random:rng(seed);
  const usta=diff==='usta',limit=usta?s.turn+1:s.turn,kids=children(s);
  let best=-1e9,bi=0;
  kids.forEach((k,i)=>{const v=search(k[1],limit,-1e9,1e9)+rnd()*(usta?.36:1.2);if(v>best){best=v;bi=i}});
  return kids[bi];
}

/* ================= teacher analysis (pure) =================
   Value of every legal move from the player's seat and the rival's likely reply, with the reasons as data:
   [key, ...values] (goods as codes, piles as arrays, numbers unrounded). The page turns them into text (reasonText). */
function mirrorS(s){const n=cl(s);n.tab=[{...s.tab[1]},{...s.tab[0]}];n.seals=[{...s.seals[1]},{...s.seals[0]}];n.splitter=1-s.splitter;n.first=1-s.first;return n}
function analyseCore(s){
  const m=mirrorS(s),limit=Math.min(5,s.turn+1);
  const moves=children(m).map(([act,n])=>({act,v:search(n,limit,-1e9,1e9),n}));
  moves.sort((a,b)=>b.v-a.v);const best=moves[0];
  const out={phase:s.phase},R=[],now=score(s);
  /* resolve the recommended move on the real state, including the rival's best reply to a split */
  let after,real=s;
  if(s.phase==='split'){
    real=doSplit(s,best.act.idxs,best.act.piles);
    const replies=children(best.n).map(([a,n])=>({a,v:search(n,limit,-1e9,1e9)})).filter(r=>!r.a.cut);
    replies.sort((x,y)=>x.v-y.v);const rp=replies[0];out.rivalPick=rp.a.pick;
    const vals=replies.map(r=>r.v),spread=Math.max(...vals)-Math.min(...vals);
    after=doChoose(real,null,rp.a.pick);
    if(after.phase==='rest'){const a0=doRest(after,0),a1=doRest(after,1),sa=score(a0),sb=score(a1);after=(sa.p[0]-sa.p[1]>=sb.p[0]-sb.p[1])?a0:a1}
    const piles=best.act.piles;
    if(piles.length===2&&spread<1.2)R.push(['rBalanced',spread,piles[rp.a.pick]]);
    else R.push(['rRivalTakes',piles[rp.a.pick],piles.filter((_,i)=>i!==rp.a.pick).flat()]);
    const left=s.market.filter((_,i)=>!best.act.idxs.includes(i));
    priceDiff(s.price,real.price).forEach(([c])=>{if(now.suit[c]===1)R.push(['rNarhRival',c]);else if(now.suit[c]===0)R.push(['rNarhMine',c])});
    const valuable=left.filter(c=>s.price[c]>=4);if(valuable.length)R.push(['rLeft',[...new Set(valuable)]]);
    sealReason(R,moves,best,'uc',x=>x.act.piles.length===3,s);
  }else if(s.phase==='choose'){
    const cut=best.act.cut;
    if(cut){real=doCut(s,cut[0],cut[1]);narhFromBurn(R,s,real)}
    after=doChoose(real,null,best.act.pick);
    if(after.phase==='rest'){const a0=doRest(after,0),a1=doRest(after,1),sa=score(a0),sb=score(a1);after=(sa.p[1]-sa.p[0]>=sb.p[1]-sb.p[0])?a0:a1}
    const alt=moves.find(x=>!x.act.cut&&x.act.pick!==best.act.pick);if(!cut&&alt&&best.v-alt.v>.25)R.unshift(['rBetter',best.v-alt.v]);
    sealReason(R,moves,best,'kes',x=>!!x.act.cut,s);
  }else{
    after=doRest(s,best.act.pick);narhFromBurn(R,s,after);
    const alt=moves.find(x=>x.act.pick!==best.act.pick);if(alt&&best.v-alt.v>.25)R.unshift(['rBetter',best.v-alt.v]);
  }
  /* majorities and light load after the move */
  const sa=score(after);
  const W=[],S=[],RG=[];
  SU.forEach(c=>{const lead=after.tab[0][c]-after.tab[1][c],left=unseen(after,c);
    if(sa.suit[c]===0&&now.suit[c]!==0)(lead>left?S:W).push(c);
    else if(sa.suit[c]===0&&now.suit[c]===0&&lead>left&&s.tab[0][c]-s.tab[1][c]<=unseen(s,c))S.push(c);
    else if(sa.suit[c]===1&&now.suit[c]!==1)RG.push(c);});
  if(W.length)R.push(['rWin',W]);if(S.length)R.push(['rSecure',S]);if(RG.length)R.push(['rRivalGains',RG]);
  const ta=tot(after.tab[0]),tb=tot(after.tab[1]);
  if(ta<tb)R.push(['rLightYes',ta,tb]);else if(ta>tb&&tot(s.tab[0])<=tot(s.tab[1]))R.push(['rLightNo',ta,tb]);
  out.reasons=R.slice(0,5);
  out.moves=moves.map(x=>({act:x.act,v:x.v}));out.best=out.moves[0];
  return out;
}
function narhFromBurn(R,before,after){priceDiff(before.price,after.price).forEach(([c,a,b])=>{if(b>a)R.push(['rNarhUp',c])})}
function sealReason(R,moves,best,key,uses,s){
  if(!s.seals[0][key]||!sealsOpen(s))return;
  const without=moves.find(x=>!uses(x));if(!without)return;
  if(uses(best))R.unshift(['rSealUse',key,best.v-without.v]);
  else{const w=moves.find(uses);if(w&&best.v-w.v<.4&&s.turn<5)R.push(['rSealKeep',key])}
}
/* ================= match review (pure) =================
   Every decision of a match is kept as {w: seat, act}; replayHist() rebuilds the position before each one from the
   deal. judgeMove() runs the teacher's analysis (the Master search, public information only) from the mover's seat on
   the position before the move and classifies the move by the points it gave away against the best move.
   Thresholds, in points of the final score difference (the scale of the search): */
const RV_T={best:.1,good:.6,inacc:1.5,mistake:3};
const RV_CLASSES=['best','good','inacc','mistake','blunder'];
function rvClass(loss){return loss<RV_T.best?'best':loss<RV_T.good?'good':loss<RV_T.inacc?'inacc':loss<RV_T.mistake?'mistake':'blunder'}
/* the same move whatever the stall order: a division is its piles (as goods), a choice is the cut good and the pan */
function actKey(s,a){
  if(s.phase==='split')return a.piles.map(p=>p.slice().sort().join('')).sort().join('|')+'#'+a.piles.length;
  if(s.phase==='choose')return (a.cut?'c'+a.cut[0]+s.piles[a.cut[0]][a.cut[1]]:'-')+'p'+a.pick;
  return 'p'+a.pick;
}
function applyAct(s,a){
  if(s.phase==='split')return doSplit(s,a.idxs,a.piles);
  if(s.phase==='choose')return doChoose(s,a.cut||null,a.pick);
  return doRest(s,a.pick);
}
function replayHist(all,first,mode,tut,hist){
  let s=dealFrom(all.slice(),first,mode,tut);const out=[];
  for(const h of hist){if(s.phase==='end')throw new Error('replay: past the end');
    const own=s.phase==='choose'?1-s.splitter:s.splitter;if(own!==h.w)throw new Error('replay: wrong seat');
    out.push({s,w:h.w,act:h.act});s=applyAct(s,h.act)}
  return {steps:out,end:s};
}
function judgeMove(s,act,seat){
  const a=analyseCore(seat===0?s:mirrorS(s)),k=actKey(s,act),i=a.moves.findIndex(m=>actKey(s,m.act)===k);
  if(i<0)throw new Error('judge: move not found');
  /* gain: how much better the move is than the average of the other legal moves (the rival's "best move" is his largest) */
  const v=a.moves[i].v,loss=Math.max(0,a.best.v-v),others=a.moves.filter((_,j)=>j!==i);
  return {seat,phase:s.phase,act,best:a.best.act,bestV:a.best.v,v,loss,cls:rvClass(loss),reasons:a.reasons,rivalPick:a.rivalPick,
    gain:others.length?v-others.reduce((t,m)=>t+m.v,0)/others.length:0,n:a.moves.length};
}
/* one search job: {type:'ai', s, diff, seed} -> the AI's move; {type:'teach', s} -> the teacher's analysis;
   {type:'judge', s, act, seat} -> one decision of a finished match, classified */
function runJob(m){if(m.type==='ai')return aiAct(m.s,m.diff,m.seed)[0];if(m.type==='teach')return analyseCore(m.s);if(m.type==='judge')return judgeMove(m.s,m.act,m.seat);throw new Error('job '+m.type)}
/* inside the worker (no window): answer jobs */
if(typeof window==='undefined'&&typeof self!=='undefined'&&typeof postMessage==='function')
  self.onmessage=e=>{const m=e.data;let r;try{r={id:m.id,ok:true,res:runJob(m)}}catch(err){r={id:m.id,ok:false,err:String(err&&err.message||err)}}postMessage(r)};

/* ================= sound v2.7 (Web Audio, synthesised, no files) =================
   Modelled sounds instead of beeps: inharmonic struck-metal partials for coins, the brass pans and finger
   cymbals (zil); Karplus–Strong plucked strings (oud-like) in makam Hicaz for the result; noise models for
   parchment, wax and fire. Everything goes through one bus: dry + a short generated "vaulted hall" reverb,
   then a compressor so a shower of coins can never clip. */
const AU={c:null,dry:null,rev:null,bus:null,noise:null,ks:{}};
function buildAudio(c,dest){
  /* bus -> glue compressor -> brick-wall limiter -> gentle tanh soft clip -> out. Overlapping sounds get louder
     but never clip into a crackle. */
  const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
  const lim=c.createDynamicsCompressor();lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.12;
  const sc=c.createWaveShaper(),cv=new Float32Array(2049);for(let i=0;i<2049;i++){const x=i/1024-1;cv[i]=Math.tanh(1.25*x)/Math.tanh(1.25)}sc.curve=cv;sc.oversample='2x';
  const out=c.createGain();out.gain.value=.92;
  const bus=c.createGain();bus.gain.value=.72;bus.connect(comp);comp.connect(lim);lim.connect(sc);sc.connect(out);out.connect(dest);
  const dry=c.createGain();dry.gain.value=1;dry.connect(bus);
  const rev=c.createConvolver();rev.buffer=hallImpulse(c,1.9);const wet=c.createGain();wet.gain.value=.55;rev.connect(wet);wet.connect(bus);
  const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  Object.assign(AU,{c,dry,rev,bus,noise:n,ks:{},live:[],last:{}});
}
function hallImpulse(c,dur){
  const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/c.sampleRate;lp+=(Math.random()*2-1-lp)*(.55-.4*t/dur);d[i]=lp*Math.pow(1-t/dur,2.4)*(t<.012?0:1)}
    [.013,.021,.034,.047].forEach((t,k)=>{const i=Math.floor(t*c.sampleRate)+ch*37;if(i<len)d[i]+=.5/(k+1)})}
  return b;
}
function ac(){
  if(!AU.c){try{const C=window.AudioContext||window.webkitAudioContext,c=new C();buildAudio(c,c.destination)}catch(e){return null}}
  if(AU.c.state==='suspended')AU.c.resume();return AU.c;
}
/* every sound gets a duck stage: the more sounds already ringing, the quieter the new one (1/sqrt) */
function voice(pan=0,rev=.25){const c=AU.c,g=c.createGain(),dk=c.createGain(),p=c.createStereoPanner?c.createStereoPanner():null;
  const now=c.currentTime;AU.live=AU.live.filter(x=>x>now);dk.gain.value=1/Math.sqrt(1+.45*AU.live.length);AU.live.push(now+.45);g.connect(dk);
  if(p){p.pan.value=Math.max(-1,Math.min(1,pan));dk.connect(p);p.connect(AU.dry)}else dk.connect(AU.dry);
  if(rev>0){const s=c.createGain();s.gain.value=rev;dk.connect(s);s.connect(AU.rev)}return g}
function strike(f,t,dur,g,out,{type='sine',att=.002,glide=0}={}){const c=AU.c,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(f*glide,t+dur);v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(v);v.connect(out);o.start(t);o.stop(t+dur+.05)}
function hiss(t,dur,g,out,{type='bandpass',f=1000,q=1,f2=0,att=.002}={}){const c=AU.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),v=c.createGain();
  s.buffer=AU.noise;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+att);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(v);v.connect(out);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
/* metal: a struck object = a few inharmonic modes, higher modes decay faster */
function metal(f,t,g,out,modes,decay){modes.forEach(([r,a,dk])=>strike(f*r*(1+(Math.random()-.5)*.004),t,decay*dk,g*a,out))}
const COIN=[[1,1,1],[1.73,.55,.7],[2.32,.42,.55],[2.92,.26,.42],[3.87,.16,.3]];
const BRASS=[[1,1,1],[2.71,.5,.62],[5.15,.24,.38],[8.4,.1,.22]];
const ZIL=[[1,1,1],[1.58,.7,.85],[2.33,.45,.7],[2.34,.45,.7],[3.11,.25,.5]];
function pluck(freq,dur,bright){const c=AU.c,key=`${freq.toFixed(1)}|${dur}|${bright}`;let b=AU.ks[key];
  if(!b){const sr=c.sampleRate,len=Math.floor(sr*dur),N=Math.max(2,Math.round(sr/freq));b=c.createBuffer(1,len,sr);const d=b.getChannelData(0),buf=new Float32Array(N);
    for(let i=0;i<N;i++)buf[i]=(Math.random()*2-1)*(i<N*.5?1:.6);let p=0;const damp=.5*(.9935+.0045*bright),fadeFrom=Math.floor(len*.55);
    for(let i=0;i<len;i++){const cur=buf[p],nx=buf[(p+1)%N];const v=damp*(cur+nx);buf[p]=v;d[i]=cur*(i<fadeFrom?1:Math.pow(1-(i-fadeFrom)/(len-fadeFrom),2));p=(p+1)%N}
    AU.ks[key]=b}
  return b}
function oud(freq,t,g,out,dur=1.6,bright=.8){const c=AU.c,s=c.createBufferSource(),v=c.createGain(),lp=c.createBiquadFilter();s.buffer=pluck(freq,dur,bright);
  lp.type='lowpass';lp.frequency.value=900+2600*bright;v.gain.value=g;s.connect(lp);lp.connect(v);v.connect(out);s.start(t)}
const HICAZ={D3:146.83,Eb3:155.56,Fs3:185,G3:196,A3:220,D4:293.66,Eb4:311.13,Fs4:369.99,G4:392,A4:440,Bb4:466.16,D5:587.33};
const rnd=(a,b)=>a+Math.random()*(b-a);
const sfx={
  go(fn,key,gap){if(!set.snd)return;const c=ac();if(!c||!AU.dry)return;if(key){const n=c.currentTime;if(n-(AU.last[key]||-9)<gap)return;AU.last[key]=n}
    if(AU.live&&AU.live.filter(x=>x>c.currentTime).length>=12)return;try{fn(c.currentTime+.01)}catch(e){}},
  /* a single silver akçe dropped on the counter */
  coin(d=0,pitch=1,gain=1){this.go(t=>{t+=d;const out=voice(rnd(-.45,.45),.22),f=rnd(2100,2700)*pitch,g=gain*1.6;
    hiss(t,.012,.45*g,out,{type:'highpass',f:4200,q:.7,att:.0008});metal(f,t,.16*g,out,COIN,rnd(.35,.6));
    if(Math.random()<.6){const t2=t+rnd(.05,.11);metal(f*rnd(.97,1.03),t2,.07*g,out,COIN,.25);hiss(t2,.008,.18*g,out,{type:'highpass',f:4600})}})},
  /* coins sliding onto a pile: quick, irregular, settling */
  coins(n){n=Math.max(1,n);let tt=0;for(let i=0;i<n;i++){this.coin(tt,rnd(.92,1.06),.6);tt+=rnd(.045,.11)*(1+i*.04)}
    if(n>2)this.go(t=>{const out=voice(0,.15);hiss(t+tt*.6,.25,.08,out,{type:'bandpass',f:2400,q:1.2})})},
  /* a good set on the scale: parchment/cloth slide + soft thump on wood */
  place(){this.go(t=>{const out=voice(rnd(-.2,.2),.04);out.gain.value=.8;hiss(t,.09,.22,out,{type:'bandpass',f:1300,f2:2800,q:.9,att:.01});
    strike(150,t+.04,.12,.22,out,{glide:.6});hiss(t+.04,.05,.14,out,{type:'lowpass',f:500})},'place',.05)},
  /* the beam moves: a short rattle of the pan chains */
  tick(){this.go(t=>{const out=voice(rnd(-.3,.3),.1);for(let i=0;i<4;i++){const ti=t+i*rnd(.025,.045);hiss(ti,.018,rnd(.12,.22),out,{type:'bandpass',f:rnd(4200,6200),q:9})}},'tick',.09)},
  /* pans offered: the brass pan rings, the beam knocks, the chains settle */
  clank(){this.go(t=>{const out=voice(0,.35);hiss(t,.06,.28,out,{type:'lowpass',f:260});metal(rnd(300,330),t,.13,out,BRASS,2.2);
    for(let i=0;i<7;i++){const ti=t+.03+i*rnd(.03,.06);hiss(ti,.02,rnd(.05,.1),out,{type:'bandpass',f:rnd(3800,6000),q:8})}})},
  /* wax seal pressed: deep thump, wooden knock, a little squash */
  seal(){this.go(t=>{const out=voice(0,.08);out.gain.value=1.4;strike(115,t,.28,.6,out,{glide:.42});hiss(t,.07,.32,out,{type:'bandpass',f:420,q:3.5});
    hiss(t+.015,.16,.14,out,{type:'lowpass',f:900,att:.01})})},
  /* a good burns: whoosh and crackle */
  burn(){this.go(t=>{const out=voice(rnd(-.2,.2),.3);hiss(t,.75,.12,out,{type:'lowpass',f:300,f2:1800,q:.6,att:.12});
    for(let i=0;i<26;i++){const ti=t+Math.pow(Math.random(),1.6)*.85;hiss(ti,rnd(.004,.016),rnd(.05,.28),out,{type:'highpass',f:rnd(1500,4500),q:2,att:.0006})}})},
  /* narh rises / falls: a small brass bell, up a fifth or down a fourth */
  up(){this.go(t=>{const out=voice(.15,.4);out.gain.value=.8;metal(1318,t,.07,out,ZIL,1.2);metal(1975,t+.12,.08,out,ZIL,1.4)})},
  down(){this.go(t=>{const out=voice(-.15,.4);out.gain.value=.8;metal(1480,t,.07,out,ZIL,1.1);metal(1109,t+.13,.07,out,ZIL,1.3)})},
  /* new round: a pair of zil (finger cymbals) */
  turn(){this.go(t=>{const out=voice(0,.5);out.gain.value=.9;metal(2210,t,.045,out,ZIL,2.2);metal(2240,t+.16,.04,out,ZIL,2.4)},'turn',.4)},
  /* result: an oud phrase in makam Hicaz over a coin shower (win) or a falling phrase (loss) */
  win(){this.coins(10);this.go(t=>{const out=voice(0,.45),H=HICAZ;out.gain.value=.8;[[H.D4,0],[H.Fs4,.16],[H.G4,.32],[H.A4,.48],[H.D5,.7]].forEach(([f,d])=>oud(f,t+.2+d,.5,out,1.8,.85));oud(H.D3,t+.9,.35,out,2.4,.6)})},
  lose(){this.go(t=>{const out=voice(0,.45),H=HICAZ;out.gain.value=.63;[[H.A3,0],[H.G3,.28],[H.Fs3,.56],[H.Eb3,.84],[H.D3,1.2]].forEach(([f,d])=>oud(f,t+d,.45,out,2.2,.45))})}
};

let ID;
function initIds(){ID={suit:G.all,MID:[6,7,8,9,10],DID:[...Array(13)].map((_,i)=>11+i),PID:[],TID:[Z2(),Z2()],BID:[]}}
function Z2(){return {S:[],I:[],K:[],B:[]}}
function pushTab(w,ids){ids.forEach(id=>ID.TID[w][ID.suit[id]].push(id))}
function refillIds(){const need=G.market.length-ID.MID.length;if(need>0){ID.MID=ID.MID.concat(ID.DID.slice(0,need));ID.DID=ID.DID.slice(need)}}

/* ================= actions (shared by player & AI) ================= */
function actSplit(idxs,piles){
  const avail=idxs.map(i=>ID.MID[i]);
  ID.PID=piles.map(p=>p.map(c=>{const j=avail.findIndex(id=>ID.suit[id]===c);return avail.splice(j,1)[0]}));
  ID.MID=ID.MID.filter((_,i)=>!idxs.includes(i));
  const pb=G.price;G=doSplit(G,idxs,piles);priceFx(pb);
  piles.length===3?(sfx.seal(),later(()=>sfx.clank(),180)):sfx.clank();
}
function actCut(pi,ci){const id=ID.PID[pi].splice(ci,1)[0];ID.BID.push(id);const pb=G.price;G=doCut(G,pi,ci);sfx.seal();later(()=>sfx.burn(),120);priceFx(pb);return ID.suit[id]}
function actChoose(pick){
  const ch=1-G.splitter,sp=G.splitter;pushTab(ch,ID.PID[pick]);sfx.coins(Math.max(1,ID.PID[pick].length));
  const rest=ID.PID.filter((_,i)=>i!==pick);
  G=doChoose(G,null,pick);
  if(rest.length===1){pushTab(sp,rest[0]);ID.PID=[];refillIds()}else ID.PID=rest;
}
function actRest(pick){
  const sp=G.splitter;pushTab(sp,ID.PID[pick]);ID.BID.push(...ID.PID[1-pick]);ID.PID=[];
  const pb=G.price;G=doRest(G,pick);refillIds();sfx.coins(1);sfx.burn();priceFx(pb);
}
let flashP={};
function priceFx(pb){
  let up=0,dn=0;SU.forEach(c=>{if(G.price[c]>pb[c]){flashP[c]='up';up=1}else if(G.price[c]<pb[c]){flashP[c]='dn';dn=1}});
  if(up)later(()=>sfx.up(),350);if(dn)later(()=>sfx.down(),350);
  if(up||dn)later(()=>{flashP={}},1600);

let G,first=0,ui={},logs=[],lastTurn=-1,started=false;
/* PNP: this match is two people on one device (no rival AI); HIST: every decision of the match ({w: seat, act}) for the
   review, saved with the game (null for a game resumed from a save made before the review existed) */
let PNP=false,HIST=null;
/* DIFF: the rival of this match. The settings sheet can change set.diff mid-match; that applies to the next game only
   (the rival's strength, his name and face, the stats, share card and passport stay those of the match being played). */
let DIFF=set.diff;
/* Stability v0.4: stale async callbacks never touch a subsequent game. */
let session=0, pendingTimers=new Set();
function later(fn,ms){const token=session;const handle=setTimeout(()=>{pendingTimers.delete(handle);if(token===session)fn()},ms);pendingTimers.add(handle);return handle}
function cancelPending(){session++;pendingTimers.forEach(clearTimeout);pendingTimers.clear();cancelDrag();searchReset()}
/* ---- search off the main thread ----
   The AI's and the teacher's search run in a Web Worker made from a Blob of the engine's own text (this page stays
   one file, also inside the itch.io / CrazyGames packages). Where a worker cannot start (no Worker/Blob, a CSP that
   blocks blob: workers, an error, no answer in 10 s) the same code runs here instead; the results are identical. */
const SEARCH={w:null,off:false,seq:0,pend:new Map(),jobs:0,local:0};
function engineSource(){
  const A='/* ================= engine'+':',B='/* ================= sound';
  for(const sc of document.scripts){const x=sc.text||'',a=x.indexOf(A),b=x.indexOf(B,a);if(a>=0&&b>a)return x.slice(a,b)}
  return null;
}
function searchFallback(){
  SEARCH.off=true;const w=SEARCH.w;SEARCH.w=null;if(w)try{w.terminate()}catch(e){}
  const pend=[...SEARCH.pend.values()];SEARCH.pend.clear();pend.forEach(p=>{clearTimeout(p.timer);runLocal(p.m).then(p.res,p.rej)});
}
function searchWorker(){
  if(SEARCH.w||SEARCH.off)return SEARCH.w;
  try{
    const src=engineSource();if(!src||typeof Worker!=='function'||typeof Blob!=='function'||!window.URL||!URL.createObjectURL)throw new Error('no worker');
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    w.onmessage=e=>{const d=e.data||{},p=SEARCH.pend.get(d.id);if(!p)return;SEARCH.pend.delete(d.id);clearTimeout(p.timer);
      if(d.ok)p.res(d.res);else{console.warn('search worker',d.err);runLocal(p.m).then(p.res,p.rej)}};
    w.onerror=e=>{if(e&&e.preventDefault)e.preventDefault();searchFallback()};
    SEARCH.w=w;
  }catch(e){SEARCH.off=true;SEARCH.w=null}
  return SEARCH.w;
}
function runLocal(m){SEARCH.local++;return new Promise((res,rej)=>setTimeout(()=>{try{res(runJob(m))}catch(e){rej(e)}},0))}
function searchJob(m){
  m=Object.assign({},m,{id:++SEARCH.seq});SEARCH.jobs++;
  const w=searchWorker();if(!w)return runLocal(m);
  return new Promise((res,rej)=>{const p={m,res,rej,timer:setTimeout(searchFallback,10000)};SEARCH.pend.set(m.id,p);
    try{w.postMessage(m)}catch(e){SEARCH.pend.delete(m.id);clearTimeout(p.timer);runLocal(m).then(res,rej)}});
}
/* a new game or a restored one: drop the work still queued for the old one (its answers would be ignored anyway) */
function searchReset(){if(!SEARCH.pend.size)return;const w=SEARCH.w;SEARCH.w=null;if(w)try{w.terminate()}catch(e){}SEARCH.pend.forEach(p=>clearTimeout(p.timer));SEARCH.pend.clear()}
const SAVE_KEY='kantar-game-v04',SAVE_VERSION=5;
function validSave(v){
  if(v&&v.version===4&&v.ui){v.version=5;v.logs=[];v.ui.note=null}
  if(!v||v.version!==SAVE_VERSION||!v.G||!v.ID||!v.ui)return false;
  const g=v.G,id=v.ID;
  if(!Array.isArray(g.all)||g.all.length!==24||!g.all.every(c=>SU.includes(c)))return false;
  if(!Number.isInteger(g.turn)||g.turn<0||g.turn>6||![0,1].includes(g.splitter)||!['split','choose','rest','end'].includes(g.phase))return false;
  if(!['classic','narh'].includes(g.mode)||!Array.isArray(g.tab)||g.tab.length!==2||!Array.isArray(g.seals)||g.seals.length!==2)return false;
  const counts=Z();g.all.forEach(c=>counts[c]++);if(SU.some(c=>counts[c]!==SD[c].n))return false;
  for(const m of [g.market,g.deck,g.hidden,g.open,...(g.piles||[])] )if(!Array.isArray(m)||!m.every(c=>SU.includes(c)))return false;
  for(const obj of [...g.tab,g.burned,g.price])if(!obj||SU.some(c=>!Number.isInteger(obj[c])||obj[c]<0||obj[c]>24))return false;
  if(SU.some(c=>g.price[c]<1||g.price[c]>7))return false;
  if(!Array.isArray(id.MID)||!Array.isArray(id.DID)||!Array.isArray(id.PID)||!Array.isArray(id.BID)||!Array.isArray(id.TID)||id.TID.length!==2)return false;
  const ids=[...id.MID,...id.DID,...id.PID.flat(),...id.BID,...id.TID.flatMap(t=>SU.flatMap(c=>t[c]||[])),0,1,2,3,4,5];
  if(ids.length!==24||new Set(ids).size!==24||ids.some(n=>!Number.isInteger(n)||n<0||n>23))return false;
  if(id.MID.length!==g.market.length||id.PID.length!==(g.piles||[]).length)return false;
  if(id.MID.some((n,i)=>g.all[n]!==g.market[i]))return false;
  if(id.PID.some((p,i)=>p.length!==g.piles[i].length||p.some((n,j)=>g.all[n]!==g.piles[i][j])))return false;
  return Array.isArray(v.logs)&&Array.isArray(v.ui.sel)&&v.ui.sel.length<=3;
}

function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

/* Every card is drawn with innerHTML; a 50-75 KB data: URI in each <img> made every redraw parse ~1.5 MB of text.
   Short blob: URLs of the same images (kept for the page's life) fix that; the data: URIs stay as the fallback. */
try{if(window.URL&&URL.createObjectURL&&typeof Blob==='function')for(const k in FULL_ART){const m=/^data:([^;]+);base64,(.*)$/.exec(FULL_ART[k]);if(!m)continue;const b=atob(m[2]),u=new Uint8Array(b.length);for(let x=0;x<b.length;x++)u[x]=b.charCodeAt(x);FULL_ART[k]=URL.createObjectURL(new Blob([u],{type:m[1]}))}}catch(e){}

function placeCard(mi,pan){
  const n=ui.uc?3:2;pan=Math.min(pan,n-1);
  let x=ui.sel.find(s=>s.mi===mi);
  const occ=ui.uc?ui.sel.find(s=>s.pan===pan&&s.mi!==mi):null;
  if(x){if(occ)occ.pan=x.pan;x.pan=pan}
  else{if(ui.sel.length>=3)return;if(occ){const used=ui.sel.map(s=>s.pan);occ.pan=[0,1,2].find(p=>!used.includes(p))}ui.sel.push({mi,pan})}
  sfx.place();render();
}
function unplace(mi){ui.sel=ui.sel.filter(s=>s.mi!==mi);sfx.place();render()}
function autoPlace(mi){
  if(ui.sel.some(s=>s.mi===mi))return unplace(mi);
  if(ui.sel.length>=3)return;
  let pan;if(ui.uc){const used=ui.sel.map(s=>s.pan);pan=[0,1,2].find(p=>!used.includes(p))}
  else{const n0=ui.sel.filter(x=>x.pan===0).length;pan=n0<=ui.sel.length-n0?0:1}
  placeCard(mi,pan);
}

/* ---- FLIP animation keyed by card identity ---- */
function snap(){const m={};document.querySelectorAll('[data-key]').forEach(el=>{if(!el.closest('.ghost'))m[el.dataset.key]=el.getBoundingClientRect()});return m}
function flip(old){
  document.querySelectorAll('[data-key]').forEach(el=>{
    const o=old[el.dataset.key];if(!o||el.classList.contains('dragging'))return;const n=el.getBoundingClientRect();
    if(!n.width||!n.height)return;
    const dx=o.left-n.left,dy=o.top-n.top,sx=o.width/n.width,sy=o.height/n.height;
    if(Math.abs(dx)<2&&Math.abs(dy)<2&&Math.abs(sx-1)<.02)return;
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

}
function coachText(){

    if(ui.sel.length===0)return t('coach1');
    if(ui.sel.length<3)return t('coach1b',ui.sel.length,3-ui.sel.length);

function decisionInsight(){
  if(!set.pv||ui.busy||!human(ownerOf(G))||G.phase==='end')return '';
  const me=ownerOf(G),op=1-me;
  if(G.phase==='split'){
    if(ui.sel.length!==3)return t('insight0');
    const piles=selPiles(),types=Z();piles.flat().forEach(c=>types[c]++);
    const nar=G.mode==='narh'?SU.filter(c=>types[c]>=2&&G.price[c]>PMIN).map(c=>[c,G.price[c],G.price[c]-1]):[];
    const info=piles.map((p,k)=>`${t('panN',k+1)}: ${pileStr(p)}`).join(' · ');
    return `${t('offerInfo',info)} ${nar.length?t('narhFall',priceList(nar)):''} ${t('thinkRival')}`;
  }
  if(G.phase==='choose'||G.phase==='rest'){
    if(ui.cut)return t('cutInsight');
    const opts=G.piles.map((p,k)=>{
      try{let n=G.phase==='rest'?doRest(G,k):doChoose(G,null,k);
        if(n.phase==='rest'){const x=doRest(n,0),y=doRest(n,1);n=score(x).p[op]-score(x).p[me]>=score(y).p[op]-score(y).p[me]?x:y}
        const now=score(G),after=score(n),delta=after.p[me]-now.p[me];
        const gains=SU.filter(c=>now.suit[c]!==me&&after.suit[c]===me).map(gtag);
        const losses=SU.filter(c=>now.suit[c]===me&&after.suit[c]!==me).map(gtag);
        const signs=[gains.length?t('gains',list(gains)):'',losses.length?t('losses',list(losses)):''].filter(Boolean);
        return `<b>${t('panN',k+1)}:</b> ${pileStr(p)} · ${t('effect')} <span class="${delta>=0?'good':'bad'}">${signed(delta)}</span>${signs.length?' · '+signs.join('; '):''}`;
      }catch(e){return `${t('panN',k+1)}: ${pileStr(p)}`}
    });
    return `${t('compare')} ${opts.join('<hr class="ins-hr">')}<div class="muted ins-note">${t('previewNote')}</div>`;
  }
  return '';
}

let drag=null;
function cancelDrag(){if(!drag)return;const d=drag;drag=null;if(d.g)d.g.remove();if(d.el)d.el.classList.remove('dragging');document.body.classList.remove('isDragging');document.querySelectorAll('.dropOver').forEach(x=>x.classList.remove('dropOver'));}

function hit(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const p=el.closest('.pan.droppable');if(p&&!p.classList.contains('hide'))return {pan:+p.dataset.pan};if(el.closest('#market.live'))return {market:1};return null}

document.addEventListener('pointerdown',e=>{
  ac();const el=e.target.closest('[data-drag]');if(!el||e.button>0||drag)return;
  e.preventDefault();const r=el.getBoundingClientRect();
  drag={pointerId:e.pointerId,el,src:el.dataset.drag,mi:+el.dataset.mi,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,started:false};

document.addEventListener('pointermove',e=>{
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(!drag.started){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.started=true;const g=drag.el.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-key');g.style.width=drag.w+'px';g.style.height=drag.h+'px';
    document.body.appendChild(g);drag.g=g;drag.el.classList.add('dragging');document.body.classList.add('isDragging');sfx.place()}
  drag.g.style.transform=`translate(${e.clientX-drag.ox}px,${e.clientY-drag.oy}px) rotate(5deg) scale(1.08)`;
  /* keep the scale reachable on short screens: scroll while dragging near the top/bottom edge */
  const edge=56;if(e.clientY>innerHeight-edge)scrollBy(0,14);else if(e.clientY<edge)scrollBy(0,-14);
  markDrop(hit(e.clientX,e.clientY));
});
function endDrag(e,cancel){
  if(!drag||((e.type==='pointerup'||e.type==='pointercancel')&&drag.pointerId!==e.pointerId))return;const d=drag;drag=null;document.body.classList.remove('isDragging');markDrop(null);
  if(!d.started){if(!cancel){if(d.src==='m')autoPlace(d.mi);else if(!ui.uc){const x=ui.sel.find(s=>s.mi===d.mi);if(x){x.pan^=1;sfx.place();render()}}else unplace(d.mi)}return}
  const tg=cancel?null:hit(e.clientX,e.clientY);
  const gr=d.g.getBoundingClientRect();d.g.remove();d.el.classList.remove('dragging');
  if(tg&&tg.market){if(d.src==='p')unplace(d.mi);else render()}
  else if(tg)placeCard(d.mi,tg.pan);

  const el=document.querySelector(`[data-key="${ID.MID[d.mi]}"]`);
  if(el){const n=el.getBoundingClientRect(),zz=zoomOf();el.animate([{transform:`translate(${(gr.left-n.left)/zz}px,${(gr.top-n.top)/zz}px) rotate(5deg)`},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})}
}

}
function playerCut(pi,i){
  const me=1-G.splitter;ui.cut0=[pi,i];const pb=G.price,c=actCut(pi,i);ui.cut=false;
  const e={k:'cut',who:me,c,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];render();
}
function playerPick(k){
  if(TCH.key===stateKey(G))teacherFeedback(G.phase,{pick:k});
  if(G.phase==='choose'){
    const me=1-G.splitter,taken=G.piles[k].slice(),rest=G.piles.filter((_,i)=>i!==k);
    histAdd(me,{cut:ui.cut0||null,pick:k});ui.cut0=null;
    addLog({k:'take',who:me,taken,rest:rest.length===1?rest[0].slice():null});
    actChoose(k);
  }else{
    const me=G.splitter,pb=G.price,taken=G.piles[k].slice(),burned=G.piles[1-k].slice();
    histAdd(me,{pick:k});
    actRest(k);addLog({k:'rest',who:me,taken,burned,price:priceDiff(pb,G.price)});
  }
  ui.note=null;advance();
}
/* the rival's noise is seeded by the game and the position: after a reload the rival makes the same move again */
function seedFor(s,diff){const x=s.all.join('')+'|'+stateKey(s)+'|'+diff;let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function aiStep(){
  /* save the position the rival is answering (saves are skipped while it is busy): leaving the page now no longer
     loses the player's last move, nor lets them take it back after seeing which pan the rival takes */
  ui.busy=false;saveGame();
  ui.busy=true;render();
  const delay=G.phase==='split'?(ui.fresh?2000:1100):900;ui.fresh=0;
  /* the search starts now (in the worker) while the rival "studies the stall"; its move is played once both the
     pause and the search are done, and only if nothing changed meanwhile (new game, restore) */
  const token=session,key=stateKey(G),job=searchJob({type:'ai',s:G,diff:DIFF,seed:seedFor(G,DIFF)});
  Promise.all([job,new Promise(r=>later(r,delay))]).then(([act])=>{
    if(token!==session||stateKey(G)!==key||!ui.busy)return;
    const s=G;
    if(s.phase==='split'){histAdd(1,{idxs:act.idxs,piles:act.piles});actSplit(act.idxs,act.piles);const price=priceDiff(s.price,G.price);
      addLog({k:'split',who:1,turn:s.turn+1,piles:act.piles,uc:act.piles.length===3,price});
      ui.note=act.piles.length===3?[{k:'uc',price}]:(price.length?[{k:'price',price}]:null);
      ui.busy=false;advance();}
    else if(s.phase==='choose'){
      histAdd(1,{cut:act.cut||null,pick:act.pick});
      const go=()=>{ui.aiPick=undefined;const piles=G.piles,rest=piles.filter((_,i)=>i!==act.pick);
        const e={k:'take',who:1,taken:piles[act.pick].slice(),rest:rest.length===1?rest[0].slice():null};
        actChoose(act.pick);addLog(e);ui.note=(act.cut&&ui.note?ui.note:[]).concat([e]);ui.busy=false;advance()};
      /* show which pan the rival takes (and what stays with you) for a moment, then move the goods */
      const mark=()=>{ui.aiPick=act.pick;render();later(go,REDUCED?650:950)};
      if(act.cut){const pb=G.price,c=actCut(act.cut[0],act.cut[1]);const e={k:'cut',who:1,c,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];render();later(mark,900)}
      else mark();
    }else{histAdd(1,{pick:act.pick});const pb=G.price,taken=s.piles[act.pick].slice(),burned=s.piles[1-act.pick].slice();actRest(act.pick);
      const e={k:'rest',who:1,taken,burned,price:priceDiff(pb,G.price)};addLog(e);ui.note=[e];ui.busy=false;advance()}
  },e=>console.error('rival',e));
}
/* A pan hangs from one ring, so when the beam swings the bowls lag behind and sway, then settle (damped).
   Uses the separate CSS `rotate` property so it does not fight the translateY that lifts/lowers the pan. */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function swingPans(dAng){if(REDUCED||!ART_ON)return;const a=Math.max(-4.5,Math.min(4.5,dAng*.5));
  [['pan0',1],['pan1',-1]].forEach(([id,sg],k)=>{const p=$(id);if(!p||!p.animate)return;const A=a*sg*(k?1.08:1);
    p.animate([{rotate:'0deg'},{rotate:`${A}deg`,offset:.16},{rotate:`${-A*.58}deg`,offset:.38},{rotate:`${A*.3}deg`,offset:.6},{rotate:`${-A*.12}deg`,offset:.8},{rotate:'0deg'}],
      {duration:1700+k*90,easing:'ease-in-out',delay:120})})}
function banner(text){const b=$('banner');b.textContent=text;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function advance(){
  if(G.turn!==lastTurn){
    if(lastTurn>=0){if(turnBaseline){const recap=turnRecap(turnBaseline);if(recap)addLog(recap)}trail.push(score(G).p.slice())}
    turnBaseline=G.phase==='end'?null:takeTurnBaseline();const note=ui.note;resetUi();ui.note=note;lastTurn=G.turn;
    if(G.phase!=='end'){ui.fresh=1;later(()=>{if(PNP&&passUp())return;PASS.bt=G.turn;banner(bannerText());sfx.turn()},G.turn?250:150)}}
  render();
  if(G.phase==='end'){saveGame();later(()=>showEnd(),1200);return}
  if(PNP)passCheck();else if(ownerOf(G)===1)aiStep();
}
function showEnd(quiet){
  if(!quiet&&set.teach===undefined){set.teach=false;saveSet()}
  if(!quiet)recordGame();
  const r=score(G);const w=r.w;
  const n0=PNP?esc(pname(0)):t('you'),n1=PNP?esc(pname(1)):t('rival'),to=(k,v)=>PNP?t('toN',k?n1:n0,v):k?t('toRival',v):t('toYou',v);
  const head=PNP?(w<0?t('endDraw'):t('endWinN',w?n1:n0)):w===0?t('endWin'):w===1?t('endLose'):t('endDraw');
  const lines=SU.map(c=>[gtag(c),G.price[c],G.tab[0][c],G.tab[1][c],r.suit[c],G.price[c]]);
  lines.push([ki('light')+t('lightLoad'),'',r.tot[0],r.tot[1],r.haf,3]);
  if(r.kefil)lines.push([ki('coin')+t('compCoin'),'',r.kw===0?'✓':'',r.kw===1?'✓':'',r.kw,r.kefil]);
  const rows=lines.map((l,i)=>`<tr style="animation-delay:${quiet?0:.35+i*.35}s"><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]===0?`<b class="${PNP?'p':'g'}">${to(0,l[5])}</b>`:l[4]===1?`<b class="${PNP?'p':'r'}">${to(1,l[5])}</b>`:t('nobody')}</td></tr>`).join('');
  const tight=SU.filter(c=>Math.abs(G.tab[0][c]-G.tab[1][c])===1).map(gtag);
  const why=tight.length?t('tight',list(tight)):'';const EH=t('endHead');
  const art=PNP?`${w<0?'draw':'win'} usta`:`${w===0?'win':w===1?'lose':'draw'} ${DIFF==='usta'?'usta':'cirak'}`;
  const rvOk=!!reviewSteps(),rs=rvSummaryText(0);
  const review=rvOk?`<button class="rv-open" id="endReview" type="button">${ART_ON?`<i class="rv-face${ADV_ON?'':' emb'}" aria-hidden="true"></i>`:''}<span><b>${t('reviewBtn')}</b><small>${PNP?t('reviewSubN'):rs||t('reviewSub')}</small></span><span class="rv-go" aria-hidden="true">›</span></button>`:'';
  $('endSheet').innerHTML=`<button class="xclose" id="closeEnd" type="button" aria-label="${t('lookCounter')}" title="${t('lookCounter')}">×</button>${ART_ON?`<figure class="endart ${art}" aria-hidden="true"></figure>`:''}<h2>${head}</h2><p class="final">${n0} <b>${r.p[0]}</b> · ${n1} <b>${r.p[1]}</b>${r.p[0]===r.p[1]?(G.mode==='classic'?t('tieClassic'):w<0?t('tieLevel'):t('tieNarh')):''}</p>
   ${review}
   <table class="endT"><tr><th>${EH[0]}</th><th>${G.mode==='narh'?EH[1]:EH[2]}</th><th>${PNP?n0:EH[3]}</th><th>${PNP?n1:EH[4]}</th><th>${EH[5]}</th></tr>${rows}</table>
   <p class="small">${why} ${t('hidden',list([0,1,2].map(id=>gtag(ID.suit[id]))))}</p>
   ${trailChart(trail,DIFF,PNP?[pname(0),pname(1)]:null)}
   ${PNP?pnpTallyHTML():''}
   <div class="opts">${PNP?'':`<button class="btn" id="endStats">${t('statsBtn')}</button><button class="btn" id="endShare">${t('shareBtn')}</button>`}<span style="flex:1"></span><button class="btn primary" id="again">${PNP?t('againN',esc(pname(1-first))):t('again',first!==0)}</button></div>
   <div data-hl-next data-hl-lang="${language}"></div>`;
  $('endM').classList.remove('hide');
  if(!quiet){lines.forEach((l,i)=>{if(l[4]>=0)later(()=>sfx.coins(Math.min(6,l[5])),350+i*350)});
    later(()=>w===0?sfx.win():w===1?sfx.lose():sfx.turn(),350+lines.length*350+200);}
  $('again').onclick=()=>{$('endM').classList.add('hide');start(1-first)};
  $('closeEnd').onclick=()=>$('endM').classList.add('hide');
  if($('endStats'))$('endStats').onclick=()=>openStats();
  /* Share: the image card and share sheet of public/hl.js (hidden where sharing is off, e.g. CrazyGames); the plain
     copy/native share without it (the bare source page) */
  const sb=$('endShare');if(sb){if(window.HL&&HL.on)HL.on(sb,shareOpts);else sb.onclick=e=>shareResult(e.currentTarget)}
  if($('endReview'))$('endReview').onclick=openReview;
  /* keyboard: the end sheet is a modal dialog, so focus moves into it (the review, else "Play again") */
  if(!quiet)setTimeout(()=>{if($('endM').classList.contains('hide')||!$('reviewM').classList.contains('hide'))return;const b=$('endReview')||$('again');if(b)try{b.focus({preventScroll:true})}catch(e){}},60);
}
function start(f){setTimeout(fit,120);PREV_TAB=null;setTimeout(()=>{if(set.zoom==='fit')applyZoom()},80);KS={t0:Date.now(),tm:0,tb:0,tg:0,ap:0,left:false};PNP=!!set.pnp;track('kantar_game_start',{mode:PNP?'pnp':set.mode,rules:set.mode,diff:set.diff,teacher:set.teach===undefined?true:!!set.teach,first:f===0?'you':'rival'});teachMode=set.teach===undefined?true:!!set.teach;TCH.key=null;TCH.data=null;turnBaseline=null;cancelPending();clearSave();started=true;first=f;DIFF=set.diff;G=newGame(f,set.mode,set.tut);initIds();HIST=[];REV.key=null;REV.run++;$('reviewM').classList.add('hide');PASS.seat=-1;PASS.bt=-1;$('passM').classList.add('hide');logs=[];trail=[score(G).p.slice()];lastTurn=-1;ui={note:null};resetUi();flashP={};fit();advance()}

/* ---- responsive scale ---- */
function fit(){/* the scale's own column (the advice column may sit beside it) */const sc=$('scale'),w=(sc.clientWidth||$('counter').clientWidth)-12;let f=Math.min(1,w/680);
  /* on a short desktop window (wide board, table size 100%) the scale gives up a little height so your own stock
     comes into view; never below 85%, so the goods on the pans stay readable */
  sc.style.setProperty('--f',f.toFixed(3));
  if(getComputedStyle($('counter')).display==='grid'&&(set.zoom||'1')==='1'&&started){const ys=$('youStall').getBoundingClientRect().bottom+scrollY,over=ys-innerHeight+8,h=sc.getBoundingClientRect().height/f;
    if(over>0)f=Math.max(.85*f,f-over/h)}
  sc.style.setProperty('--f',f.toFixed(3));sc.style.setProperty('--cz',Math.min(1.45,Math.max(1,.8/f)).toFixed(3));document.body.classList.toggle('narrow',f<.85)}
addEventListener('resize',()=>{fit();if(set.zoom==='fit')applyZoom()});
['statsM','endM','rules'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target!==e.currentTarget)return;if(id==='rules'){if(started)closeRules()}else $(id).classList.add('hide')}));

/* ---- static text + language switch ---- */
function applyStatic(){
  document.documentElement.lang=language;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle)});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria))});
  const gh=t('goodsHead');
  $('goodsKey').innerHTML=`<table class="mk-goods"><thead><tr><th><span class="sr">${gh[0]}</span></th>${SU.map(c=>`<th title="${gname(c)}"><span role="img" aria-label="${gname(c)}">${sym(c)}</span></th>`).join('')}</tr></thead>`+
    `<tbody><tr><th scope="row"><span class="mk-gl" role="img" title="${gh[1]}" aria-label="${gh[1]}"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15.5h14M4 12h12M5 8.5h10M6 5h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span></th>${SU.map(c=>`<td>${SD[c].n}</td>`).join('')}</tr>`+
    `<tr class="st"><th scope="row"><span class="mk-gl coin" role="img" title="${gh[2]}" aria-label="${gh[2]}">${ART_ON?'':'¤'}</span></th>${SU.map(c=>`<td>${SD[c].p}</td>`).join('')}</tr></tbody></table>`;
  $('rulesGoods').innerHTML=SU.map(c=>card(c)).join('');
  $('playBtn').textContent=started?t('newWith'):t('open');

  $('languageSelect').value=language;
  [0,1].forEach(i=>{const el=$('pName'+i);if(el)el.placeholder=t('pDefault',i+1)});
}
function setLanguage(l){
  language=l==='tr'?'tr':'en';try{localStorage.setItem('kantar-lang',language)}catch(e){}
  $('banner').textContent='';$('banner').classList.remove('show');TCH.key=null;TCH.data=null;applyStatic();if(G)render();if(!$('endM').classList.contains('hide')&&G&&G.phase==='end')showEnd(true);if(!$('reviewM').classList.contains('hide'))drawReview();if(passUp()&&G)showPass(PASS.want);

$('languageSelect').addEventListener('change',e=>setLanguage(e.target.value));
/* ---- market panel: the icon opens its explanation ---- */
function closeTips(){document.querySelectorAll('.mk-tip.open').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.mk-ic[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
document.querySelectorAll('.mk-ic').forEach(b=>{
  b.addEventListener('click',()=>{const tp=$(b.dataset.tip),on=!tp.classList.contains('open');closeTips();b.closest('.mk-row').classList.remove('mute');if(on){tp.classList.add('open');b.setAttribute('aria-expanded','true')}});
  const unmute=()=>b.closest('.mk-row').classList.remove('mute');b.addEventListener('mouseleave',unmute);b.addEventListener('blur',unmute);

document.addEventListener('pointerdown',e=>{if(!e.target.closest('.mk-ic,.mk-tip'))closeTips()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const open=document.querySelector('.mk-tip.open');

  if(open){closeTips();e.stopImmediatePropagation()}},true);

/* ---- setup ---- */
function syncOpts(){
  document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>{const k=sg.dataset.set,on=k==='diff'?(b.dataset.v==='pnp'?!!set.pnp:!set.pnp&&set.diff===b.dataset.v):set[k]===b.dataset.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')}));
  $('optTut').checked=set.tut;$('optTeach').checked=set.teach===undefined?true:!!set.teach;$('optPv').checked=set.pv;$('optSnd').checked=set.snd;
  document.querySelectorAll('.narhOnly').forEach(e=>e.style.opacity=set.mode==='narh'?1:.45);
  document.querySelectorAll('.pnpOnly').forEach(e=>e.hidden=!set.pnp);
  [0,1].forEach(i=>{const el=$('pName'+i);if(el&&document.activeElement!==el)el.value=set.names[i]||''});
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.set;if(k==='diff'){set.pnp=b.dataset.v==='pnp';if(!set.pnp)set.diff=b.dataset.v}else set[k]=b.dataset.v;saveSet();renderStart();syncOpts();if(b.parentElement.dataset.set==='zoom')applyZoom()});
/* Table size: zooms the board (not the sheets). "fit" sizes it so the header, both stalls and the scale fit the window height. */
function zoomOf(){const w=document.querySelector('.wrap');return parseFloat(w&&w.style.zoom)||1}
function applyZoom(){const w=document.querySelector('.wrap');if(!w)return;let z=parseFloat(set.zoom)||1;
  const tri=set.zoom==='fit'&&innerWidth>=1680&&innerWidth/innerHeight>=1.3/* three columns only where the board keeps its advice column */;w.classList.toggle('tri',tri);
  if(set.zoom==='fit'){const need=()=>{const hd=document.querySelector('header.top').getBoundingClientRect(),c=document.querySelector('main.center').getBoundingClientRect();return (c.bottom-hd.top)/zoomOf()+28};
    /* the layout width depends on the zoom (narrower board -> smaller scale -> shorter page), so settle in two passes */
    w.style.zoom='';fit();z=Math.max(.55,Math.min(1,(innerHeight-6)/need()));
    w.style.zoom=z>=.995?'':z.toFixed(3);fit();z=Math.max(.55,Math.min(1,(innerHeight-6)/need()))}
  w.style.zoom=z>=.995?'':z.toFixed(3);fit()}
$('optTut').onchange=e=>{set.tut=e.target.checked;saveSet()};
[0,1].forEach(i=>$('pName'+i).addEventListener('input',e=>{set.names[i]=e.target.value.slice(0,14);saveSet();if(G&&started&&PNP)render()}));
$('optPv').onchange=e=>{set.pv=e.target.checked;saveSet()};
$('optSnd').onchange=e=>{set.snd=e.target.checked;saveSet()};
function beginFromSetup(learning=false){

  saveSet();$('rules').classList.add('hide');ac();sfx.coin();start(learning?0:first);
  requestAnimationFrame(()=>{const b=document.querySelector('#market [data-drag]');if(b)b.focus({preventScroll:true})});
}
$('learnBtn').onclick=()=>beginFromSetup(true);
$('learnAgain').onclick=()=>beginFromSetup(true);

// "Play without the teacher": the same gentle start, teacher off (it can be switched on again in the game's header)
$('noTeachBtn').onclick=()=>{set.teach=false;syncOpts();beginFromSetup()};
$('setupDetails').addEventListener('toggle',e=>{if(e.target.open){syncOpts();requestAnimationFrame(()=>e.target.scrollIntoView({behavior:'smooth',block:'start'}))}});
/* which start the sheet offers: first visit, saved settings, or a match in progress */
var startMode='first';
function renderStart(){

  $('welcomeSteps').hidden=!first;
  $('learnBtn').hidden=!first;$('noTeachBtn').hidden=!first;
  $('quickPlay').hidden=startMode!=='saved';$('quickResume').hidden=!resume;$('learnAgain').hidden=first;
  const te=set.teach===undefined?true:!!set.teach;
  $('startNote').textContent=first?t('startNoteLearn'):resume?t('startNoteResume',Math.min(6,((previousSave&&previousSave.G&&previousSave.G.turn)||0)+1))
    :t('startNoteSaved',set.pnp?t('pnp'):set.diff==='usta'?t('master'):t('apprentice'),set.mode==='narh'?t('modeNarh'):t('modeClassic'),te);
}
const closeRules=()=>{$('rules').classList.add('hide');if(G)render()};$('resumeBtn').onclick=closeRules;$('rulesX').onclick=closeRules;
$('rulesBtn').onclick=()=>{$('welcome').hidden=true;$('setupDetails').open=true;applyStatic();$('resumeBtn').style.display='none';$('rulesX').hidden=!started;syncOpts();$('rules').classList.remove('hide')};
$('statsBtn').onclick=openStats;
$('newBtn').onclick=()=>{closeReview();$('endM').classList.add('hide');$('rules').classList.add('hide');start(0)};
$('sndBtn').onclick=()=>{set.snd=!set.snd;saveSet();if(set.snd)sfx.coin();if(G)render()};
$('pvBtn').onclick=()=>{set.pv=!set.pv;saveSet();if(G)render()};
$('teachBtn').onclick=()=>setTeach(!teachMode);
$('optTeach').onchange=e=>{set.teach=e.target.checked;saveSet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){/* the top sheet first: stats can open over the end sheet */if(!$('reviewM').classList.contains('hide'))closeReview();else if(!$('statsM').classList.contains('hide'))$('statsM').classList.add('hide');else if(!$('endM').classList.contains('hide'))$('endM').classList.add('hide');else if(started&&!$('rules').classList.contains('hide')){$('rules').classList.add('hide');render()}}});
applyStatic();syncOpts();
// the short start sheet is always first; the full rules and options stay folded until asked for
$('welcome').hidden=false;$('setupDetails').open=false;
startMode=hasSavedSettings?'saved':'first';
G=newGame(0,set.mode,set.tut);initIds();resetUi();fit();draw();applyZoom();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(set.zoom==='fit')applyZoom()});
const previous=readSave();var previousSave=previous;
if(previous){startMode='resume';const go=()=>{$('rules').classList.add('hide');ac();restoreGame(previous)};
  $('resumeSaved').style.display='';$('resumeSaved').onclick=go;$('quickResume').onclick=go;}
renderStart();
