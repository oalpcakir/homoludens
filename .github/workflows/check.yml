# Builds the whole site from src/, checks that public/ matches, validates links and metadata, and runs the tests.
# It never deploys: Cloudflare still deploys on its own when main changes.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build and compare with public/
        run: python3 build.py --check
      - name: Tests (worker with mocked KV/Resend, Retourvloot model)
        run: node --test tests/*.test.mjs

  # Browser tests: the site pages (smoke) and the itch.io / CrazyGames packages (mocked SDK). Still no deploy.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # six games of browser tests on a 2-core runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (site)
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.log
      # failing tests become annotations on the run, so they can be read without downloading the log
      - name: Report failing smoke tests
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          s = open("smoke.log", encoding="utf-8", errors="replace").read()
          for m in re.finditer(r"^not ok \d+ - (.*)$\n((?:[ \t].*\n){0,60})", s, re.M):
              keep = [l.strip() for l in m.group(2).splitlines() if re.search(r"error|Error|expected|actual|location|message|Timeout|at file", l)]
              body = " | ".join(keep)[:1500].replace("%", "%25").replace("\n", " ")
              print(f"::error title=smoke failed: {m.group(1)[:150]}::{body}")
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-log
          path: smoke.log
      - name: Build and test the platform packages
        run: |
          python3 src/platform/build_platforms.py
          npm run platforms
      - uses: actions/upload-artifact@v7
        with:
          name: platform-packages
          path: dist/platforms/*/*.zip
