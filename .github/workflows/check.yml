# Builds the whole site from src/, checks that public/ matches, validates links and metadata, and runs the tests.
# It never deploys: Cloudflare still deploys on its own when main changes.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and compare with public/
        run: python3 build.py --check
      - name: Tests (worker with mocked KV/Resend, Retourvloot model)
        run: node --test tests/*.test.mjs

  # Browser tests: the site pages (smoke) and the itch.io / CrazyGames packages (mocked SDK). Still no deploy.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # six games of browser tests on a 2-core runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (site)
        run: npm run smoke
      - name: Build and test the platform packages
        run: |
          python3 src/platform/build_platforms.py
          npm run platforms
      - uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: dist/platforms/*/*.zip
